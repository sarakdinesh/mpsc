{id:"ec4",s:"eco",t:"सार्वजनिक वित्त: अर्थसंकल्प, कर, GST",imp:3,
pyq:"तुटीचे प्रकार, प्रत्यक्ष व अप्रत्यक्ष कर, GST परिषद, आणि वित्त आयोग यावर प्रश्न येतात.",
d:`## अर्थसंकल्प
- संविधानात 'अर्थसंकल्प' हा शब्द नाही. कलम 112 मध्ये '<b>वार्षिक वित्तीय विवरणपत्र</b>' असा शब्द आहे. राज्यांसाठी कलम 202.
- भारताचे आर्थिक वर्ष 1 एप्रिल ते 31 मार्च असते. 2017 पासून केंद्रीय अर्थसंकल्प 1 फेब्रुवारीला मांडला जातो, आणि रेल्वे अर्थसंकल्प सर्वसाधारण अर्थसंकल्पात विलीन झाला.
- महसुली जमा (कर व करेतर उत्पन्न) आणि भांडवली जमा (कर्जे, निर्गुंतवणूक).
## तुटीचे प्रकार
|तूट|सूत्र|
|महसुली तूट|महसुली खर्च − महसुली जमा|
|<b>राजकोषीय तूट</b>|एकूण खर्च − (महसुली जमा + कर्जेतर भांडवली जमा) = सरकारला घ्यावे लागणारे <b>एकूण कर्ज</b>|
|प्राथमिक तूट|राजकोषीय तूट − व्याज देणी|
राजकोषीय शिस्तीसाठी <b>FRBM कायदा 2003</b> आहे.
## कर
- <b>प्रत्यक्ष कर</b> (ज्याच्यावर लावला तोच भरतो): आयकर, कंपनी कर.
- <b>अप्रत्यक्ष कर</b> (भार दुसऱ्यावर ढकलला जातो): GST, सीमाशुल्क.
## GST (वस्तू व सेवा कर)
- <b>101 वी घटनादुरुस्ती 2016</b>; अंमलबजावणी <b>1 जुलै 2017</b> पासून. 'एक देश, एक कर'.
- प्रकार: CGST (केंद्र), SGST (राज्य), IGST (दोन राज्यांमधील व्यवहार).
- <b>GST परिषद</b> (कलम 279A) चे अध्यक्ष <b>केंद्रीय अर्थमंत्री</b> असतात; राज्यांचे अर्थमंत्री सदस्य असतात.
- GST विधेयकाला मान्यता देणारे पहिले राज्य आसाम.
- मानवी सेवनासाठीचे मद्य GST बाहेर आहे; पेट्रोलियम उत्पादने सध्या GST बाहेर आहेत.
- <b>GST 2.0</b> (56 वी GST परिषद, सप्टेंबर 2025): <b>22 सप्टेंबर 2025</b> पासून मुख्य दर फक्त दोन: <b>5% व 18%</b>; तंबाखूसारख्या 'पाप' व चैनीच्या वस्तूंवर 40%. 12% व 28% हे जुने दर रद्द. (जुन्या पुस्तकांत 5 दर दिसतात; ते आता लागू नाहीत.)
## परकीय व्यापार व व्यवहारतोल
- <b>व्यवहारतोल</b> (Balance of Payments): <b>चालू खाते</b> (वस्तू व सेवांची आयात-निर्यात, परदेशातून येणारे पैसे) + <b>भांडवली खाते</b> (परकीय गुंतवणूक, कर्जे).
- <b>व्यापारतोल</b> = फक्त वस्तूंची निर्यात − आयात. भारताचा व्यापारतोल सहसा तुटीचा असतो (कच्चे तेल, सोने यांची आयात).
- चालू खात्यावर रुपया पूर्ण परिवर्तनीय: 1994. <b>FEMA 1999</b> ने FERA 1973 ची जागा घेतली.
- <b>WTO</b>: 1 जानेवारी 1995, मुख्यालय जिनेव्हा; भारत संस्थापक सदस्य.
- परकीय व्यापार धोरण DGFT (वाणिज्य मंत्रालय) ठरवते; सध्याचे परकीय व्यापार धोरण 2023 (1 एप्रिल 2023 पासून).
## लेखा व लेखापरीक्षण
- <b>भारताचा एकत्रित निधी</b> कलम 266(1) · <b>सार्वजनिक लेखा</b> 266(2) · <b>आकस्मिकता निधी</b> कलम 267 (राष्ट्रपतींच्या ताब्यात). सापळा: 266 आणि 267 यांची अदलाबदल करून पर्याय दिले जातात.
- <b>CAG</b> (कलम 148): कार्यकाळ 6 वर्षे किंवा वय 65; अहवाल राष्ट्रपतींना (राज्याचा राज्यपालांना) देतो, आणि ते संसदेत मांडले जातात.
- CAG चे अहवाल संसदेची <b>लोकलेखा समिती</b> (PAC) तपासते; तिचे अध्यक्ष परंपरेने विरोधी पक्षाचे असतात.
## वित्त आयोग (कलम 280)
केंद्र व राज्यांमध्ये करांचे वाटप सुचवण्यासाठी राष्ट्रपती दर 5 वर्षांनी वित्त आयोग नेमतात. पहिला वित्त आयोग (1951) के. सी. नियोगी यांच्या अध्यक्षतेखाली होता. 16 व्या वित्त आयोगाचे अध्यक्ष <b>अरविंद पनगढिया</b> आहेत (2026–31 कालावधीसाठी).
## कर सुधारणा समित्या व कायदे
|समिती/कायदा|वर्ष|माहिती|
|<b>राजा चेलय्या समिती</b>|1991|कर रचनेत सुधारणा|
|केळकर कृती दल|2002|प्रत्यक्ष व अप्रत्यक्ष कर सुधारणा|
|<b>FRBM कायदा</b>|2003; अंमल <b>5 जुलै 2004</b>|राजकोषीय तूट कमी करण्याचे बंधन|
|FRBM आढावा समिती|मे 2016|अध्यक्ष <b>एन. के. सिंह</b>|
|<b>VAT</b> (मूल्यवर्धित कर)|<b>1 एप्रिल 2005</b> पासून बहुतेक राज्यांत|हरियाणाने 2003 मध्येच लागू केला; 2017 मध्ये GST ने जागा घेतली|
- वित्त आयोग: 14 वा <b>वाय. व्ही. रेड्डी</b> (2015–20) · 15 वा एन. के. सिंह (2020–26).
- राजकोषीय धोरणाची साधने: <b>कर, सार्वजनिक खर्च, सार्वजनिक कर्ज</b>. (रेपो दर, CRR ही चलनविषयक धोरणाची साधने आहेत.)
- <b>तुटीचे अर्थभरण</b> (नवीन चलन छापून तूट भरणे) केल्यास किंमत पातळी वाढते, म्हणजे महागाई.`,
sn:["अर्थसंकल्प: कलम 112 'वार्षिक वित्तीय विवरणपत्र' · राज्य 202 · 1 फेब्रुवारीला","राजकोषीय तूट = सरकारचे एकूण कर्ज · प्राथमिक तूट = राजकोषीय तूट − व्याज","FRBM कायदा 2003","प्रत्यक्ष: आयकर, कंपनी कर · अप्रत्यक्ष: GST, सीमाशुल्क","GST: 101 वी दुरुस्ती, 1 जुलै 2017; परिषद 279A, अध्यक्ष केंद्रीय अर्थमंत्री; पहिली मान्यता आसाम","वित्त आयोग 280: पहिला के. सी. नियोगी · 16 वा अरविंद पनगढिया","GST 2.0: 22 सप्टें 2025 पासून 5% व 18% (+ 40% पाप वस्तू)","व्यवहारतोल = चालू खाते + भांडवली खाते · FEMA 1999 · WTO 1995","एकत्रित निधी 266 · आकस्मिकता निधी 267 · CAG 148 (6 वर्षे/65) → लोकलेखा समिती","चेलय्या 1991 (कर) · FRBM अंमल 5 जुलै 2004 · VAT 1 एप्रिल 2005 · 14 वा वित्त आयोग वाय. व्ही. रेड्डी"],
tr:["GST परिषदेचे अध्यक्ष पंतप्रधान असा चुकीचा पर्याय दिला जातो; अध्यक्ष केंद्रीय अर्थमंत्री असतात.","प्राथमिक तूट आणि महसुली तूट यांच्या सूत्रांची अदलाबदल केली जाते."],
q:[]},

{id:"ec5",s:"eco",t:"नियोजन: पंचवार्षिक योजना व नीती आयोग",imp:2,
pyq:"योजना–उद्दिष्ट–प्रतिमान जोड्या आणि नियोजनपूर्व योजना (बॉम्बे प्लॅन इ.) यावर प्रश्न येतात.",
d:`## स्वातंत्र्यपूर्व योजना
|योजना|कोणी|
|'प्लॅन्ड इकॉनॉमी फॉर इंडिया' (1934; पहिली)|एम. विश्वेश्वरय्या|
|बॉम्बे प्लॅन (1944)|मुंबईचे 8 उद्योगपती|
|गांधीवादी योजना|श्रीमन नारायण अग्रवाल|
|जनता योजना (पीपल्स प्लॅन)|एम. एन. रॉय|
## नियोजन आयोग
15 मार्च 1950 ला स्थापन झाला; अध्यक्ष पंतप्रधान. राष्ट्रीय विकास परिषद 1952 मध्ये आली.
|योजना|कालावधी|मुख्य मुद्दा|
|पहिली|1951–56|<b>शेती</b>; हॅरॉड-डोमर प्रतिमान; यशस्वी|
|दुसरी|1956–61|<b>जड उद्योग</b>; <b>महालनोबीस प्रतिमान</b>|
|तिसरी|1961–66|स्वयंपूर्णता; चीन व पाकिस्तान युद्धे आणि दुष्काळामुळे अपयशी|
|योजना सुटी|1966–69|तीन वार्षिक योजना|
|चौथी|1969–74|स्थैर्यासह वृद्धी|
|पाचवी|1974–79|'<b>गरिबी हटाव</b>'; 1978 ला एक वर्ष आधी बंद|
|सरकती योजना|1978–80|जनता सरकार|
|आठवी|1992–97|1991 च्या सुधारणांनंतर; मानवी विकास|
|अकरावी|2007–12|'<b>समावेशक वृद्धी</b>'|
|बारावी (शेवटची)|2012–17|जलद, शाश्वत व अधिक समावेशक वृद्धी|
## नीती आयोग
<b>1 जानेवारी 2015</b> पासून नियोजन आयोगाच्या जागी आला (NITI = National Institution for Transforming India). अध्यक्ष <b>पंतप्रधान</b>; सोबत उपाध्यक्ष आणि CEO. तो 'थिंक टँक' म्हणून काम करतो, आणि 'सहकारी संघराज्यवाद' हे त्याचे तत्त्व आहे. पंचवार्षिक योजनांऐवजी दीर्घकालीन दृष्टिकोन दस्तऐवज बनवले जातात.`,
sn:["पहिली योजना-कल्पना: विश्वेश्वरय्या 1934 · बॉम्बे प्लॅन 1944","नियोजन आयोग 15 मार्च 1950; अध्यक्ष पंतप्रधान","पहिली योजना: शेती (हॅरॉड-डोमर) · दुसरी: उद्योग (महालनोबीस)","योजना सुटी 1966–69 · पाचवी: गरिबी हटाव · अकरावी: समावेशक वृद्धी","बारावी 2012–17 शेवटची","नीती आयोग 1 जानेवारी 2015; अध्यक्ष पंतप्रधान; सहकारी संघराज्यवाद"],
tr:["पहिली योजना उद्योगावर आणि दुसरी शेतीवर अशी उलटी जोडी दिली जाते; प्रत्यक्षात पहिली शेतीवर, दुसरी उद्योगावर.","नीती आयोगाचे अध्यक्ष उपाध्यक्ष असतात असा चुकीचा पर्याय दिला जातो; अध्यक्ष पंतप्रधान असतात."],
q:[]},

{id:"ec6",s:"eco",t:"दारिद्र्य, बेरोजगारी व सरकारी योजना",imp:3,
pyq:"योजना व सुरू झाल्याचे वर्ष, दारिद्र्यरेषेच्या समित्या, आणि रोजगार हमी यावर प्रश्न येतात. महाराष्ट्र शासनाच्या योजनाही विचारल्या जातात.",
d:`## दारिद्र्य
दारिद्र्यरेषा ठरवण्यासाठी समित्या नेमल्या गेल्या: लकडावाला (1993), <b>तेंडुलकर</b> (2009; त्यानुसार 2011–12 मध्ये देशात 21.9% दारिद्र्य), रंगराजन (2014). नीती आयोग आता <b>बहुआयामी दारिद्र्य निर्देशांक</b> (आरोग्य, शिक्षण, राहणीमान) काढतो.
## बेरोजगारीचे प्रकार
|प्रकार|उदाहरण|
|<b>छुपी</b>|5 जणांचे काम 8 जण करतात (शेतीत)|
|<b>हंगामी</b>|शेतीचा हंगाम संपल्यावर काम नसणे|
|संरचनात्मक|अर्थव्यवस्थेतील बदलामुळे कौशल्य निरुपयोगी होणे|
|घर्षणात्मक|एक नोकरी सोडून दुसरी शोधण्याचा मधला काळ|
|सुशिक्षित बेरोजगारी|शिक्षण असूनही योग्य काम न मिळणे|
## रोजगार हमी
- महाराष्ट्राची <b>रोजगार हमी योजना</b> 1972 च्या दुष्काळात सुरू झाली आणि 1977 मध्ये तिचा कायदा झाला. संकल्पना <b>वि. स. पागे</b> यांची; म्हणून त्यांना रोजगार हमी योजनेचे जनक म्हणतात. अशी योजना राबवणारे महाराष्ट्र हे देशातील पहिले राज्य.
- <b>मनरेगा</b>: कायदा 2005; 2 फेब्रुवारी 2006 पासून अंमल. ग्रामीण कुटुंबाला वर्षातून <b>100 दिवस</b> अकुशल कामाची हमी; किमान 1/3 लाभार्थी महिला.

## किंमत धोरण
- <b>हमीभाव (MSP)</b>: शेतकऱ्यांना किमान किंमत मिळण्याची हमी. केंद्र सरकार ती <b>कृषी खर्च व मूल्य आयोगाच्या (CACP)</b> शिफारशीवरून जाहीर करते. CACP 1965 मध्ये स्थापन झाला.
- <b>भारतीय अन्न महामंडळ (FCI)</b> 1965: धान्य खरेदी व साठवण.
- सार्वजनिक वितरण प्रणाली (रेशन) आणि राष्ट्रीय अन्न सुरक्षा कायदा 2013.
## सहकार चळवळ
- भारतात पहिला सहकारी संस्था कायदा 1904 मध्ये आला.
- महाराष्ट्र सहकारी संस्था अधिनियम 1960.
- आशियातील पहिला सहकारी साखर कारखाना प्रवरानगर (लोणी), संस्थापक विठ्ठलराव विखे पाटील.
- <b>97 वी घटनादुरुस्ती (2011)</b>: सहकारी संस्थांना घटनात्मक दर्जा (भाग IX-B; कलम 43B; सहकारी संस्था स्थापण्याचा हक्क कलम 19(1)(c) मध्ये).
- 2021 मध्ये केंद्रात स्वतंत्र सहकार मंत्रालय स्थापन झाले.
- महाराष्ट्राला '<b>सहकाराचे माहेरघर</b>' म्हणतात. वैकुंठभाई मेहता हे सहकार चळवळीतील मोठे नाव आहे.

- सहकार चळवळीवरील <b>मॅक्लेगन समिती</b>: 1915.`,

## साधित एकके

इतर: <b>प्रकाशवर्ष</b> हे अंतराचे एकक आहे, काळाचे नाही (प्रकाश एका वर्षात जेवढे अंतर जातो) · 1 अश्वशक्ती = 746 वॉट · 1 kWh (विजेचे 1 युनिट) = 36 लाख ज्यूल · नॉट = जहाजाचा वेग · ध्वनीची तीव्रता डेसिबलमध्ये मोजतात (हे SI एकक नाही).

## तापमान
- सूत्रे: <b>°F = (°C × 9/5) + 32</b> · <b>K = °C + 273</b>.

- मानवी शरीराचे सामान्य तापमान 37°C = 98.6°F. पाणी 100°C ला उकळते आणि 0°C ला गोठते.

{id:"sc2",s:"sci",t:"गती, बल, गुरुत्वाकर्षण व दाब",imp:2,
pyq:"न्यूटनचे नियम व त्यांची उदाहरणे, वजन व वस्तुमान यातील फरक, आणि पास्कल व आर्किमिडीजचे तत्त्व यावर प्रश्न येतात.",
d:`## गती
- <b>चाल</b> (फक्त किती वेगाने): अदिश राशी · <b>वेग</b> (चाल + दिशा): सदिश राशी.
- <b>त्वरण</b> = वेगातील बदल ÷ वेळ (एकक m/s²).
- <b>संवेग</b> p = m × v (वस्तुमान × वेग).
## न्यूटनचे गतीचे नियम
|नियम|अर्थ|उदाहरण|
|पहिला (जडत्वाचा)|बाह्य बल लागेपर्यंत वस्तू आपली स्थिती बदलत नाही|बस अचानक थांबल्यावर प्रवासी पुढे झुकतात|
|दुसरा|<b>F = m × a</b>|जड वस्तू ढकलायला जास्त बल लागते|
|तिसरा|प्रत्येक क्रियेला समान व विरुद्ध प्रतिक्रिया|<b>रॉकेट</b>, बंदुकीचा मागे धक्का, पोहणे|
## गुरुत्वाकर्षण
- गुरुत्वाकर्षणाचा नियम न्यूटनने मांडला.
- पृथ्वीवर g = <b>9.8 m/s²</b>. g ध्रुवांवर सर्वाधिक, विषुववृत्तावर कमी, आणि पृथ्वीच्या केंद्रावर शून्य असतो.
- <b>वस्तुमान</b> सगळीकडे सारखे राहते (एकक kg). <b>वजन</b> = m × g, ठिकाणानुसार बदलते (एकक न्यूटन). चंद्रावर वजन पृथ्वीच्या 1/6 असते.
- पृथ्वीवरून सुटका वेग <b>11.2 km/s</b>.
- कृत्रिम उपग्रहात अंतराळवीरांना वजनरहित अवस्था जाणवते.
## दाब
- दाब = बल ÷ क्षेत्रफळ. म्हणून सुई टोकदार, आणि उंटाचे पाय रुंद असतात.
- वातावरणाचा दाब समुद्रसपाटीला 76 सें.मी. पाऱ्याइतका (सुमारे 101 kPa) असतो. उंचीवर दाब कमी होतो.
- <b>पास्कलचा नियम</b>: बंद द्रवावरील दाब सर्व दिशांना समान पसरतो. उपयोग: हायड्रॉलिक ब्रेक, हायड्रॉलिक जॅक.
- <b>आर्किमिडीजचे तत्त्व</b>: द्रवात बुडालेल्या वस्तूवर उत्प्लावक बल कार्य करते. उपयोग: जहाज तरंगणे.
- बर्फाची घनता पाण्यापेक्षा कमी असल्याने बर्फ पाण्यावर तरंगतो.`,
sn:["चाल अदिश, वेग सदिश · त्वरण m/s² · संवेग p = mv","पहिला नियम जडत्व · दुसरा F = ma · तिसरा क्रिया-प्रतिक्रिया (रॉकेट)","g = 9.8 m/s²; ध्रुवांवर जास्त, केंद्रावर शून्य","वस्तुमान स्थिर, वजन बदलते; चंद्रावर 1/6","सुटका वेग 11.2 km/s","पास्कल: हायड्रॉलिक ब्रेक · आर्किमिडीज: जहाज तरंगणे"],
tr:["रॉकेट तिसऱ्या नियमावर उडते; पहिला किंवा दुसरा नियम असे चुकीचे पर्याय दिले जातात.","चंद्रावर वस्तुमान 1/6 होते असा चुकीचा पर्याय दिला जातो; वस्तुमान तेच राहते, फक्त वजन 1/6 होते."],
q:[]},

{id:"sc3",s:"sci",t:"कार्य, ऊर्जा, उष्णता व ध्वनी",imp:2,
pyq:"उष्णतेच्या संक्रमणाचे प्रकार, पाण्याचे असंगत प्रसरण, ध्वनीचा वेग, आणि श्राव्य व अतिध्वनी लहरी यावर प्रश्न येतात.",
d:`## कार्य व ऊर्जा
- कार्य = बल × विस्थापन (ज्यूल). <b>शक्ती</b> = कार्य ÷ वेळ (वॉट).
- गतिज ऊर्जा = ½mv² (गतीमुळे) · स्थितिज ऊर्जा = mgh (उंचीमुळे).
- <b>ऊर्जा अक्षय्यतेचा नियम</b>: ऊर्जा निर्माण किंवा नष्ट होत नाही; फक्त तिचे रूपांतर होते.
- रूपांतरणे: विद्युत मोटर (विद्युत → यांत्रिक) · जनित्र (यांत्रिक → विद्युत) · बॅटरी (रासायनिक → विद्युत) · सौर घट (प्रकाश → विद्युत).
## उष्णता
|प्रकार|माध्यम|उदाहरण|
|<b>वहन</b>|घन पदार्थ|चमच्याचे दुसरे टोक गरम होणे|
|<b>अभिसरण</b>|द्रव व वायू|पाणी उकळणे, समुद्री वारे|
|<b>प्रारण</b>|माध्यमाची गरज नाही|सूर्याची उष्णता पृथ्वीवर येणे|
- पाण्याची विशिष्ट उष्माधारकता सर्वाधिक आहे. म्हणून समुद्रकिनारी हवामान सौम्य असते.
- <b>पाण्याचे असंगत प्रसरण</b>: पाण्याची घनता <b>4°C</b> ला सर्वाधिक असते. म्हणून हिवाळ्यात तलावाचा वरचा भाग गोठला तरी खाली पाणी राहते, आणि जलचर जिवंत राहतात.
- उंचीवर दाब कमी असल्याने पाणी 100°C पेक्षा कमी तापमानाला उकळते. प्रेशर कुकरमध्ये दाब वाढवून उत्कलनांक वाढवला जातो, त्यामुळे अन्न लवकर शिजते.
- बाष्पीभवनामुळे थंडावा येतो (मातीचा माठ, घाम).
## ध्वनी
- ध्वनी <b>अनुतरंग</b> (अनुदैर्घ्य) लहरींच्या रूपात जातो, आणि त्याला <b>माध्यम लागते</b>; निर्वात पोकळीत ध्वनी जात नाही.
- ध्वनीचा वेग: <b>घन > द्रव > वायू</b>. हवेत सुमारे 340 m/s.
- मानवी कानाची श्राव्य मर्यादा <b>20 Hz ते 20,000 Hz</b>.
- 20 Hz पेक्षा कमी: <b>अवश्राव्य</b> लहरी (भूकंप; हत्ती यांचा वापर करतात). 20,000 Hz पेक्षा जास्त: <b>अतिध्वनी</b> लहरी (वटवाघूळ, डॉल्फिन, SONAR, सोनोग्राफी).
- प्रतिध्वनी स्पष्ट ऐकू येण्यासाठी परावर्तक पृष्ठभाग किमान 17 मी. दूर हवा.
- आवाजाची पट्टी (तीक्ष्णता) वारंवारतेवर अवलंबून असते. तीव्रता डेसिबलमध्ये मोजतात.
## आणखी संकल्पना
- <b>डॉप्लर परिणाम</b>: ध्वनीचा स्रोत व ऐकणारा यांच्या सापेक्ष गतीमुळे ऐकू येणारी वारंवारता बदलते (जवळ येणाऱ्या गाडीचा भोंगा जास्त तीव्र, दूर जाताना कमी).
- ध्वनीचा वेग: <b>स्थायू > द्रव > वायू</b>. निर्वात पोकळीत ध्वनी जात नाही.
- <b>उष्मागतिकी</b> (Thermodynamics): उष्णता व ऊर्जेच्या रूपांतरणाचा अभ्यास. पूर्णपणे विलग प्रणालीत उष्णतेची देवाणघेवाण न होता घडणारी प्रक्रिया म्हणजे <b>ॲडियाबॅटिक (समोष्मी)</b>; तापमान स्थिर ठेवून घडणारी प्रक्रिया <b>समतापी</b> (isothermal).`,
sn:["शक्ती = कार्य/वेळ (वॉट) · गतिज ½mv² · स्थितिज mgh","ऊर्जा नष्ट होत नाही, फक्त रूपांतर होते","मोटर: विद्युत → यांत्रिक · जनित्र: यांत्रिक → विद्युत","वहन: घन · अभिसरण: द्रव/वायू · प्रारण: माध्यमाशिवाय (सूर्य)","पाण्याची घनता 4°C ला सर्वाधिक · प्रेशर कुकर: उत्कलनांक वाढतो","ध्वनी: घन > द्रव > वायू; हवेत ~340 m/s; निर्वातात नाही","श्राव्य 20 Hz–20 kHz · अवश्राव्य < 20 Hz · अतिध्वनी > 20 kHz (वटवाघूळ, सोनोग्राफी)","डॉप्लर: सापेक्ष गतीमुळे वारंवारता बदल · ध्वनी वेग स्थायू > द्रव > वायू · ॲडियाबॅटिक: उष्णता देवाणघेवाण नाही"],
tr:["ध्वनी वायूत सर्वाधिक वेगाने जातो असा चुकीचा पर्याय दिला जातो; तो घन पदार्थात सर्वाधिक वेगाने जातो.","जनित्र विद्युत ऊर्जेचे यांत्रिक ऊर्जेत रूपांतर करते अशी उलटी जोडी दिली जाते; ते यांत्रिक ऊर्जेचे विद्युत ऊर्जेत रूपांतर करते."],
q:[]},

{id:"sc4",s:"sci",t:"प्रकाश, भिंगे व मानवी डोळा",imp:3,
pyq:"आकाश निळे का दिसते, आरशांचे उपयोग, दृष्टिदोष व त्यासाठीची भिंगे, आणि रामन परिणाम यावर हमखास प्रश्न असतात.",
d:`## प्रकाश
- निर्वात पोकळीत प्रकाशाचा वेग <b>3 × 10⁸ m/s</b>. सूर्यप्रकाश पृथ्वीवर पोहोचायला सुमारे <b>8 मिनिटे 20 सेकंद</b> लागतात.
- <b>परावर्तन</b>: आपाती कोन = परावर्तन कोन.
- <b>अपवर्तन</b>: माध्यम बदलताना प्रकाशकिरण वाकतो. म्हणून पाण्यात पेन्सिल वाकलेली दिसते, आणि तलाव प्रत्यक्षापेक्षा उथळ दिसतो.
- <b>अपस्करण</b>: लोलकातून पांढरा प्रकाश 7 रंगांत विभागतो (ता-ना-पि-हि-नि-पा-जा; इंग्रजीत VIBGYOR). इंद्रधनुष्य याच तत्त्वाने दिसते. तांबड्या रंगाची तरंगलांबी सर्वाधिक, आणि जांभळ्याची सर्वात कमी.
- <b>प्रकीर्णन</b>: हवेतील कण निळा प्रकाश जास्त विखुरतात, म्हणून <b>आकाश निळे</b> दिसते. सूर्योदय व सूर्यास्ताला सूर्य लाल दिसतो. धोक्याचे सिग्नल लाल असतात, कारण लाल प्रकाश सर्वात कमी विखुरतो आणि दूरवर दिसतो.
- <b>पूर्ण आंतरिक परावर्तन</b>: हिऱ्याची चमक, ऑप्टिकल फायबर, मृगजळ.
- <b>सी. व्ही. रामन</b> यांनी 28 फेब्रुवारी 1928 रोजी 'रामन परिणाम' शोधला; हा दिवस <b>राष्ट्रीय विज्ञान दिन</b>. 1930 मध्ये त्यांना नोबेल पारितोषिक मिळाले.
## आरसे
|आरसा|उपयोग|
|सपाट|घरातील आरसा (प्रतिमा सरळ, आकार तितकाच, डावे-उजवे उलटे)|
|<b>अंतर्गोल</b>|दाढीचा आरसा, दंतवैद्य, टॉर्च व वाहनांचे दिवे, सौर कुकर|
|<b>बहिर्गोल</b>|वाहनांचा <b>मागचे पाहण्याचा आरसा</b> (मोठे क्षेत्र दिसते), रस्त्यावरील वळणांवरचे आरसे|
## भिंगे व दृष्टिदोष
- बहिर्गोल भिंग प्रकाश एकत्र करते (अभिसारी; शक्ती +). अंतर्गोल भिंग प्रकाश पसरवते (अपसारी; शक्ती −).
- भिंगाची शक्ती = 1 ÷ नाभीय अंतर (मीटरमध्ये); एकक <b>डायॉप्टर</b>.
|दोष|काय दिसत नाही|उपाय|
|<b>निकटदृष्टिता</b> (मायोपिया)|दूरचे|<b>अंतर्गोल</b> भिंग|
|<b>दूरदृष्टिता</b> (हायपरमेट्रोपिया)|जवळचे|<b>बहिर्गोल</b> भिंग|
|वृद्धदृष्टिता (प्रेसबायोपिया)|वयामुळे जवळचे|द्विनाभीय भिंग|
|मोतीबिंदू|डोळ्याचे भिंग धूसर होणे|शस्त्रक्रिया|
## मानवी डोळा
डोळ्यातील भिंग बहिर्गोल असते. प्रतिमा <b>दृष्टिपटलावर</b> (रेटिना) पडते. बुबुळ बाहुलीचा आकार नियंत्रित करते. दृष्टीचे सातत्य सुमारे 1/16 सेकंद असते; त्यामुळे चित्रपट सलग हलताना दिसतो.`,
sn:["प्रकाशाचा वेग 3 × 10⁸ m/s · सूर्यप्रकाश 8 मि. 20 से.","अपस्करण → इंद्रधनुष्य (VIBGYOR) · प्रकीर्णन → आकाश निळे","पूर्ण आंतरिक परावर्तन: हिरा, ऑप्टिकल फायबर, मृगजळ","रामन परिणाम 28 फेब्रुवारी 1928 = राष्ट्रीय विज्ञान दिन; नोबेल 1930","अंतर्गोल आरसा: दाढी, टॉर्च · बहिर्गोल: वाहनाचा मागचा आरसा","निकटदृष्टिता → अंतर्गोल भिंग · दूरदृष्टिता → बहिर्गोल भिंग · एकक डायॉप्टर"],
tr:["वाहनाच्या मागच्या आरशासाठी अंतर्गोल आरसा असा चुकीचा पर्याय दिला जातो; तो बहिर्गोल असतो.","निकटदृष्टितेसाठी बहिर्गोल भिंग असा चुकीचा पर्याय दिला जातो; त्यासाठी अंतर्गोल भिंग वापरतात."],
q:[]},

{id:"sc5",s:"sci",t:"विद्युत व चुंबकत्व",imp:3,
pyq:"ओहमचा नियम, घरगुती जोडणी (एकसर/समांतर), फ्यूज, आणि जनित्र, मोटार व रोहित्र यांची तत्त्वे यावर प्रश्न येतात.",
d:`## मूलभूत संकल्पना
- विद्युतभार – कुलोम · विद्युतधारा – अँपिअर (I = भार ÷ वेळ) · विभवांतर – व्होल्ट · रोध – ओहम.
- <b>ओहमचा नियम</b>: <b>V = I × R</b>.
- विद्युत शक्ती P = V × I. घरगुती वापराचे बिल kWh (युनिट) मध्ये येते.
- <b>सुवाहक</b>: चांदी (सर्वोत्तम), तांबे (तारांसाठी सर्वाधिक वापर), ॲल्युमिनियम · <b>दुर्वाहक</b>: रबर, प्लास्टिक, लाकूड · <b>अर्धवाहक</b>: सिलिकॉन, जर्मेनियम (संगणक चिप, सौर घट).
## एकसर व समांतर जोडणी
- एकसर: R = R1 + R2. एक बल्ब बंद पडला तर सगळे बंद होतात.
- समांतर: 1/R = 1/R1 + 1/R2. प्रत्येक उपकरणाला पूर्ण व्होल्टेज मिळते.
- <b>घरगुती जोडणी समांतर</b> पद्धतीने असते.
## विद्युतधारेचा उष्णता परिणाम
- हीटर व इस्त्रीची तार <b>नायक्रोम</b>ची असते (रोध जास्त).
- <b>फ्यूज</b>ची तार कमी द्रवणांक असलेल्या कथिल-शिसे मिश्रधातूची असते. जास्त विद्युतधारा आली तर ती वितळून उपकरणांचे रक्षण करते.
- बल्बचा तंतू <b>टंगस्टन</b>चा असतो (द्रवणांक खूप जास्त). बल्बमध्ये नायट्रोजन किंवा आरगॉनसारखा निष्क्रिय वायू भरलेला असतो.
- भारतात घरगुती वीजपुरवठा <b>AC, 220–230 V, 50 Hz</b> असतो.
- तारांचे रंग (जुनी पद्धत): लाल = विद्युतवाहक (लाइव्ह), काळा = तटस्थ (न्यूट्रल), <b>हिरवा = अर्थिंग</b>.
## चुंबकत्व
- सजातीय ध्रुव एकमेकांना दूर ढकलतात, विजातीय ध्रुव आकर्षित करतात. पृथ्वी स्वतः एक मोठा चुंबक आहे; होकायंत्र उत्तर-दक्षिण दिशा दाखवते.
- मऊ लोखंडाभोवती तारेचे वेटोळे करून त्यातून विद्युतधारा सोडल्यास <b>विद्युतचुंबक</b> बनतो (क्रेन, विद्युत घंटा).
- <b>फॅरडे</b>ने विद्युतचुंबकीय प्रवर्तनाचा शोध लावला. यावर <b>जनित्र</b> (डायनॅमो) चालते.
- <b>रोहित्र</b> (ट्रान्सफॉर्मर) AC व्होल्टेज कमी-जास्त करतो; ते फक्त AC वर चालते.
- बॅटरी व सेल <b>DC</b> (एकदिश प्रवाह) देतात.
## सूत्रे व सोडवलेली उदाहरणे
- विद्युतधारा I = Q ÷ t, म्हणून अँपिअर = <b>कूलॉम/सेकंद</b>. शक्ती P = VI = I²R = V²/R.
- <b>ज्यूलचा नियम</b> (उष्णता): H = I²Rt. उदा. 100 Ω रोधातून 0.2 A प्रवाह 1 मिनिट: H = (0.2)² × 100 × 60 = <b>240 J</b>.
- उदा. दोन रोध एकसर जोडल्यास 45 Ω, समांतर जोडल्यास 10 Ω: R1 + R2 = 45 आणि R1R2 ÷ 45 = 10, म्हणून R1R2 = 450. उत्तर <b>30 Ω व 15 Ω</b>.
- वीज बिल: 1 युनिट = 1 kWh = 3.6 × 10⁶ J. उदा. 100 W पंखा दिवसाला 10 तास = 1 kWh; 50 W चे 2 बल्ब दिवसाला 5 तास = 0.5 kWh; दिवसाला 1.5 युनिट. 30 दिवसांत 45 युनिट; दर ₹5 प्रति युनिट मानल्यास बिल ₹225.

- उदा. नारिंगी, निळा, पिवळा, सोनेरी = 3, 6, × 10⁴ → <b>36 × 10⁴ Ω</b> ±5%.

sn:["V = IR (ओहम) · P = VI · बिल kWh मध्ये","सुवाहक: चांदी सर्वोत्तम, तांबे सर्वाधिक वापर · अर्धवाहक: सिलिकॉन","घरगुती जोडणी समांतर","हीटर: नायक्रोम · फ्यूज: कथिल-शिसे (कमी द्रवणांक) · बल्ब: टंगस्टन","भारत: AC 220–230 V, 50 Hz · हिरवी तार अर्थिंग","विद्युतचुंबक: मऊ लोखंड · फॅरडे: प्रवर्तन → जनित्र · रोहित्र फक्त AC वर","H = I²Rt · P = VI = I²R · 1 kWh = 3.6 × 10⁶ J · अँपिअर = कूलॉम/सेकंद","रंग संकेत: काळा 0, तपकिरी 1, लाल 2, नारिंगी 3, पिवळा 4, हिरवा 5, निळा 6, जांभळा 7, राखाडी 8, पांढरा 9 · सोनेरी ±5%"],
tr:["घरगुती जोडणी एकसर असते असा चुकीचा पर्याय दिला जातो; ती समांतर असते.","फ्यूजची तार उच्च द्रवणांकाची असते असा चुकीचा पर्याय दिला जातो; ती कमी द्रवणांकाची असते.","रंग संकेतातील तिसरा रंग अंक नसून गुणक (10 चा घात) असतो; तो अंक म्हणून वाचल्यास चुकीचे उत्तर येते."],

{id:"sc6",s:"sci",t:"द्रव्य, अणू, मूलद्रव्ये",imp:2,
pyq:"अणूतील कणांचे शोधक, अणुअंक व अणुवस्तुमानांक, समस्थानिके, आणि 'सर्वाधिक आढळणारे' मूलद्रव्य यावर प्रश्न येतात.",
d:`## द्रव्याच्या अवस्था
घन, द्रव, वायू, आणि प्लाझ्मा. <b>संप्लवन</b> म्हणजे घन पदार्थ द्रव न होता थेट वायू होणे: कापूर, डांबराच्या गोळ्या (नॅप्थलीन), आयोडीन, कोरडा बर्फ (घन CO₂).
## अणूची रचना
|कण|भार|शोधक|
|इलेक्ट्रॉन|ऋण (−)|जे. जे. थॉमसन|
|प्रोटॉन|धन (+)|गोल्डस्टीन / रदरफोर्ड|
|न्यूट्रॉन|शून्य|<b>चॅडविक</b> (1932)|
अणुकेंद्रकाचा शोध <b>रदरफोर्ड</b>ने लावला. प्रोटॉन व न्यूट्रॉन केंद्रकात असतात, आणि इलेक्ट्रॉन केंद्रकाभोवती फिरतात.
- <b>अणुअंक</b> (Z) = प्रोटॉनची संख्या · <b>अणुवस्तुमानांक</b> (A) = प्रोटॉन + न्यूट्रॉन.
- <b>समस्थानिके</b>: अणुअंक तोच, अणुवस्तुमानांक वेगळा. उदा. हायड्रोजनची प्रोटियम, ड्युटेरियम, ट्रिटियम.
- <b>समभारिके</b>: अणुवस्तुमानांक तोच, अणुअंक वेगळा.
## आवर्तसारणी
- <b>मेंडेलीव्ह</b>ने मूलद्रव्यांची मांडणी अणुवस्तुमानानुसार केली. आधुनिक आवर्तसारणी <b>अणुअंकानुसार</b> आहे (मोझले). आता 118 मूलद्रव्ये ज्ञात आहेत.
- पहिले मूलद्रव्य <b>हायड्रोजन</b> (सर्वात हलके).
- <b>राजवायू</b> (निष्क्रिय वायू): हेलियम, निऑन, आरगॉन, क्रिप्टॉन, झेनॉन, रेडॉन.
## सर्वाधिक आढळणारे मूलद्रव्य
|कुठे|मूलद्रव्य|
|पृथ्वीचे कवच|ऑक्सिजन, त्यानंतर सिलिकॉन|
|कवचातील धातू|ॲल्युमिनियम|
|वातावरण|नायट्रोजन (~78%)|
|विश्व|हायड्रोजन|
|मानवी शरीर|ऑक्सिजन|
## भौतिक व रासायनिक बदल
- <b>भौतिक बदल</b> (नवा पदार्थ बनत नाही; बहुतेक उलटवता येतो): बर्फ वितळणे, साखर विरघळणे.
- <b>रासायनिक बदल</b> (नवा पदार्थ बनतो): लोखंड गंजणे, दूध दही होणे, अन्न शिजणे, कागद जळणे.
## मिश्रण वेगळे करण्याच्या पद्धती
ऊर्ध्वपातन (द्रव), गाळणे, <b>अपकेंद्री</b> पद्धत (दुधातून साय/लोणी), संप्लवन, वर्णलेखन (रंग वेगळे करणे).
## रासायनिक बंध
- <b>आयनिक</b> (विद्युत संयुजी) बंध: इलेक्ट्रॉनची <b>देवाणघेवाण</b>; सहसा धातू व अधातू यांच्यात. उदा. NaCl, <b>CaCl₂</b>, MgO. उच्च द्रवणांक; पाण्यात विरघळणारी; द्रावणात किंवा वितळलेल्या स्थितीत वीज वाहतात.
- <b>सहसंयुज</b> बंध: इलेक्ट्रॉनची <b>भागीदारी</b>; अधातूंमध्ये. उदा. H₂, Cl₂, CH₄, H₂O; O₂ मध्ये दुहेरी व N₂ मध्ये तिहेरी बंध.
- हायड्रोजन बंध: पाण्याच्या रेणूंमध्ये (म्हणून बर्फ पाण्यावर तरंगतो), DNA च्या दोन धाग्यांमध्ये.
|संकरण|आकार व कोन|उदाहरण|
|sp|रेषीय, 180°|BeCl₂, CO₂|
|sp²|त्रिकोणी सपाट, 120°|BF₃|
|sp³|चतुष्फलकीय, 109.5°|CH₄, CCl₄|
|<b>sp³d</b>|त्रिकोणी द्विपिरॅमिड|<b>PCl₅</b>|
|sp³d²|अष्टफलकीय|SF₆|
- CCl₄ मधील प्रत्येक बंध ध्रुवीय असला तरी <b>नियमित चतुष्फलकीय रचनेमुळे</b> निव्वळ द्विध्रुव आघूर्ण शून्य होते. पाण्याचा रेणू वाकलेला (सुमारे 104.5°) असल्याने त्याला द्विध्रुव आघूर्ण असते.
## आवर्तसारणी व अणू: आणखी
- <b>कर्णीय संबंध</b>: Li–Mg, Be–Al, B–Si.
- गटात खाली जाताना अणुत्रिज्या वाढते; आवर्तनात डावीकडून उजवीकडे घटते. सर्वाधिक विद्युतऋणता <b>फ्लोरिन</b>.
- न्यूट्रॉन = वस्तुमानांक − अणुक्रमांक. उदा. सोडियम (अणुक्रमांक 11, वस्तुमानांक 23): 11 प्रोटॉन, <b>11 इलेक्ट्रॉन, 12 न्यूट्रॉन</b>.
- क्वांटम अंक n, l, m, s. उदा. लिथियम (1s² 2s¹): संयुजा कवचात फक्त एक इलेक्ट्रॉन, n = 2, l = 0, m = 0.
- समस्थानिके (isotopes): अणुक्रमांक तोच, वस्तुमानांक वेगळा (प्रोटियम, ड्युटेरियम, ट्रिटियम). समभारिके (isobars): वस्तुमानांक तोच, अणुक्रमांक वेगळा (Ar-40, Ca-40).
## किरणोत्सारिता
- शोध: <b>हेन्री बेकेरेल</b> (1896, युरेनियम). पोलोनियम व रेडियम: मेरी व पियरे क्युरी (1898).
|किरण|स्वरूप|प्रभार|भेदनक्षमता|
|अल्फा (α)|हेलियम केंद्रक|+2|सर्वात कमी (कागद थांबवतो)|
|बीटा (β)|इलेक्ट्रॉन|−1|मध्यम|
|<b>गॅमा (γ)</b>|विद्युतचुंबकीय तरंग|प्रभार नाही|सर्वाधिक (जाड शिसे लागते)|
- गॅमा किरणांवर प्रभार नसल्याने ते विद्युत किंवा <b>चुंबकीय क्षेत्रात वळत नाहीत</b>.
- कार्बन-14 पद्धतीने जुन्या अवशेषांचे वय ठरवतात (अर्धायुष्य सुमारे 5730 वर्षे). उपयोग: कोबाल्ट-60 कर्करोग उपचार, आयोडिन-131 थायरॉइड.
- केंद्रकीय <b>विखंडन</b>: जड केंद्रक फुटणे (अणुभट्टी, अणुबॉम्ब; U-235). केंद्रकीय <b>संमीलन</b>: हलकी केंद्रके जुळणे (सूर्याची ऊर्जा, हायड्रोजन बॉम्ब).
## उत्प्रेरक व प्रदूषक धातू
- उत्प्रेरक अभिक्रियेचा वेग बदलतो, पण स्वतः बदलत नाही. समांगी उत्प्रेरक अभिक्रियाकारकांच्याच अवस्थेत असतो; विषमांगी उत्प्रेरक वेगळ्या अवस्थेत असतो (उदा. हेबर पद्धतीत अमोनियासाठी घन लोह). म्हणजे उत्प्रेरक नेहमी अभिक्रियाकारकांच्या अवस्थेत असतोच असे नाही. विकरे (एन्झाइम) जैविक उत्प्रेरक आहेत. तेलांच्या हायड्रोजनीकरणात (वनस्पती तूप) निकेल.
- <b>मिनामाटा रोग</b> (जपान): पारा (Hg) · इटाई-इटाई रोग: कॅडमियम (Cd) · ब्लॅकफूट रोग: आर्सेनिक.`,
sn:["संप्लवन: कापूर, नॅप्थलीन, आयोडीन, कोरडा बर्फ","इलेक्ट्रॉन थॉमसन · न्यूट्रॉन चॅडविक 1932 · केंद्रक रदरफोर्ड","अणुअंक = प्रोटॉन · अणुवस्तुमानांक = प्रोटॉन + न्यूट्रॉन","समस्थानिके: Z समान, A वेगळा (प्रोटियम, ड्युटेरियम, ट्रिटियम)","मेंडेलीव्ह: अणुवस्तुमान · आधुनिक: अणुअंक (मोझले) · 118 मूलद्रव्ये","कवच: ऑक्सिजन > सिलिकॉन; धातू ॲल्युमिनियम · वातावरण: नायट्रोजन · विश्व: हायड्रोजन","गंजणे, दही होणे: रासायनिक बदल · बर्फ वितळणे: भौतिक बदल","आयनिक: देवाणघेवाण (NaCl, CaCl₂) · सहसंयुज: भागीदारी · PCl₅ sp³d · CCl₄ द्विध्रुव शून्य","कर्णीय संबंध Li–Mg, Be–Al, B–Si · Na: 11e, 12n","किरणोत्सारिता: बेकेरेल 1896 · गॅमा प्रभाररहित, क्षेत्रात वळत नाही · मिनामाटा: पारा"],
tr:["पृथ्वीच्या कवचात सर्वाधिक धातू लोखंड असा चुकीचा पर्याय दिला जातो; प्रत्यक्षात ॲल्युमिनियम आहे.","समस्थानिके आणि समभारिके यांच्या व्याख्यांची अदलाबदल केली जाते.","चुंबकीय क्षेत्रात न वळणारे किरण म्हणून अल्फा किंवा बीटा दिले जातात; प्रभाररहित गॅमा किरणच वळत नाहीत."],

{id:"sc7",s:"sci",t:"आम्ल, आम्लारी, क्षार, धातू व मिश्रधातू",imp:3,
pyq:"सामान्य नाव–रासायनिक सूत्र, मिश्रधातूंचे घटक, आणि दर्शकांचे रंग यावर दरवर्षी हमखास प्रश्न असतो. हा धडा पाठांतराचा आहे.",
d:`## आम्ल व आम्लारी
- आम्ल चवीला आंबट असतात; pH 7 पेक्षा कमी. आम्लारी चवीला कडू, स्पर्शाला बुळबुळीत; pH 7 पेक्षा जास्त. pH 7 = उदासीन (शुद्ध पाणी).

## अनुवंश
- <b>ग्रेगर मेंडेल</b> हे अनुवंशशास्त्राचे जनक; त्यांनी वाटाण्याच्या रोपांवर प्रयोग केले.
- DNA ची द्विसर्पिल रचना <b>वॉटसन व क्रिक</b> यांनी 1953 मध्ये शोधली.
- माणसात <b>46 गुणसूत्रे (23 जोड्या)</b> असतात. बाळाचे लिंग <b>वडिलांच्या</b> गुणसूत्रावर (X किंवा Y) ठरते.
## वर्गीकरण
- <b>लिनियस</b>: द्विनाम पद्धती; वर्गीकरणशास्त्राचे जनक. उदा. माणूस = Homo sapiens.
- <b>व्हिटाकरची पाच सृष्टी</b> (1969): मोनेरा (जिवाणू), प्रोटिस्टा, कवक (फंगाय), वनस्पती, प्राणी.
- विषाणू सजीव व निर्जीव यांच्या सीमेवर आहेत; ते फक्त दुसऱ्या पेशीत वाढतात.
- कवक: यीस्ट (किण्वन; पाव, इडली), अळंबी. <b>पेनिसिलिन</b> हे प्रतिजैविक पेनिसिलियम या बुरशीपासून मिळते.
## वनस्पती
- प्रकाशसंश्लेषण: कार्बन डायऑक्साइड + पाणी + सूर्यप्रकाश + हरितद्रव्य → ग्लुकोज + <b>ऑक्सिजन</b>.
- बाष्पोत्सर्जन पानांवरील <b>पर्णरंध्रांमधून</b> होते. <b>जलवाहिनी</b> (झायलेम) पाणी वाहते, आणि <b>रसवाहिनी</b> (फ्लोएम) अन्न वाहते.
- वनस्पती संप्रेरके: ऑक्झिन (वाढ), जिबरेलिन (खोडाची वाढ), सायटोकायनिन (पेशी विभाजन), ॲब्सिसिक आम्ल (ताण; पाने गळणे), <b>इथिलीन</b> (फळे पिकवणे).
- डाळवर्गीय पिकांच्या मुळांवरील गाठींमध्ये <b>रायझोबियम</b> जिवाणू नायट्रोजन स्थिर करतात.
- <b>जगदीशचंद्र बोस</b> यांनी 'वनस्पतींना जीव असतो' हे दाखवले (क्रेस्कोग्राफ उपकरण).
- कीटकभक्षी वनस्पती: घटपर्णी, व्हीनस फ्लायट्रॅप, ड्रॉसेरा. जगातील सर्वात मोठे फूल रॅफ्लेशिया.

## जैविक कीडनाशके व जैविक खते
- <b>Bt</b> (Bacillus thuringiensis): कीटकनाशक जिवाणू; त्याच्या जनुकापासून <b>Bt कापूस</b> (बोंडअळीविरुद्ध; भारतात 2002 मध्ये मान्यता).
- कडुनिंबातील कीटकनाशक घटक: <b>अॅझाडिरॅक्टिन</b>.
- ट्रायकोडर्मा: मातीतून होणाऱ्या रोगांवर वापरली जाणारी उपयुक्त बुरशी. NPV विषाणू: घाटेअळीचे नियंत्रण. ट्रायकोग्रामा: किडींची अंडी नष्ट करणारा परोपजीवी कीटक.
- जैविक खते: <b>रायझोबियम</b> (डाळवर्गीय मुळांवरील गाठी), अॅझोटोबॅक्टर (मुक्तपणे राहून नायट्रोजन स्थिर करतो), निळे-हिरवे शैवाल (भातशेती), <b>अॅझोला</b> (नेचा, अॅनाबिनासोबत), फॉस्फरस विरघळवणारे जिवाणू (PSB), मायकोरायझा.
- वनस्पतींची मुख्य पोषकद्रव्ये: <b>नायट्रोजन, फॉस्फरस, पोटॅशियम (NPK)</b>. दुय्यम: कॅल्शियम, मॅग्नेशियम, गंधक. सूक्ष्म: लोह, जस्त, मँगनीज, तांबे, बोरॉन, मॉलिब्डेनम, क्लोरीन.`,
sn:["पेशी: रॉबर्ट हूक 1665 · केंद्रक: रॉबर्ट ब्राऊन","मायटोकॉन्ड्रिया ऊर्जाकेंद्र · रायबोसोम प्रथिने · लायसोसोम आत्मघातकी पिशवी","वनस्पती पेशी: पेशीभित्तिका (सेल्युलोज) + हरितलवक","मेंडेल: अनुवंशशास्त्राचे जनक · DNA: वॉटसन-क्रिक 1953 · 46 गुणसूत्रे; लिंग वडिलांवर","लिनियस: द्विनाम पद्धती · व्हिटाकर: पाच सृष्टी","पेनिसिलिन: बुरशी · इथिलीन: फळे पिकवणे · रायझोबियम: नायट्रोजन स्थिरीकरण","जलवाहिनी: पाणी · रसवाहिनी: अन्न · जगदीशचंद्र बोस: क्रेस्कोग्राफ","अवयव स्तर: प्लॅटीहेल्मिंथिस · खुली रक्ताभिसरण: आर्थ्रोपोडा · गांडूळ: वृक्किका, झुरळ: माल्पिघियन नलिका","अंडी घालणारा सस्तन: प्लॅटिपस · अस्थिमत्स्य: कटला, रोहू · शार्क: कास्थिमत्स्य, तोंड अधर","बेंथम व हुकर: नैसर्गिक वर्गीकरण · ब्रायोफायटा असंवहनी · टेरिडोफायटा पहिल्या संवहनी","टिक्का (भुईमूग): सर्कोस्पोरा · अर्गट (बाजरी): क्लॅव्हिसेप्स · बंची टॉप: केळी · खैरा: जस्त कमतरता","Bt: जिवाणू कीटकनाशक · कडुनिंब: अॅझाडिरॅक्टिन · मुख्य पोषक NPK"],
tr:["जलवाहिनी अन्न आणि रसवाहिनी पाणी वाहते अशी उलटी जोडी दिली जाते; प्रत्यक्षात जलवाहिनी पाणी वाहते आणि रसवाहिनी अन्न.","बाळाचे लिंग आईच्या गुणसूत्रावर ठरते असा चुकीचा पर्याय दिला जातो; ते वडिलांच्या गुणसूत्रावर ठरते.","बाजरीच्या अर्गटचा कारक सर्कोस्पोरा अशी चुकीची जोडी दिली जाते; सर्कोस्पोरा भुईमुगाच्या टिक्क्याचा कारक आहे, अर्गटचा क्लॅव्हिसेप्स.","सर्व रज्जुमान पृष्ठवंशी असतात असे चुकीचे विधान येते; उलट, सर्व पृष्ठवंशी रज्जुमान असतात."],

{id:"sc9",s:"sci",t:"मानवी शरीर: संस्था व ग्रंथी",imp:3,
pyq:"ग्रंथी–संप्रेरक–कार्य, रक्ताचे घटक व रक्तगट, मेंदूचे भाग, आणि 'सर्वात मोठा/लहान' अवयव यावर दरवर्षी हमखास प्रश्न असतात.",
d:`## पचनसंस्था
- पचनाची सुरुवात <b>तोंडात</b> होते: लाळेतील अमायलेज पिष्टमय पदार्थ पचवते.
- जठरात HCl व पेप्सिन प्रथिनांचे पचन सुरू करतात.
- <b>लहान आतड्यात</b> सर्वाधिक पचन व शोषण होते (आंत्रांकुर).
- <b>यकृत</b> पित्तरस तयार करते (मेदाचे पचन); पित्तरस पित्ताशयात साठतो.
- मोठ्या आतड्यात पाण्याचे शोषण होते.
## रक्ताभिसरण
- हृदयाला <b>4 कप्पे</b> असतात. रक्ताभिसरणाचा शोध <b>विल्यम हार्वे</b> यांनी लावला.
- <b>धमन्या</b> रक्त हृदयापासून दूर नेतात (शुद्ध रक्त; अपवाद फुप्फुसधमनी). <b>शिरा</b> रक्त हृदयाकडे आणतात (अशुद्ध रक्त; अपवाद फुप्फुसशिरा).
- सामान्य हृदयाचे ठोके 72 प्रति मिनिट; सामान्य रक्तदाब 120/80 mmHg. शरीरात सुमारे 5–6 लिटर रक्त असते.
|घटक|काम|
|लाल रक्तपेशी (RBC)|हिमोग्लोबिनद्वारे ऑक्सिजन वाहणे; आयुष्य सुमारे 120 दिवस; अस्थिमज्जेत तयार होतात|
|पांढऱ्या रक्तपेशी (WBC)|रोगप्रतिकार|
|रक्तपट्टिका|रक्त गोठवणे|
|प्लाझ्मा|रक्ताचा सुमारे 55% द्रव भाग|
- <b>प्लीहा</b>ला 'लाल रक्तपेशींची स्मशानभूमी' म्हणतात.
- रक्तगटांचा शोध <b>कार्ल लँडस्टीनर</b> यांनी लावला. <b>O सर्वदाता</b>, <b>AB सर्वग्राही</b>. Rh घटकही महत्त्वाचा असतो.
## श्वसन व उत्सर्जन
- फुप्फुसांतील <b>वायुकोशांत</b> (अल्व्हिओलाय) वायूंची देवाणघेवाण होते. श्वास घेण्यास <b>श्वासपटल</b> मदत करते.
- <b>मूत्रपिंड</b> रक्त गाळते; मूत्रपिंडाचे कार्यात्मक एकक <b>नेफ्रॉन</b>. मूत्रपिंड निकामी झाल्यास डायलिसिस करतात.
## चेतासंस्था
चेतापेशी (न्यूरॉन) हे एकक. मेंदूचे भाग: <b>प्रमस्तिष्क</b> (बुद्धी, स्मरणशक्ती) · <b>अनुमस्तिष्क</b> (शरीराचा तोल) · <b>मस्तिष्क पुच्छ</b> (श्वसन, हृदयाचे ठोके यांसारख्या अनैच्छिक क्रिया). प्रतिक्षिप्त क्रिया <b>मेरुरज्जू</b> नियंत्रित करते.
## अंतःस्रावी ग्रंथी
|ग्रंथी|संप्रेरक / काम|
|<b>पोषग्रंथी</b> (पिट्युटरी)|'मास्टर ग्रंथी'; वाढ संप्रेरक|
|<b>अवटू</b> (थायरॉइड)|थायरॉक्सिन (आयोडीन आवश्यक); कमतरतेने गलगंड|
|<b>अधिवृक्क</b> (ॲड्रेनल)|<b>ॲड्रेनॅलिन</b>: 'आणीबाणीचे संप्रेरक'|
|<b>स्वादुपिंड</b>|इन्सुलिन (रक्तातील साखर कमी करते; कमतरतेने मधुमेह), ग्लुकागॉन|
|वृषण / अंडाशय|टेस्टोस्टेरॉन / इस्ट्रोजेन|
## 'सर्वात' (पाठ करा)
प्रौढ माणसाच्या शरीरात <b>206 हाडे</b> असतात (जन्माच्या वेळी सुमारे 300). सर्वात लांब हाड <b>फिमर</b> (मांडी), सर्वात लहान <b>स्टेपीज</b> (कान). सर्वात मोठी ग्रंथी <b>यकृत</b>, सर्वात मोठा अवयव <b>त्वचा</b>. शरीरातील सर्वात कठीण पदार्थ दातांचे <b>इनॅमल</b>. प्रौढ माणसाला 32 दात असतात.
## रक्त: आणखी
- पांढऱ्या पेशींपैकी सर्वाधिक न्यूट्रोफिल्स आणि सर्वात कमी <b>बेसोफिल्स</b>.
- रक्त गोठताना फायब्रिनोजेनचे फायब्रिनमध्ये रूपांतर ही गोठण प्रक्रियेची अंतिम पायरी आहे. नैसर्गिक रक्त-गोठणरोधक: <b>हिपॅरिन</b>.`,
sn:["पचन तोंडात सुरू (अमायलेज) · सर्वाधिक पचन व शोषण लहान आतड्यात · पित्तरस यकृतात","हृदय 4 कप्पे; रक्ताभिसरण: हार्वे · धमन्या दूर नेतात, शिरा जवळ आणतात","RBC 120 दिवस, अस्थिमज्जेत · प्लीहा: RBC स्मशानभूमी","O सर्वदाता · AB सर्वग्राही · लँडस्टीनर","नेफ्रॉन: मूत्रपिंडाचे एकक","प्रमस्तिष्क बुद्धी · अनुमस्तिष्क तोल · मस्तिष्क पुच्छ अनैच्छिक क्रिया","पिट्युटरी मास्टर ग्रंथी · थायरॉइड आयोडीन · ॲड्रेनॅलिन आणीबाणी · इन्सुलिन स्वादुपिंड","206 हाडे · फिमर सर्वात लांब · स्टेपीज लहान · यकृत मोठी ग्रंथी · त्वचा मोठा अवयव · इनॅमल कठीण","सर्वात कमी पांढऱ्या पेशी: बेसोफिल्स · गोठणरोधक: हिपॅरिन"],
tr:["अनुमस्तिष्क (तोल) आणि मस्तिष्क पुच्छ (अनैच्छिक क्रिया) यांच्या कामांची अदलाबदल केली जाते.","इन्सुलिन यकृतात तयार होते असा चुकीचा पर्याय दिला जातो; ते स्वादुपिंडात तयार होते."],

{id:"ma1",s:"mat",t:"संख्याज्ञान, विभाज्यता व एकक अंक",imp:2,
pyq:"विभाज्यतेच्या कसोट्या, भागाकारातील बाकी, मूळ संख्या, आणि घाताचा एकक अंक यावर सोपे पण वेळखाऊ प्रश्न येतात. शॉर्टकट वापरले तर 20 सेकंदांत सुटतात.",
d:`## संख्यांचे प्रकार
- <b>नैसर्गिक संख्या</b>: 1, 2, 3, ... · <b>पूर्ण संख्या</b>: 0, 1, 2, ...
- <b>मूळ संख्या</b>: ज्यांना फक्त 1 व त्या संख्येनेच भाग जातो. 1 ते 100 मध्ये <b>25</b> मूळ संख्या आहेत. 2 ही एकमेव सम मूळ संख्या आहे. 1 ही मूळ संख्या नाही.
- <b>जोडमूळ संख्या</b>: ज्यांचा फरक 2 आहे (3-5, 5-7, 11-13).
- <b>सहमूळ संख्या</b>: ज्यांचा मसावि 1 आहे (8 व 15).
## विभाज्यतेच्या कसोट्या
|ने भाग जातो जर...|कसोटी|
|2|एककस्थानी 0, 2, 4, 6, 8|
|3|अंकांची बेरीज 3 ने भाग जाते|
|4|शेवटचे दोन अंक 4 ने भाग जातात|
|5|एककस्थानी 0 किंवा 5|
|6|2 आणि 3 दोन्हीने भाग जातो|
|8|शेवटचे तीन अंक 8 ने भाग जातात|
|9|अंकांची बेरीज 9 ने भाग जाते|
|11|विषम स्थानांवरील अंकांची बेरीज − सम स्थानांवरील अंकांची बेरीज = 0 किंवा 11 च्या पटीत|
<b>उदाहरण</b>: 7 3 5 2 8 ला 11 ने भाग जातो का? विषम स्थाने (7 + 5 + 8) = 20, सम स्थाने (3 + 2) = 5. फरक 15, जो 11 च्या पटीत नाही. म्हणून भाग जात नाही.
## भागाकाराचा नियम
<b>भाज्य = भाजक × भागाकार + बाकी</b>.
<b>उदाहरण</b>: एका संख्येला 616 ने भागल्यास बाकी 35 राहते. त्याच संख्येला 8 ने भागल्यास बाकी किती? 616 ला 8 ने भाग जातो (616 = 8 × 77). म्हणून उत्तर 35 ÷ 8 ची बाकी = <b>3</b>.
## घाताचा एकक अंक (चक्र)
- एककस्थानी 0, 1, 5, 6 असेल तर कोणत्याही घातासाठी एकक अंक तोच राहतो.
- 2 चे चक्र: 2, 4, 8, 6 · 3 चे चक्र: 3, 9, 7, 1 · 7 चे चक्र: 7, 9, 3, 1 · 8 चे चक्र: 8, 4, 2, 6 (प्रत्येकी 4 चे चक्र).
- 4: विषम घाताला 4, सम घाताला 6 · 9: विषम घाताला 9, सम घाताला 1.
<b>उदाहरण</b>: 7⁹⁸ चा एकक अंक किती? 98 ला 4 ने भागले की बाकी 2. 7 च्या चक्रातील दुसरे पद 9. उत्तर <b>9</b>.
## उपयुक्त सूत्रे
- पहिल्या n नैसर्गिक संख्यांची बेरीज = n(n + 1)/2.
- पहिल्या n विषम संख्यांची बेरीज = n².`,
sn:["1–100 मध्ये 25 मूळ संख्या · 2 एकमेव सम मूळ संख्या · 1 मूळ नाही","3 व 9: अंकांची बेरीज · 4: शेवटचे 2 अंक · 8: शेवटचे 3 अंक · 11: विषम − सम स्थाने","भाज्य = भाजक × भागाकार + बाकी","एकक अंक: 2, 3, 7, 8 चे चक्र 4 चे; घाताला 4 ने भागून बाकी पाहा","1 ते n बेरीज n(n+1)/2 · पहिल्या n विषम संख्यांची बेरीज n²"],
tr:["1 ला मूळ संख्या म्हणून पर्यायात ठेवले जाते; 1 मूळ संख्या नाही.","9 ने भाग जातो म्हणून 3 ने भाग जातो, पण 3 ने भाग जाणाऱ्या प्रत्येक संख्येला 9 ने भाग जात नाही. हा फरक फसवण्यासाठी वापरला जातो."],
q:[]},

{id:"ma2",s:"mat",t:"लसावि व मसावि",imp:2,
pyq:"लसावि-मसावि यांचा थेट प्रश्न, 'गुणाकार = लसावि × मसावि' वापरणारा प्रश्न, आणि घंटा एकत्र वाजणे यासारखे शाब्दिक प्रश्न येतात.",
d:`## व्याख्या
- <b>मसावि</b> (महत्तम सामाईक विभाजक): दिलेल्या सर्व संख्यांना पूर्ण भाग देणारी सर्वात मोठी संख्या.
- <b>लसावि</b> (लघुतम सामाईक विभाज्य): दिलेल्या सर्व संख्यांनी पूर्ण भाग जाणारी सर्वात लहान संख्या.
## पद्धत (मूळ अवयव)
12 = 2² × 3 आणि 18 = 2 × 3².
- मसावि = सामाईक अवयव, लहान घातांसह = 2 × 3 = <b>6</b>.
- लसावि = सर्व अवयव, मोठ्या घातांसह = 2² × 3² = <b>36</b>.
## महत्त्वाचा नियम
<b>दोन संख्यांचा गुणाकार = त्यांचा लसावि × मसावि</b> (फक्त दोन संख्यांसाठी).
<b>उदाहरण</b>: लसावि 60, मसावि 4, आणि एक संख्या 12. दुसरी संख्या = 60 × 4 ÷ 12 = <b>20</b>.
## अपूर्णांकांचे लसावि व मसावि
- अपूर्णांकांचा लसावि = अंशांचा लसावि ÷ छेदांचा मसावि.
- अपूर्णांकांचा मसावि = अंशांचा मसावि ÷ छेदांचा लसावि.
## शाब्दिक प्रश्न कसे ओळखायचे?
- 'सर्वात लहान संख्या', 'पुन्हा एकत्र केव्हा', 'घंटा एकत्र वाजतील' → <b>लसावि</b>.
<b>उदाहरण</b>: तीन घंटा 6, 8 व 12 मिनिटांनी वाजतात. सकाळी 9 वाजता त्या एकत्र वाजल्या, तर पुन्हा एकत्र केव्हा वाजतील? लसावि (6, 8, 12) = 24 मिनिटे. उत्तर <b>9:24</b>.
- 'सर्वात मोठे माप', 'जास्तीत जास्त समान गट', 'सर्वात लांब फीत' → <b>मसावि</b>.
<b>उदाहरण</b>: 24 सफरचंद व 36 संत्री समान गटांत वाटायची आहेत (प्रत्येक गटात एकाच प्रकारची फळे). जास्तीत जास्त किती फळांचा गट होईल? मसावि (24, 36) = <b>12</b>.`,
sn:["मसावि: सामाईक अवयव, लहान घात · लसावि: सर्व अवयव, मोठे घात","गुणाकार = लसावि × मसावि (दोन संख्या)","अपूर्णांक: लसावि = अंशांचा लसावि/छेदांचा मसावि","'पुन्हा एकत्र', 'सर्वात लहान' → लसावि · 'सर्वात मोठे माप', 'समान गट' → मसावि"],
tr:["शाब्दिक प्रश्नात लसावि आणि मसावि यांची अदलाबदल करून पर्याय दिलेले असतात; प्रश्नाचे शब्द नीट वाचा.","मसावि नेहमी लसाविपेक्षा लहान किंवा समान असतो. मसावि मोठा असलेला पर्याय दिसला तर तो चुकीचा आहे."],
q:[]},

{id:"ma3",s:"mat",t:"सरलीकरण, अपूर्णांक, वर्ग व वर्गमूळ",imp:2,
pyq:"BODMAS वापरून सरलीकरण, वर्गमूळ, आणि अपूर्णांकांची तुलना असे प्रश्न येतात. यात वेळ वाचवण्यासाठी वर्ग व घन पाठ असणे आवश्यक आहे.",
d:`## BODMAS (क्रम)
<b>B</b> कंस → <b>O</b> 'चा' (of) → <b>D</b> भागाकार → <b>M</b> गुणाकार → <b>A</b> बेरीज → <b>S</b> वजाबाकी.
<b>उदाहरण</b>: 18 ÷ 3 × 2 + 4 − 1. आधी भागाकार: 6; मग गुणाकार: 12; मग बेरीज: 16; मग वजाबाकी: <b>15</b>.
## अपूर्णांक व दशांश
- ½ = 0.5 · ¼ = 0.25 · ¾ = 0.75 · ⅕ = 0.2 · ⅛ = 0.125 · ⅓ ≈ 0.333.
- <b>तुलना</b>: तिरका गुणाकार करा. उदा. 3/5 आणि 4/7 मध्ये मोठा कोणता? 3 × 7 = 21 आणि 4 × 5 = 20. 21 मोठा, म्हणून <b>3/5</b> मोठा.
## वर्ग व घन (पाठ करा)
- वर्ग: 11² = 121, 12² = 144, 13² = 169, 14² = 196, 15² = 225, 16² = 256, 17² = 289, 18² = 324, 19² = 361, 20² = 400, 25² = 625.
- घन: 2³ = 8, 3³ = 27, 4³ = 64, 5³ = 125, 6³ = 216, 7³ = 343, 8³ = 512, 9³ = 729, 10³ = 1000.
- <b>शॉर्टकट</b>: शेवटी 5 असलेल्या संख्येचा वर्ग: 35² → 3 × 4 = 12, आणि शेवटी 25 जोडा → <b>1225</b>.
## वर्गमूळ
पूर्ण वर्ग संख्येचा एकक अंक 2, 3, 7 किंवा 8 कधीच नसतो.
<b>उदाहरण</b>: √784 किती? 784 हा 28² आहे, कारण 28² = 784. पद्धत: 784 हा 20² (400) आणि 30² (900) यांच्या मध्ये आहे; एकक अंक 4 म्हणून उत्तर 22 किंवा 28; 25² = 625 < 784, म्हणून <b>28</b>.
## उपयुक्त बीजगणितीय सूत्रे
(a + b)² = a² + 2ab + b² · (a − b)² = a² − 2ab + b² · a² − b² = (a + b)(a − b).
<b>उदाहरण</b>: 102 × 98 = (100 + 2)(100 − 2) = 10000 − 4 = <b>9996</b>.`,
sn:["BODMAS: कंस → चा → भागाकार → गुणाकार → बेरीज → वजाबाकी","अपूर्णांक तुलना: तिरका गुणाकार","11² ते 25² आणि 2³ ते 10³ पाठ करा","शेवटी 5 असलेल्या संख्येचा वर्ग: n(n+1) आणि शेवटी 25","पूर्ण वर्गाचा एकक अंक 2, 3, 7, 8 कधीच नसतो","a² − b² = (a+b)(a−b) → 102 × 98 = 9996"],
tr:["BODMAS मध्ये भागाकार आणि गुणाकार यांपैकी जे डावीकडे आधी येते ते आधी करा. चुकीच्या क्रमाने सोडवलेले उत्तर पर्यायांत असते."],
q:[]},

{id:"ma4",s:"mat",t:"टक्केवारी",imp:3,
pyq:"दरवर्षी हमखास 1–2 प्रश्न येतात: वाढ-घट, लोकसंख्या, परीक्षेतील गुण, आणि खर्च-बचत. सर्व प्रश्नांचा पाया अपूर्णांक-टक्केवारी रूपांतर आहे.",
d:`## पाया: अपूर्णांक ↔ टक्के (पाठ करा)
|अपूर्णांक|टक्के|
|1/2|50%|
|1/3|33⅓%|
|1/4|25%|
|1/5|20%|
|1/6|16⅔%|
|1/8|12½%|
|1/10|10%|
|1/20|5%|
## मूलभूत प्रकार
- x चे y% = x × y/100. <b>शॉर्टकट</b>: x चे y% = y चे x%. उदा. 50 चे 18% = 18 चे 50% = 9.
- एखादी संख्या दुसऱ्या संख्येच्या किती टक्के? (पहिली ÷ दुसरी) × 100.
## वाढ व घट
- x% वाढ → संख्या × (100 + x)/100 · x% घट → संख्या × (100 − x)/100.
- <b>क्रमशः बदल</b>: a% व b% बदल झाल्यास एकूण बदल = <b>a + b + ab/100</b> (घटीसाठी ऋण चिन्ह वापरा).
<b>उदाहरण</b>: किंमत 20% वाढली आणि नंतर 10% घटली. एकूण बदल = 20 − 10 + (20 × −10)/100 = 10 − 2 = <b>8% वाढ</b>.
- x% वाढ व नंतर x% घट → नेहमी <b>x²/100 % घट</b>.
## किंमत व खर्च
किंमत x% वाढली, तर खर्च तेवढाच ठेवण्यासाठी वापर किती कमी करायचा? सूत्र: <b>x/(100 + x) × 100</b>.
<b>उदाहरण</b>: साखरेची किंमत 25% वाढली. वापर 25/125 × 100 = <b>20%</b> कमी करायला हवा.
## परीक्षेचे प्रश्न
<b>उदाहरण</b>: पास होण्यासाठी 40% गुण लागतात. एका विद्यार्थ्याला 180 गुण मिळाले आणि तो 20 गुणांनी नापास झाला. एकूण गुण किती? पासचे गुण = 200 = एकूण गुणांच्या 40%. म्हणून एकूण = 200 × 100/40 = <b>500</b>.
## लोकसंख्या
दरवर्षी R% वाढ झाल्यास n वर्षांनंतरची लोकसंख्या = P(1 + R/100)ⁿ (चक्रवाढ व्याजाचे सूत्र).`,
sn:["1/8 = 12½% · 1/6 = 16⅔% · 1/3 = 33⅓%","x चे y% = y चे x%","क्रमशः बदल: a + b + ab/100","x% वाढ मग x% घट = x²/100 % घट","किंमत x% वाढली → वापर x/(100+x) × 100 % कमी करा","परीक्षा: पासचे गुण = मिळालेले + कमी पडलेले"],
tr:["20% वाढ व 20% घट झाली तर 'बदल नाही' असा पर्याय नेहमी असतो; उत्तर 4% घट आहे.","किंमत 25% वाढल्यास वापर 25% कमी करायचा असे वाटते; प्रत्यक्षात तो 20% कमी करायचा असतो."],
q:[]},

{id:"ma5",s:"mat",t:"नफा, तोटा व सूट",imp:3,
pyq:"दरवर्षी हमखास 1–2 प्रश्न असतात. नफा% नेहमी खरेदी किमतीवर, आणि सूट% छापील किमतीवर, हा मुद्दा परीक्षक फसवण्यासाठी वापरतात.",
d:`## मूलभूत संज्ञा
खरेदी किंमत (CP), विक्री किंमत (SP), छापील किंमत (MP).
- नफा = SP − CP · तोटा = CP − SP.
- <b>नफा% = नफा ÷ CP × 100</b> (नेहमी <b>खरेदी किमतीवर</b>).
- SP = CP × (100 + नफा%)/100 · SP = CP × (100 − तोटा%)/100.
## सूट
- <b>सूट नेहमी छापील किमतीवर</b> असते. SP = MP × (100 − सूट%)/100.
- दोन क्रमशः सूट a% व b%: एकूण सूट = a + b − ab/100. उदा. 20% व 10% = 30 − 2 = <b>28%</b> (30% नाही).
## सोडवलेली उदाहरणे
1. 800 रु. ला घेतलेली वस्तू 1000 रु. ला विकली. नफा = 200. नफा% = 200/800 × 100 = <b>25%</b>.
2. एक वस्तू 20% नफ्याने 360 रु. ला विकली. खरेदी किंमत = 360 × 100/120 = <b>300 रु.</b>
3. 10 वस्तूंची खरेदी किंमत = 8 वस्तूंची विक्री किंमत. नफा% = (10 − 8)/8 × 100 = <b>25%</b>.
4. दुकानदार छापील किमतीवर 10% सूट देऊनही 20% नफा मिळवतो. खरेदी किंमत 300 असल्यास छापील किंमत किती? SP = 360. MP × 0.9 = 360, म्हणून MP = <b>400</b>.
## विशेष स्थिती
दोन वस्तू एकाच किमतीला विकल्या; एकावर x% नफा आणि दुसऱ्यावर x% तोटा. तर एकूण नेहमी <b>x²/100 % तोटा</b> होतो.`,
sn:["नफा% खरेदी किमतीवर · सूट% छापील किमतीवर","SP = CP × (100 ± %)/100","दोन सूट a, b → a + b − ab/100","x वस्तूंची CP = y वस्तूंची SP → नफा% = (x − y)/y × 100","एकाच SP ला x% नफा व x% तोटा → x²/100 % तोटा"],
tr:["नफा% विक्री किमतीवर काढलेले उत्तर पर्यायांत असते; नफा% नेहमी खरेदी किमतीवर काढतात.","20% + 10% सूट = 30% असा पर्याय असतो; खरे उत्तर 28% आहे."],
q:[]},

{id:"ma6",s:"mat",t:"सरळव्याज व चक्रवाढ व्याज",imp:3,
pyq:"रक्कम दुप्पट होण्याचा कालावधी, आणि 2 वर्षांसाठी चक्रवाढ व सरळ व्याजातील फरक यावर प्रश्न येतात.",
d:`## सरळव्याज
<b>SI = P × R × T / 100</b> (P = मुद्दल, R = दर %, T = वर्षे). रास A = P + SI.
- रक्कम n पट होण्यासाठी लागणारा काळ = (n − 1) × 100/R. उदा. 10% दराने दुप्पट होण्यास 100/10 = <b>10 वर्षे</b>; तिप्पट होण्यास 20 वर्षे.
<b>उदाहरण</b>: 5000 रु. वर 8% दराने 3 वर्षांचे सरळव्याज = 5000 × 8 × 3/100 = <b>1200 रु.</b>
## चक्रवाढ व्याज
<b>A = P(1 + R/100)ᵀ</b> · CI = A − P.
- सहामाही चक्रवाढ: दर अर्धा करा आणि वर्षे दुप्पट करा.
<b>उदाहरण</b>: 10000 रु. वर 10% दराने 2 वर्षांचे चक्रवाढ व्याज. A = 10000 × 1.1 × 1.1 = 12100. CI = <b>2100 रु.</b>
## फरक (शॉर्टकट)
- 2 वर्षांसाठी CI − SI = <b>P(R/100)²</b>. उदा. 10000 रु., 10%: 10000 × 1/100 = <b>100 रु.</b>
- 3 वर्षांसाठी CI − SI = P(R/100)² × (3 + R/100).
## उलटे प्रश्न
<b>उदाहरण</b>: एका रकमेवर 2 वर्षांचे सरळव्याज 400 रु. आणि चक्रवाढ व्याज 420 रु. आहे. दर किती? एका वर्षाचे सरळव्याज 200. फरक 20 हा 200 चे व्याज आहे. 20/200 × 100 = <b>10%</b>.`,
sn:["SI = PRT/100","दुप्पट होण्यास T = 100/R · n पट होण्यास (n−1) × 100/R","A = P(1 + R/100)ᵀ","2 वर्षे: CI − SI = P(R/100)²","सहामाही: दर ÷ 2, वर्षे × 2"],
tr:["तिप्पट होण्यास 'दुप्पटीच्या तिप्पट वेळ' असा चुकीचा विचार होतो; प्रत्यक्षात (3 − 1) × 100/R लागतात."],
q:[]},

{id:"ma7",s:"mat",t:"गुणोत्तर, प्रमाण व भागीदारी",imp:2,
pyq:"रक्कम दिलेल्या गुणोत्तरात वाटणे, आणि भागीदारीतील नफ्याचे वाटप यावर प्रश्न येतात.",
d:`## गुणोत्तर
- a : b = a/b. दोन्ही पदांना एकाच संख्येने गुणले किंवा भागले तरी गुणोत्तर बदलत नाही.
- रक्कम S ही a : b मध्ये वाटल्यास पहिल्याचा भाग = <b>S × a/(a + b)</b>.
<b>उदाहरण</b>: 720 रु. 4 : 5 मध्ये वाटले. पहिल्याला 720 × 4/9 = <b>320</b>, दुसऱ्याला 400.
- a : b आणि b : c दिले असता a : b : c काढताना b समान करा. उदा. a : b = 2 : 3 आणि b : c = 4 : 5. b ला 12 करा: a : b : c = <b>8 : 12 : 15</b>.
## प्रमाण
a : b = c : d असेल तर <b>a × d = b × c</b>. चौथे प्रमाणपद d = bc/a. मध्य प्रमाणपद = √(ab).
## भागीदारी
नफ्याचे वाटप = <b>गुंतवणूक × कालावधी</b> यांच्या गुणोत्तरात.
<b>उदाहरण</b>: A ने 5000 रु. 12 महिन्यांसाठी आणि B ने 6000 रु. 10 महिन्यांसाठी गुंतवले. गुणोत्तर 60000 : 60000 = 1 : 1. म्हणून नफा समान वाटला जाईल.
## वयाचे प्रश्न
दोघांच्या वयातील <b>फरक कधीच बदलत नाही</b>.
<b>उदाहरण</b>: A व B च्या वयांचे गुणोत्तर 3 : 4. 5 वर्षांनी ते 4 : 5 होईल. (3x + 5)/(4x + 5) = 4/5. त्यामुळे 15x + 25 = 16x + 20, म्हणजे x = 5. A = <b>15</b>, B = 20.`,
sn:["S चा a भाग = S × a/(a+b)","a:b आणि b:c जोडताना b समान करा","a:b = c:d → ad = bc · मध्य प्रमाणपद √(ab)","भागीदारी: गुंतवणूक × महिने","वयातील फरक स्थिर असतो"],
tr:["भागीदारीत फक्त गुंतवणुकीचे गुणोत्तर घेऊन काढलेले उत्तर पर्यायांत असते; कालावधीने गुणायला विसरू नका."],
q:[]},

{id:"ma8",s:"mat",t:"सरासरी",imp:3,
pyq:"नवीन व्यक्ती आल्यावर सरासरीतील बदल, चुकीची नोंद दुरुस्त करणे, आणि क्रमागत संख्यांची सरासरी असे प्रश्न येतात.",
d:`## मूलभूत
<b>सरासरी = बेरीज ÷ संख्या</b>. म्हणून बेरीज = सरासरी × संख्या. हे सूत्र उलटे वापरणे हीच बहुतेक प्रश्नांची किल्ली आहे.
- क्रमागत संख्यांची सरासरी = (पहिली + शेवटची) ÷ 2. उदा. 11 ते 31 ची सरासरी = <b>21</b>.
- पहिल्या n नैसर्गिक संख्यांची सरासरी = (n + 1)/2.
## नवीन व्यक्ती आल्यास
<b>उदाहरण</b>: 30 विद्यार्थ्यांचे सरासरी वय 14 वर्षे आहे. शिक्षकाचे वय मिळवल्यावर सरासरी 1 वर्षाने वाढते. शिक्षकाचे वय किती?
- पद्धत: नवीन सरासरी 15, एकूण 31 जण. 31 × 15 − 30 × 14 = 465 − 420 = <b>45</b>.
- <b>शॉर्टकट</b>: जुनी सरासरी + (नवीन एकूण संख्या × वाढ) = 14 + 31 × 1 = <b>45</b>.
## चूक दुरुस्ती
<b>उदाहरण</b>: 10 संख्यांची सरासरी 50 आहे. एक संख्या 65 ऐवजी 45 वाचली गेली. खरी सरासरी? बेरीज 20 ने कमी धरली गेली, म्हणून सरासरी 20/10 = 2 ने वाढेल. खरी सरासरी <b>52</b>.
## सरासरी वेग
समान अंतर x व y वेगाने कापले, तर सरासरी वेग = <b>2xy/(x + y)</b> (साधी सरासरी नाही).`,
sn:["सरासरी = बेरीज/संख्या → बेरीज = सरासरी × संख्या","क्रमागत संख्या: (पहिली + शेवटची)/2","नवीन व्यक्ती = जुनी सरासरी + (नवीन संख्या × बदल)","चूक दुरुस्ती: फरक ÷ संख्या इतका सरासरीत बदल","सरासरी वेग 2xy/(x+y)"],
tr:["40 व 60 km/h ची सरासरी 50 असे वाटते; समान अंतरासाठी खरी सरासरी 48 आहे."],
q:[]},

{id:"ma9",s:"mat",t:"काळ व काम, नळ व टाकी",imp:3,
pyq:"दोन किंवा तीन व्यक्ती मिळून काम करणे, आणि भरणारा व रिकामा करणारा नळ असे प्रश्न दरवर्षी येतात.",
d:`## मूळ कल्पना
A एक काम a दिवसांत करतो, तर त्याचे 1 दिवसाचे काम = <b>1/a</b>.
- A व B मिळून: 1/a + 1/b. एकूण दिवस = <b>ab/(a + b)</b>.
<b>उदाहरण</b>: A एक काम 12 दिवसांत आणि B 24 दिवसांत करतो. दोघे मिळून 12 × 24/36 = <b>8 दिवसांत</b> करतील.
## LCM पद्धत (सर्वात जलद)
एकूण काम = दिवसांचा लसावि मानायचे.
<b>उदाहरण</b>: A 10 दिवस, B 15 दिवस, C 30 दिवस. एकूण काम = 30 एकके. A रोज 3, B रोज 2, C रोज 1 एकक करतो. तिघे मिळून रोज 6 एकके, म्हणून 30/6 = <b>5 दिवस</b>.
- A व B मिळून 12 दिवसांत, आणि A एकटा 20 दिवसांत करत असेल तर B एकटा किती दिवसांत? काम = 60 एकके. A+B रोज 5, A रोज 3, म्हणून B रोज 2. B ला 60/2 = <b>30 दिवस</b>.
## माणसे व दिवस
<b>M1 × D1 = M2 × D2</b> (तासांचा उल्लेख असल्यास × तास).
<b>उदाहरण</b>: 12 माणसे एक काम 15 दिवसांत करतात. तेच काम 20 माणसे किती दिवसांत करतील? 12 × 15 = 20 × D, म्हणून D = <b>9 दिवस</b>.
## नळ व टाकी
भरणारा नळ = धन काम, रिकामा करणारा नळ = ऋण काम.
<b>उदाहरण</b>: नळ A टाकी 6 तासांत भरतो, आणि नळ B ती 12 तासांत रिकामी करतो. दोन्ही चालू ठेवले तर? 1/6 − 1/12 = 1/12, म्हणून <b>12 तास</b>.`,
sn:["1 दिवसाचे काम = 1/दिवस","दोघे मिळून ab/(a+b)","LCM पद्धत: एकूण काम = लसावि, मग रोजची एकके","M1 × D1 = M2 × D2","रिकामा करणारा नळ = ऋण काम"],
tr:["A व B चे दिवस थेट मिळवून (12 + 24 = 36) काढलेले उत्तर पर्यायांत असते. एकत्र काम केल्यास वेळ कमी होतो, वाढत नाही."],
q:[]},

{id:"ma10",s:"mat",t:"वेग, वेळ, अंतर, रेल्वे व बोट",imp:3,
pyq:"km/h आणि m/s चे रूपांतर, गाडीने खांब किंवा पूल ओलांडणे, सरासरी वेग, आणि प्रवाहाच्या दिशेने व विरुद्ध दिशेने बोट असे प्रश्न दरवर्षी येतात.",
d:`## मूलभूत
<b>अंतर = वेग × वेळ</b>.
- km/h → m/s: <b>× 5/18</b>. उदा. 72 km/h = <b>20 m/s</b>.
- m/s → km/h: <b>× 18/5</b>. उदा. 15 m/s = <b>54 km/h</b>.
## सापेक्ष वेग
- दोन वस्तू विरुद्ध दिशेने जात असतील: वेगांची <b>बेरीज</b>.
- एकाच दिशेने जात असतील: वेगांचा <b>फरक</b>.
## रेल्वेचे प्रश्न
- गाडी खांब किंवा माणूस ओलांडते: अंतर = <b>गाडीची लांबी</b>.
- गाडी पूल किंवा फलाट ओलांडते: अंतर = <b>गाडीची लांबी + पुलाची लांबी</b>.
<b>उदाहरण</b>: 150 मी. लांबीची गाडी 54 km/h वेगाने 250 मी. लांबीचा पूल किती वेळात ओलांडेल? वेग = 15 m/s; अंतर = 400 मी.; वेळ = 400/15 ≈ <b>26.7 सेकंद</b>.
<b>उदाहरण</b>: 200 मी. लांबीची गाडी एक खांब 10 सेकंदांत ओलांडते. वेग = 20 m/s = <b>72 km/h</b>.
## बोट व प्रवाह
बोटीचा स्थिर पाण्यातील वेग B, प्रवाहाचा वेग S.
- प्रवाहाच्या दिशेने (डाउनस्ट्रीम) = B + S · प्रवाहाविरुद्ध (अपस्ट्रीम) = B − S.
- B = (डाउन + अप)/2 · S = (डाउन − अप)/2.
<b>उदाहरण</b>: डाउनस्ट्रीम 14 km/h, अपस्ट्रीम 8 km/h. बोटीचा वेग 11, प्रवाहाचा वेग <b>3</b>.
## सरासरी वेग
समान अंतर x व y वेगाने → <b>2xy/(x + y)</b>. उदा. 40 व 60 → <b>48 km/h</b>.`,
sn:["अंतर = वेग × वेळ","km/h → m/s × 5/18 · m/s → km/h × 18/5","विरुद्ध दिशा: वेगांची बेरीज · एकाच दिशेने: वेगांचा फरक","खांब: गाडीची लांबी · पूल: गाडी + पूल","डाउन = B + S, अप = B − S; B = (D+U)/2, S = (D−U)/2","सरासरी वेग 2xy/(x+y)"],
tr:["पूल ओलांडताना फक्त पुलाची लांबी घेतलेले उत्तर पर्यायांत असते; गाडीची लांबीही मिळवा.","km/h मधील वेग तसाच m/s मध्ये वापरलेले उत्तर पर्यायांत असते."],
q:[]},

{id:"ma11",s:"mat",t:"क्षेत्रफळ, परिमिती व घनफळ",imp:2,
pyq:"आयत, चौरस, वर्तुळ, आणि घन/इष्टिकाचिती यांच्या सूत्रांवर थेट प्रश्न येतात.",
d:`## द्विमितीय आकृत्या
|आकृती|क्षेत्रफळ|परिमिती|
|आयत|लांबी × रुंदी|2(लांबी + रुंदी)|
|चौरस|बाजू²; किंवा कर्ण²/2|4 × बाजू|
|त्रिकोण|½ × पाया × उंची|तिन्ही बाजूंची बेरीज|
|समभुज त्रिकोण|(√3/4) × बाजू²|3 × बाजू|
|वर्तुळ|πr²|2πr (परीघ)|
|समांतरभुज चौकोन|पाया × उंची||
|समलंब चौकोन|½ × (समांतर बाजूंची बेरीज) × उंची||
π = 22/7 ≈ 3.14. काटकोन त्रिकोणात <b>पायथागोरस</b>: कर्ण² = पाया² + लंब².
## त्रिमितीय आकृत्या
|आकृती|घनफळ|पृष्ठफळ|
|घन|बाजू³|6 × बाजू²|
|इष्टिकाचिती|ल × रु × उं|2(लरु + रुउं + उंल)|
|वृत्तचिती (सिलिंडर)|πr²h|वक्रपृष्ठ 2πrh|
|शंकू|⅓πr²h||
|गोल|(4/3)πr³|4πr²|
## सोडवलेली उदाहरणे
1. वर्तुळाची त्रिज्या 7 सें.मी.: क्षेत्रफळ = 22/7 × 49 = <b>154 चौ.सें.मी.</b> · परीघ = 2 × 22/7 × 7 = <b>44 सें.मी.</b>
2. आयताची लांबी 20 मी. व रुंदी 15 मी. आहे. त्याच्या कर्णाची लांबी = √(400 + 225) = √625 = <b>25 मी.</b>
3. चौरसाची बाजू दुप्पट केल्यास क्षेत्रफळ <b>4 पट</b> होते. घनाची बाजू दुप्पट केल्यास घनफळ <b>8 पट</b> होते.
## एककांचे रूपांतर
1 हेक्टर = 10,000 चौ.मी. · 1 लिटर = 1000 घ.सें.मी. · 1 घ.मी. = 1000 लिटर.`,
sn:["आयत ल × रु; परिमिती 2(ल + रु) · चौरस बाजू²","वर्तुळ πr², परीघ 2πr; r = 7 → 154, 44","त्रिकोण ½ × पाया × उंची · पायथागोरस: कर्ण² = पाया² + लंब²","घन बाजू³ · इष्टिकाचिती ल × रु × उं · सिलिंडर πr²h · गोल (4/3)πr³","बाजू दुप्पट: क्षेत्रफळ 4 पट, घनफळ 8 पट","1 हेक्टर = 10,000 चौ.मी. · 1 घ.मी. = 1000 लिटर"],
tr:["बाजू दुप्पट केल्यास क्षेत्रफळ दुप्पट होते असा चुकीचा पर्याय दिला जातो; ते 4 पट होते."],
q:[]}
);

L.push(
{id:"re1",s:"rea",t:"संख्या मालिका",imp:3,
pyq:"दरवर्षी 2–4 प्रश्न हमखास असतात. बहुतेक मालिका 6 नियमांपैकी एका नियमावर आधारित असतात; ते क्रमाने तपासा.",
d:`## तपासण्याचा क्रम (हाच क्रम वापरा)
1. <b>फरक</b>: लगतच्या पदांमधील फरक स्थिर आहे का? उदा. 3, 7, 11, 15 → +4.
2. <b>फरकांचा फरक</b>: उदा. 2, 5, 10, 17, 26 → फरक 3, 5, 7, 9 (विषम संख्या) → पुढील पद <b>37</b>.

## न जुळणारे पद शोधणे

tr:["मालिका एकाआड असताना लगतचे फरक काढत बसल्यास वेळ जातो. 2–3 पदांनंतर नियम दिसत नसेल, तर एकाआड मालिका तपासा."],

{id:"re2",s:"rea",t:"अक्षर मालिका व इंग्रजी वर्णमाला",imp:2,
pyq:"अक्षरांची मालिका, अक्षरांचे स्थान, आणि 'डावीकडून/उजवीकडून कितवे अक्षर' असे प्रश्न येतात.",
d:`## स्थान क्रमांक (पाठ करा)
<b>EJOTY</b>: E = 5, J = 10, O = 15, T = 20, Y = 25. यावरून इतर अक्षरे लगेच काढता येतात. उदा. M = 13 (O च्या दोन मागे).
- उलट क्रमांक = <b>27 − स्थान</b>. उदा. D चा उलट क्रमांक = 27 − 4 = 23 = W.
- विरुद्ध जोड्या: A–Z, B–Y, C–X, D–W, E–V, F–U, G–T, H–S, I–R, J–Q, K–P, L–O, M–N.
- स्वर: A, E, I, O, U.
## मालिकेचे प्रकार
- स्थिर उडी: A, D, G, J, ? → +3 → <b>M</b>.
- वाढती उडी: A, B, D, G, K, ? → +1, +2, +3, +4, +5 → <b>P</b>.
- जोड्या: AZ, BY, CX, ? → <b>DW</b>.
- अक्षर + संख्या: A1, C3, E5, ? → <b>G7</b>.
## डावीकडून/उजवीकडून स्थान
<b>उदाहरण</b>: वर्णमालेत डावीकडून 10 व्या अक्षराच्या उजवीकडील 4 थे अक्षर कोणते? 10 + 4 = 14 → <b>N</b>.
<b>उदाहरण</b>: उजवीकडून 8 वे अक्षर कोणते? 27 − 8 = 19 → <b>S</b>.`,
sn:["EJOTY = 5, 10, 15, 20, 25","उलट क्रमांक = 27 − स्थान · विरुद्ध जोड्यांची बेरीज 27","उजवीकडून n वे अक्षर = डावीकडून (27 − n) वे","उजवीकडे सरकणे +, डावीकडे सरकणे −"],
tr:["'उजवीकडून' आणि 'डावीकडून' यांची अदलाबदल करून गोंधळ निर्माण केला जातो; प्रश्न दोनदा वाचा."],

{id:"re3",s:"rea",t:"सांकेतिक भाषा",imp:3,
pyq:"दरवर्षी 1–2 प्रश्न असतात: अक्षरांची सरकवणी, उलट क्रम, अक्षर → संख्या, आणि वाक्यातील शब्दांचे सांकेतिक रूप.",
d:`## प्रकार 1: अक्षर सरकवणे
प्रत्येक अक्षर किती पुढे किंवा मागे गेले ते पाहा.
<b>उदाहरण</b>: CAT = DBU, तर DOG = ? प्रत्येक अक्षर +1 → <b>EPH</b>.
<b>उदाहरण</b>: ROSE = TQUG (+2), तर BOOK = <b>DQQM</b>.
## प्रकार 2: उलट (विरुद्ध) अक्षर
A ↔ Z, B ↔ Y... (स्थानांची बेरीज 27). उदा. GOD = TLW.
## प्रकार 3: अक्षर → संख्या
<b>उदाहरण</b>: CAB = 312 (स्थान क्रमांक), तर BED = <b>254</b>.
<b>उदाहरण</b>: CAT = 24 (3 + 1 + 20), तर DOG = 4 + 15 + 7 = <b>26</b>.
## प्रकार 4: वाक्यातील सांकेतिक शब्द
<b>उदाहरण</b>: 'pit na ka' = 'मी घरी जातो', आणि 'ka lo pit' = 'तो घरी जातो'. दोन्हींमध्ये सामाईक शब्द 'घरी जातो', आणि सामाईक सांकेतिक शब्द 'pit ka'. म्हणून 'मी' = <b>na</b>, आणि 'तो' = <b>lo</b>.
## युक्ती
पहिल्या दोन अक्षरांवरून नियम काढा, आणि तिसऱ्या अक्षरावर तो तपासा. मग तोच नियम प्रश्नातील शब्दाला लावा.`,
sn:["सरकवणी: +1, +2, −1 इ.","उलट: A↔Z, स्थानांची बेरीज 27","अक्षर → स्थान क्रमांक, किंवा क्रमांकांची बेरीज","वाक्य सांकेतिक: सामाईक शब्द ↔ सामाईक सांकेतिक शब्द"],
tr:["सगळ्या अक्षरांना एकच नियम लागू असेलच असे नाही (उदा. +1, +2, +3). किमान तीन अक्षरांवर नियम तपासा."],
q:[]},

{id:"re4",s:"rea",t:"नातेसंबंध",imp:3,
pyq:"'फोटोकडे बोट दाखवून म्हणतो' प्रकारचे, आणि सांकेतिक नातेसंबंधांचे (A + B म्हणजे A हा B चा पिता) प्रश्न दरवर्षी येतात.",
d:`## पद्धत: कुटुंबवृक्ष काढा
- पुरुष = □ किंवा +, स्त्री = ○ किंवा −.
- पिढी वर-खाली काढा; पती-पत्नी एकाच ओळीत = चिन्हाने जोडा; भावंडे एकाच ओळीत.
- वाक्य <b>शेवटून</b> वाचा: 'माझ्या वडिलांच्या बहिणीचा मुलगा' → वडिलांची बहीण = आत्या → आत्याचा मुलगा = <b>आतेभाऊ</b>.
## महत्त्वाच्या युक्त्या
- 'माझ्या आईचा एकुलता एक मुलगा' = <b>मी</b> (बोलणारी व्यक्ती पुरुष असल्यास).
- 'माझ्या आजोबांचा एकुलता एक मुलगा' = <b>माझे वडील</b>.
- बहिणीचा मुलगा = भाचा · भावाचा मुलगा = पुतण्या · पत्नीचा भाऊ = मेहुणा · बहिणीचा पती = मेहुणा/दाजी.
## सोडवलेले उदाहरण
एका फोटोकडे बोट दाखवून रवी म्हणतो, "तो माझ्या आजोबांच्या एकुलत्या एक मुलाचा मुलगा आहे." फोटोतील व्यक्ती रवीची कोण?
- आजोबांचा एकुलता एक मुलगा = रवीचे वडील.
- वडिलांचा मुलगा = रवी स्वतः किंवा रवीचा भाऊ. पर्यायांत 'स्वतः' आणि 'भाऊ' यांपैकी जे असेल ते उत्तर. बहुतेक प्रश्नांत उत्तर <b>रवीचा भाऊ</b> असते.
## सांकेतिक नाती
<b>उदाहरण</b>: A + B म्हणजे A हा B चा पिता; A × B म्हणजे A ही B ची बहीण. तर P × Q + R म्हणजे काय? Q हा R चा पिता, आणि P ही Q ची बहीण. म्हणून P ही R ची <b>आत्या</b>.`,
sn:["कुटुंबवृक्ष: पिढी वर-खाली, पती-पत्नी एका ओळीत","वाक्य शेवटून वाचा","आजोबांचा एकुलता मुलगा = वडील","बहिणीचा मुलगा भाचा · भावाचा मुलगा पुतण्या"],
tr:["व्यक्तीचे लिंग नमूद केलेले नसेल, तर निश्चित उत्तर देता येत नाही; 'ठरवता येत नाही' हा पर्यायही बरोबर असू शकतो."],
q:[]},

{id:"re5",s:"rea",t:"दिशा व अंतर",imp:3,
pyq:"वळणे घेत चालल्यानंतर आता कोणत्या दिशेला तोंड आहे, आणि सुरुवातीपासून किती अंतरावर आहे, असे प्रश्न दरवर्षी येतात.",
d:`## दिशा
उत्तर (N), दक्षिण (S), पूर्व (E), पश्चिम (W). उपदिशा: ईशान्य (NE), आग्नेय (SE), नैऋत्य (SW), वायव्य (NW).
- <b>उजवीकडे वळणे</b> = घड्याळाच्या दिशेने 90° · <b>डावीकडे वळणे</b> = उलट दिशेने 90°.
- उत्तराकडे तोंड असताना उजवीकडे वळले तर पूर्व; पूर्वेकडून उजवीकडे दक्षिण; दक्षिणेकडून उजवीकडे पश्चिम.
## अंतर
- एकाच रेषेत: बेरीज किंवा वजाबाकी.
- काटकोनात: <b>पायथागोरस</b>. उदा. 3 व 4 → 5; 6 व 8 → 10; 5 व 12 → 13.
<b>उदाहरण</b>: राम उत्तरेकडे 10 km जातो, उजवीकडे वळून 6 km जातो, आणि पुन्हा उजवीकडे वळून 2 km जातो. आता तो सुरुवातीपासून किती दूर आहे?
- आकृती: उत्तरेकडे 10, पूर्वेकडे 6, दक्षिणेकडे 2. निव्वळ उत्तर 8, पूर्व 6. अंतर = √(64 + 36) = <b>10 km</b>.
## सावली
सकाळी सूर्य <b>पूर्वेला</b> असतो, त्यामुळे सावली <b>पश्चिमेला</b> पडते. संध्याकाळी सूर्य पश्चिमेला, सावली पूर्वेला. दुपारी 12 वाजता सावली जवळपास नसते.
<b>उदाहरण</b>: सकाळी एका व्यक्तीची सावली तिच्या उजवीकडे पडते. तिचे तोंड कोणत्या दिशेला आहे? सावली पश्चिमेला आणि ती उजवीकडे आहे, म्हणून तोंड <b>दक्षिणेला</b>.`,
sn:["उजवीकडे = घड्याळाच्या दिशेने 90°","काटकोनातील अंतर: पायथागोरस (3-4-5, 6-8-10, 5-12-13)","निव्वळ उत्तर-दक्षिण आणि निव्वळ पूर्व-पश्चिम वेगवेगळे काढा","सकाळी सावली पश्चिमेला · संध्याकाळी पूर्वेला"],
tr:["शेवटचे तोंड कोणत्या दिशेला आहे, आणि सुरुवातीपासून कोणत्या दिशेला आहे, हे दोन वेगळे प्रश्न आहेत. यांची अदलाबदल करून फसवले जाते."],
q:[]},

{id:"re6",s:"rea",t:"घड्याळ",imp:2,
pyq:"काट्यांमधील कोन, आणि आरशातील घड्याळाची वेळ असे प्रश्न वर्षाआड येतात.",
d:`## मूलभूत तथ्ये
- मिनिट काटा 1 मिनिटात <b>6°</b> फिरतो; तास काटा 1 मिनिटात <b>0.5°</b> फिरतो.
- घड्याळातील दोन लगतच्या अंकांमध्ये 30° असतात.
## कोनाचे सूत्र
<b>कोन = |30H − 5.5M|</b>. उत्तर 180° पेक्षा जास्त आले, तर 360 मधून वजा करा.
<b>उदाहरण</b>: 3:40 वाजता कोन = |90 − 220| = <b>130°</b>.
<b>उदाहरण</b>: 9:00 वाजता कोन = 270 → 360 − 270 = <b>90°</b>.
## किती वेळा?
- 12 तासांत काटे <b>11</b> वेळा एकमेकांवर येतात (24 तासांत 22).
- 24 तासांत काटे <b>44</b> वेळा काटकोनात येतात, आणि 22 वेळा एकमेकांच्या विरुद्ध दिशेला (सरळ रेषेत) असतात.
## आरशातील प्रतिमा
<b>आरशातील वेळ = 11:60 − दिलेली वेळ</b> (म्हणजे 12:00 − दिलेली वेळ).
<b>उदाहरण</b>: खरी वेळ 3:15 असेल तर आरशात 11:60 − 3:15 = <b>8:45</b> दिसेल.`,
sn:["मिनिट काटा 6°/मिनिट · तास काटा 0.5°/मिनिट","कोन = |30H − 5.5M|","12 तासांत 11 वेळा एकमेकांवर; 24 तासांत 22","24 तासांत 44 वेळा काटकोन","आरशातील वेळ = 11:60 − वेळ"],
tr:["12 तासांत काटे 12 वेळा एकमेकांवर येतात असा चुकीचा पर्याय दिला जातो; उत्तर 11 आहे."],
q:[]},

{id:"re7",s:"rea",t:"दिनदर्शिका",imp:2,
pyq:"'X तारखेला कोणता वार होता' आणि 'N दिवसांनी कोणता वार' असे प्रश्न येतात. विषम दिवसांची संकल्पना वापरली की ते 30 सेकंदांत सुटतात.",
d:`## विषम दिवस (ऑड डेज)
आठवड्यात 7 दिवस असतात. म्हणून दिवसांच्या संख्येला 7 ने भागल्यावर उरलेली बाकी म्हणजे विषम दिवस.
- सामान्य वर्ष (365 दिवस) = 52 आठवडे + <b>1 विषम दिवस</b>.
- लीप वर्ष (366 दिवस) = 52 आठवडे + <b>2 विषम दिवस</b>.
- म्हणून एखादी तारीख पुढच्या वर्षी 1 वार पुढे जाते (मध्ये 29 फेब्रुवारी आला तर 2 वार).
## लीप वर्ष
4 ने भाग जाणारे वर्ष लीप असते. पण <b>शतकी वर्ष</b> (00 ने संपणारे) 400 ने भाग जात असेल तरच लीप असते. 2000 लीप आहे; 1900 आणि 2100 लीप नाहीत.
## शतकांचे विषम दिवस
100 वर्षे → 5 · 200 वर्षे → 3 · 300 वर्षे → 1 · 400 वर्षे → 0.
## N दिवसांनंतरचा वार
<b>उदाहरण</b>: आज सोमवार आहे. 61 दिवसांनी कोणता वार? 61 ÷ 7 ची बाकी 5. सोमवार + 5 = <b>शनिवार</b>.
## तारखेवरून वार
<b>उदाहरण</b>: 15 ऑगस्ट 2026 रोजी शनिवार आहे. 15 ऑगस्ट 2027 ला कोणता वार? मध्ये 29 फेब्रुवारी नाही (2027 लीप नाही), म्हणून 1 वार पुढे: <b>रविवार</b>.
## महिन्यांचे विषम दिवस
31 दिवसांचा महिना → 3 विषम दिवस · 30 दिवसांचा → 2 · फेब्रुवारी 28 → 0, 29 → 1.`,
sn:["सामान्य वर्ष 1 विषम दिवस · लीप वर्ष 2","शतकी वर्ष 400 ने भाग जायला हवे (2000 लीप, 1900 नाही)","100 वर्षे = 5 विषम दिवस · 400 वर्षे = 0","N दिवसांनी: N ÷ 7 ची बाकी इतके वार पुढे","31 दिवस → 3 · 30 दिवस → 2 विषम दिवस"],
tr:["1900 हे वर्ष 4 ने भाग जाते म्हणून लीप वर्ष आहे असे वाटते, पण ते लीप वर्ष नाही."],
q:[]},

{id:"re8",s:"rea",t:"वेन आकृती, विसंगत घटक, क्रम व रांग",imp:2,
pyq:"विसंगत घटक, वेन आकृतीची निवड, रांगेतील स्थान, आणि वर्गीकरणाचे प्रश्न दरवर्षी येतात.",
d:`## विसंगत घटक
इतरांपेक्षा वेगळा घटक शोधायचा असतो. गट असे तपासा:
- संख्या: सम/विषम, मूळ, वर्ग, घन, एखाद्या संख्येच्या पटीत.
- शब्द: एकाच वर्गातील वस्तू (फळे, धातू, राज्ये, वाद्ये), उपयोग, अक्षरांची संख्या.
<b>उदाहरण</b>: 27, 64, 125, 144, 216 → 144 घन संख्या नाही (वर्ग आहे) → <b>144</b>.
<b>उदाहरण</b>: सिंह, वाघ, हत्ती, चित्ता → हत्ती शाकाहारी आहे, बाकीचे मांसाहारी → <b>हत्ती</b>.
## वेन आकृती
- पूर्णपणे आत: भारत ⊂ आशिया ⊂ जग (एकात एक वर्तुळे).
- अंशतः एकत्र: डॉक्टर, स्त्रिया, आई (छेदणारी वर्तुळे).
- पूर्णपणे वेगळे: मांजर, टेबल, पेन.
- दोन आत, एक बाहेर: पुरुष, वडील, स्त्री (वडील पुरुषांच्या आत; स्त्री वेगळी).
## रांगेतील स्थान
- <b>एकूण = डावीकडून स्थान + उजवीकडून स्थान − 1</b>.
<b>उदाहरण</b>: रांगेत रवी डावीकडून 12 वा आणि उजवीकडून 18 वा आहे. एकूण = 12 + 18 − 1 = <b>29</b>.
- दोघांमधील व्यक्ती: <b>उदाहरण</b>: 40 जणांच्या रांगेत A डावीकडून 10 वा, B उजवीकडून 15 वा. B डावीकडून 40 − 15 + 1 = 26 वा. दोघांमध्ये 26 − 10 − 1 = <b>15</b> जण.
## उंची/वयाचा क्रम
A > B, C < B, D > A असेल तर क्रम D > A > B > C. असे सर्व संबंध एका ओळीत मांडा.`,
sn:["विसंगत: संख्यांचे गुणधर्म, शब्दांचा वर्ग तपासा","वेन: पूर्ण आत, अंशतः, वेगळे","एकूण = डावीकडून + उजवीकडून − 1","उजवीकडून n वा = डावीकडून (एकूण − n + 1) वा","क्रमाचे संबंध एका ओळीत मांडा"],
tr:["रांगेच्या प्रश्नात '−1' विसरल्याने येणारे उत्तर पर्यायांत असते."],
q:[]}
);

{id:"gk1",s:"gk",t:"महाराष्ट्र विशेष: प्रथम, प्रतीके, वारसा व सन्मान",imp:3,

function bankLessons(ids,n){
  let out=shuffle(ids.flatMap(id=>LX[id].q.map(q=>toQ(LX[id],q))));

  while(g.length&&(out.length<n||k<Math.ceil(n/3))&&k<200){out.push(genFor(pick(g)));k++}

/* ---------- प्रगती ---------- */
function rec(q,ok,noSr){
  const st=store.get("stats",{});st[q.s]=st[q.s]||[0,0];st[q.s][1]++;if(ok)st[q.s][0]++;store.set("stats",st);
  const ls=store.get("lstats",{});ls[q.l]=ls[q.l]||[0,0];ls[q.l][1]++;if(ok)ls[q.l][0]++;store.set("lstats",ls);
  if(!(noSr&&ok))srRec(q,ok);
  const days=store.get("days",{});const d=dkey(new Date());days[d]=(days[d]||0)+1;store.set("days",days);
}
/* ---------- चुकलेले प्रश्न: अंतराने उजळणी (1, 3, 7 दिवस) ---------- */
const SRI=[1,3,7];
const addDays=n=>{const d=today0();d.setDate(d.getDate()+n);return dkey(d)};
const srList=()=>store.get("wrong",[]).map(x=>x.due?x:{...x,box:0,due:dkey(today0())});
const sameQ=(x,q)=>x.id&&q.id?x.id===q.id:x.q===q.q;
const srDue=()=>{const t=dkey(today0());return srList().filter(x=>x.due<=t)};
function srRec(q,ok){
  const wr=srList(),i=wr.findIndex(x=>sameQ(x,q)),t=dkey(today0());
  if(!ok){const it={s:q.s,l:q.l,id:q.id,q:q.q,o:q.o,a:q.a,e:q.e,box:0,due:addDays(SRI[0]),miss:(i>=0&&wr[i].miss||0)+1};
    if(i>=0)wr.splice(i,1);wr.push(it);store.set("wrong",wr.slice(-300));return}
  if(i<0||wr[i].due>t)return;
  const b=wr[i].box+1;
  if(b>=SRI.length){wr.splice(i,1);store.set("mastered",store.get("mastered",0)+1)}else{wr[i].box=b;wr[i].due=addDays(SRI[b])}
  store.set("wrong",wr)}
const startReview=()=>{const d=srDue();if(d.length)quiz(shuffle(d).slice(0,30).map(freshQ),"आजची उजळणी")};
const streak=()=>{const days=store.get("days",{});let s=0;const d=today0();if(!days[dkey(d)])d.setDate(d.getDate()-1);while(days[dkey(d)]){s++;d.setDate(d.getDate()-1)}return s};
const isRead=id=>store.get("read",[]).includes(id);
const markRead=id=>{const r=store.get("read",[]);if(!r.includes(id)){r.push(id);store.set("read",r)}};

/* ls = [[lessonId, weight]] सर्वात कमजोर आधी. avoid = ज्या प्रश्नांच्या key टाळायच्या (उदा. नुकताच दिलेला मॉक). */
function weakDrill(ls,avoid,N){N=N||25;avoid=avoid||new Set();
  ls=ls.filter(([l])=>LX[l]&&(LX[l].q.length||GEN[l])).slice(0,5);if(!ls.length)return [];
  const tw=ls.reduce((a,[,w])=>a+w,0)||1,want=ls.map(([l,w])=>Math.max(3,Math.round(N*w/tw)));
  const out=[],seen=new Set(),add=q=>{if(!q)return false;const k=qkey(q);if(seen.has(k))return false;seen.add(k);out.push(q);return true};

  return shuffle(out).slice(0,N)}

function md(src){
  const out=[];let list=null,tbl=null;
  const fl=()=>{if(list){out.push(`<${list.t}>${list.i.map(x=>`<li>${x}</li>`).join("")}</${list.t}>`);list=null}};
  const ft=()=>{if(tbl){out.push(`<div class="scroll"><table class="t"><thead><tr>${tbl[0].map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${tbl.slice(1).map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);tbl=null}};
  for(const raw of src.split("\n")){const s=raw.trim();let m;
    if(!s){fl();ft();continue}
    if(s.startsWith("|")){fl();(tbl=tbl||[]).push(s.replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));continue}
    ft();
    if(s.startsWith("## ")){fl();out.push(`<h3>${s.slice(3)}</h3>`);continue}
    if(s.startsWith("- ")){if(!list||list.t!=="ul"){fl();list={t:"ul",i:[]}}list.i.push(s.slice(2));continue}
    if(m=s.match(/^\d+\.\s(.*)/)){if(!list||list.t!=="ol"){fl();list={t:"ol",i:[]}}list.i.push(m[1]);continue}
    fl();out.push(`<p>${s}</p>`);
  }
  fl();ft();return out.join("");
}

function quiz(qs,title,noSr,onDone){

    const q=qs[i];
    main.innerHTML=`<div class="qhead"><span>${title}</span><span>${i+1}/${qs.length} · बरोबर ${score}</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
    <p class="small">${qtag(q)}${SN[q.s].name}</p><p class="qs">${esc(q.q)}</p>
    <div class="opts">${q.o.map((o,k)=>`<button class="op" data-k="${k}"><span class="bub">${LT[k]}</span>${esc(o)}</button>`).join("")}</div><button class="btn" id="dk" style="margin-top:12px">माहीत नाही, सोडतो</button><div id="fb"></div>`;
    const answer=k=>{const sk=k<0,ok=k===q.a;if(ok)score++;if(sk)skip++;rec(q,ok,noSr);$("#dk").remove();
      main.querySelectorAll(".op").forEach((x,j)=>{x.disabled=true;if(j===q.a)x.classList.add("ok");else if(j===k)x.classList.add("bad")});
      $("#fb").innerHTML=`<div class="exp ${ok?"g":"r"}"><b>${ok?"बरोबर!":(sk?"सोडला (0 गुण). ":"चूक (−0.25). ")+"बरोबर उत्तर: "+LT[q.a]+". "+esc(q.o[q.a])}</b><br>${esc(q.e)}${qwarn(q)} <a href="#l-${q.l}">धडा पाहा ›</a>${sk?"<br><small>हा प्रश्न उजळणीच्या यादीत गेला.</small>":""}</div><button class="btn pri" id="nx">${i+1<qs.length?"पुढचा प्रश्न ›":"निकाल पाहा"}</button>`;
      $("#nx").onclick=()=>{i++;show()};$("#nx").focus()};
    main.querySelectorAll(".op").forEach(b=>b.onclick=()=>answer(+b.dataset.k));$("#dk").onclick=()=>answer(-1);

/* ---------- मॉक ---------- */
const MIX={ca:12,his:14,geo:14,pol:14,eco:10,sci:14,gk:4,mat:9,rea:9};
function buildMock(n){const f=n/100,out=[];
  for(const [s,c] of Object.entries(MIX)){const want=Math.max(1,Math.round(c*f));
    const ids=bySub(s).map(l=>l.id);const stat=shuffle(ids.flatMap(id=>LX[id].q.map(q=>toQ(LX[id],q)))).filter(q=>!q.c);const g=ids.filter(id=>GEN[id]);
    for(let k=0;k<want;k++){if(g.length&&k%2===1)out.push(genFor(pick(g)));else out.push(stat[k%stat.length])}}
  return shuffle(out).slice(0,n)}
/* ---------- क्रमांकित मॉक (30), विषयवार चाचण्या (100), वर्षनिहाय प्रश्नपत्रिका ----------
   प्रत्येक विषयाचे प्रश्न एका ठरलेल्या (hash) क्रमात, धड्यांची आलटून-पालटून मांडणी करून लावले जातात.
   संच k ला त्या क्रमातील पुढचा तुकडा मिळतो, त्यामुळे लागोपाठच्या संचांत पुनरावृत्ती होत नाही आणि
   सर्व प्रश्न सारख्या वेळा येतात. प्रश्नसंच वाढला की संचांत नवे प्रश्न आपोआप येतात. */
const hsh=t=>{let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const seeded=a=>()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
const withSeed=(sd,f)=>{const R=Math.random;Math.random=seeded(sd);try{return f()}finally{Math.random=R}};
const qkey=q=>q.id||q.q;
const ORDQ={};
function subOrder(sid){if(ORDQ[sid])return ORDQ[sid];
  const g=bySub(sid).map(l=>l.q.map(q=>toQ(l,q)).filter(q=>!q.c).sort((a,b)=>hsh("o"+qkey(a))-hsh("o"+qkey(b)))).filter(x=>x.length).sort((a,b)=>hsh("l"+a[0].l)-hsh("l"+b[0].l));
  const out=[];for(let i=0;g.some(x=>x.length>i);i++)g.forEach(x=>{if(x[i])out.push(x[i])});return ORDQ[sid]=out}
const slice=(sid,start,want)=>{const o=subOrder(sid);return o.length?Array.from({length:Math.min(want,o.length)},(_,j)=>o[(start+j)%o.length]):[]};
const PAPER=["ca","pol","his","geo","gk","eco","sci","mat","rea"];
const NFM=30;
function fixedMock(k){return withSeed(hsh("fm"+k),()=>{const out=[];
  for(const s of PAPER){const c=MIX[s];const gen=bySub(s).map(l=>l.id).filter(id=>GEN[id]);const nst=gen.length?Math.ceil(c/2):c;
    const st=slice(s,k*nst,nst);const gq=gen.length?Array.from({length:c-st.length},()=>genFor(pick(gen))):[];
    out.push(...shuffle([...st,...gq]))}return out})}
const TESTS={his:12,geo:12,pol:12,eco:10,sci:14,gk:8,ca:8,mat:12,rea:12};
function subTest(s,k){const gen=bySub(s).map(l=>l.id).filter(id=>GEN[id]);
  return withSeed(hsh("st"+s+k),()=>{const nst=gen.length?15:25;const st=slice(s,k*nst,nst);
    const gq=gen.length?Array.from({length:25-st.length},()=>genFor(pick(gen))):[];return shuffle([...st,...gq])})}

  return out}

  const file=new File([txt],name,{type:"application/json"});let shared=false;
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"गट-क सराव बॅकअप"});shared=true}}catch(e){if(e&&e.name==="AbortError"){$("#bkinfo").textContent=bkAge();return}}
  if(!shared){const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4e3)}
  $("#bkinfo").textContent=bkAge();$("#bkm").innerHTML=`<div class="exp g">बॅकअप फाइल तयार: <b>${esc(name)}</b>. ती Google Drive / WhatsApp वर स्वतःला पाठवून ठेवा.</div>`}
function readBackup(f){const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result)}catch(e){o=null}
  const data=o&&o.app==="gc2"&&o.data&&typeof o.data==="object"?o.data:null,keys=data?Object.keys(data).filter(k=>k.startsWith("gc2_")&&typeof data[k]==="string"):[];
  if(!keys.length){$("#bkm").innerHTML=`<div class="exp r">ही फाइल या app ची बॅकअप फाइल नाही.</div>`;return}
  const when=o.at?new Date(o.at).toLocaleString("mr-IN"):"";
  $("#bkm").innerHTML=`<div class="exp r">या फाइलमधील प्रगती${when?" ("+esc(when)+")":""} उघडल्यास सध्याची प्रगती बदलली जाईल. पुढे जायचे?<div class="btns"><button class="btn pri" id="bky">हो, बॅकअप उघडा</button><button class="btn" id="bkn">नाही</button></div></div>`;
  $("#bkn").onclick=()=>$("#bkm").innerHTML="";
  $("#bky").onclick=()=>{try{gcKeys().forEach(k=>localStorage.removeItem(k));keys.forEach(k=>localStorage.setItem(k,data[k]))}catch(e){$("#bkm").innerHTML=`<div class="exp r">जतन करता आले नाही: ${esc(e.message||e)}</div>`;return}
    vProgress();$("#bkm").innerHTML=`<div class="exp g">बॅकअप उघडला ✓ सर्व प्रगती परत आली.</div>`}};
  r.onerror=()=>{$("#bkm").innerHTML=`<div class="exp r">फाइल वाचता आली नाही.</div>`};r.readAsText(f)}

function route(){clearInterval(timer);const h=location.hash.slice(1)||"today";
  const tab=h.startsWith("l-")||h.startsWith("rv-")||h==="sh"||h.startsWith("sh-")||h==="strategy"||h==="ref"||h.startsWith("rf-")?"learn":h.startsWith("mr-")?"mock":h;
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+tab));
  if(h.startsWith("l-"))vLesson(h.slice(2));else if(h.startsWith("rv-"))vRevise(h.slice(3));else if(h.startsWith("mr-"))vMockReview(h.slice(3));else if(h.startsWith("rf-"))vRefSec(h.slice(3));else if(h==="sh"||h.startsWith("sh-"))vSheet(h.slice(3));
  else({today:()=>vToday(),learn:vLearn,strategy:vStrategy,ref:vRef,practice:vPractice,mock:vMock,progress:vProgress}[h]||(()=>vToday()))();
  if(!h.startsWith("sec-"))window.scrollTo(0,0)}
