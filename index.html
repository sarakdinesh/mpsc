<style>
/* VOICE: शांत, शिस्तबद्ध परीक्षा-साथी, रोज वापरायचे साधन
   IDEA: OMR उत्तरपत्रिका – शाईचा निळा आणि गुलाबी रेषा, पर्याय गोल बबलमध्ये
   PICTURE: आजचे काम: दिवस उरले + पूर्णतेचे वर्तुळ, आणि त्याखाली वेळापत्रक
   COLOUR and TYPE: शाई-निळा #142a6e, OMR गुलाबी #e2336b, पांढरा कागद; Mukta
   LAYOUT: फोनसाठी एक स्तंभ, तळाशी app सारखी टॅब पट्टी, 720px पर्यंत रुंद */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0c1330);--card:light-dark(#f4f6fb,#151e45);--ink:light-dark(#141a2e,#e9ecf7);--mut:light-dark(#5a6178,#a7aecb);--blue:light-dark(#142a6e,#8fa8ff);--pink:#e2336b;--line:light-dark(#dfe3ee,#28325e);--ok:light-dark(#1d7a46,#5fd393);--bad:light-dark(#c62828,#ff7a7a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Mukta,"Noto Sans Devanagari",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}

header b{font-size:20px;font-weight:800}header span{font-size:14px;opacity:.9}
#main{max-width:720px;margin:0 auto;padding:16px max(4vw,16px) calc(96px + env(safe-area-inset-bottom))}
h1{font-size:30px;line-height:1.15;margin:8px 0 10px;text-wrap:balance}
h2{font-size:20px;margin:26px 0 10px}h3{font-size:18px;margin:0 0 8px}
a{color:var(--blue)}
.lead{color:var(--mut);margin:0 0 14px}.small{font-size:14px;color:var(--mut)}
.kicker{font-size:14px;font-weight:600;color:var(--pink);margin:4px 0}
.note{background:var(--card);border-left:4px solid var(--pink);padding:10px 12px;border-radius:6px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--card);border-radius:16px;padding:18px;background-image:repeating-linear-gradient(0deg,transparent 0 27px,color-mix(in srgb,var(--pink) 18%,transparent) 27px 28px)}
.count{display:flex;align-items:center;gap:12px}.count b{font-size:clamp(56px,16vw,84px);line-height:1;font-weight:800;color:var(--blue)}.count span{font-size:15px;color:var(--mut);line-height:1.3}
.ring{--p:0;width:108px;height:108px;border-radius:50%;background:conic-gradient(var(--pink) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-align:center;font-weight:800;font-size:20px;line-height:1}
.ring small{display:block;font-size:12px;font-weight:400;color:var(--mut);margin-top:-14px}
.slots{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.slots li{border-bottom:1px solid var(--line)}

.slots input{width:22px;height:22px;accent-color:var(--pink);margin-top:3px}

.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 14px;border-radius:20px;background:var(--card);text-decoration:none;font-weight:600;border:1px solid var(--line)}

.op.sel{border-color:var(--blue)}.op.sel .bub{background:var(--blue);border-color:var(--blue);color:var(--bg)}
.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}.op.ok .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.op.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--bg))}.op.bad .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.exp{border-radius:10px;padding:12px 14px;margin:16px 0 4px;font-size:16px}.exp.g{background:color-mix(in srgb,var(--ok) 12%,var(--bg))}.exp.r{background:color-mix(in srgb,var(--bad) 10%,var(--bg))}
.big{font-size:clamp(56px,18vw,88px);font-weight:800;color:var(--blue);line-height:1.1}.big small{font-size:28px;color:var(--mut)}
.omr{margin-top:8px}.omr summary{cursor:pointer;font-weight:600;padding:8px 0}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.ob{appearance:none;font:inherit;font-size:13px;height:40px;border-radius:50%;border:1.5px solid var(--pink);background:transparent;color:var(--ink);cursor:pointer}
.ob.f{background:var(--blue);border-color:var(--blue);color:var(--bg)}.ob.fl{border-style:dashed;border-width:2px;background:color-mix(in srgb,var(--pink) 18%,transparent)}
.gs{display:flex;gap:10px;align-items:center;margin:12px 0 0;font-size:15px;min-height:44px;cursor:pointer}.gs input{width:22px;height:22px;accent-color:var(--pink)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--card);color:var(--mut);margin-left:6px}
.op.sk{border-style:dashed}.tl{list-style:none;margin:10px 0;padding:0 0 0 14px;border-left:3px solid var(--line)}.tl li{position:relative;margin:0 0 10px;padding-left:6px}.tl li::before{content:"";position:absolute;left:-22px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--pink)}.tl b{display:block}.sqg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:8px 0 14px}.sqg span{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:14px}.ob.c{outline:2px solid var(--pink);outline-offset:2px}
.bars{display:grid;gap:8px}.br{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3.5em;gap:10px;align-items:center;font-size:15px}
.br div{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.br i{display:block;height:100%;background:var(--blue)}.br.weak i{background:var(--bad)}.br b{text-align:right}
.rev{padding-left:22px}.rev li{margin:12px 0;padding:8px 10px;border-radius:8px;border-left:4px solid var(--line)}.rev li.g{border-color:var(--ok)}.rev li.r{border-color:var(--bad)}.rev p{margin:2px 0;white-space:pre-line}
.hist{list-style:none;padding:0}.hist li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.hist a{color:inherit}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.flt button{appearance:none;font:inherit;font-size:15px;font-weight:600;min-height:40px;padding:6px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}.flt button.on{border-color:var(--blue);background:var(--blue);color:var(--bg)}
.rev .ol{list-style:none;padding:0;margin:6px 0}.rev .ol li{margin:2px 0;padding:2px 8px;border:0;font-size:15px}.rev .ol li.a{color:var(--ok);font-weight:700}.rev .ol li.y{color:var(--bad);text-decoration:line-through}
.lsn{list-style:none;padding:0}.lsn li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.lsn small{color:var(--mut);white-space:nowrap}
.srbox{display:flex;gap:8px;margin:8px 0}.srbox div{flex:1;background:var(--card);border-radius:10px;padding:8px;text-align:center}.srbox b{display:block;font-size:22px;color:var(--blue)}.srbox small{color:var(--mut);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:10px}.stats div{background:var(--card);border-radius:12px;padding:12px;text-align:center}.stats b{display:block;font-size:26px;color:var(--blue)}.stats small{color:var(--mut);font-size:13px}
.mk{position:relative;height:180px;display:flex;gap:6px;align-items:flex-end;border-bottom:1.5px solid var(--line);margin:24px 0 26px}
.mc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}.mc i{display:block;width:100%;max-width:36px;background:var(--blue);border-radius:6px 6px 0 0}.mc i.g{background:var(--ok)}.mc{position:relative}.mc small{font-size:12px;color:var(--mut);position:absolute;top:100%;margin-top:3px}
.line.cl{border-top-color:var(--mut);color:var(--mut);text-align:left}.mc i.m{background:#b8560f}.gu{color:var(--ok)}.gd{color:var(--bad)}.nn h2 small{color:var(--mut);font-weight:400}.nn .slots label{grid-template-columns:28px minmax(0,1fr)}
.line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--pink);font-size:12px;color:var(--pink);text-align:right;transform:translateY(-1px)}
textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
details>summary{min-height:40px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;text-decoration:none;color:var(--mut);font-size:13px;font-weight:600;min-height:56px}
nav a svg{width:22px;height:22px}nav a.on{color:var(--pink)}
.daynav{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;text-align:center;gap:8px;margin:16px 0 4px}
.daynav small{color:var(--mut)}.btn.sm{min-height:44px;padding:0;width:48px}

.slots a{font-weight:600}
.tabs{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--line);margin:12px 0}
.tabs a{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);text-decoration:none;font-weight:600;font-size:15px}
.lesson h3{font-size:19px;margin:22px 0 8px;color:var(--blue)}
.lesson p{margin:8px 0}.lesson b{color:var(--blue)}
.t{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0}.t th,.t td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.t th{background:var(--card)}.t .n{text-align:right;white-space:nowrap}
.sn{background:color-mix(in srgb,var(--blue) 8%,var(--bg));border-radius:12px;padding:4px 16px 8px;margin-top:22px}
.trap{background:color-mix(in srgb,var(--pink) 8%,var(--bg));border-radius:12px;padding:4px 16px 8px;margin-top:16px}
.src{font-size:13px;opacity:.85;margin-top:16px}.src h2{font-size:15px}.src li{margin:4px 0;overflow-wrap:anywhere}

.box{background:var(--card);border-radius:12px;padding:10px 16px;margin:14px 0}.box summary{font-weight:600;cursor:pointer}

@media(prefers-reduced-motion:no-preference){.ring{transition:background .4s}.op{transition:border-color .15s,background .15s}}
.qy{display:inline-block;font-size:12px;padding:1px 7px;border-radius:9px;background:color-mix(in srgb,var(--c,#142a6e) 14%,transparent);font-weight:600}.qu{font-size:14px;color:var(--bad)}.qy.ok{background:color-mix(in srgb,var(--ok) 18%,transparent)}
/* लॉगिन: साधे कुलूप. app सार्वजनिक आहे, म्हणून येथे पासवर्ड नसून फक्त त्याचा SHA-256 hash आहे. */
html.locked header,html.locked #main,html.locked nav{display:none}
#login{display:none}html.locked #login{display:grid;min-height:100vh;min-height:100dvh;place-items:center;padding:24px max(4vw,16px)}
#login form{width:100%;max-width:380px;background:var(--card);border-radius:16px;border-top:6px solid var(--pink);padding:22px 20px}
#login h1{margin:0 0 4px;color:var(--blue)}#login label{display:block;font-weight:600;margin:14px 0 4px}
#login input{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
#login input:focus-visible{outline:3px solid var(--pink);outline-offset:1px}
#login .btn{width:100%;margin-top:18px}
#lgout{appearance:none;font:inherit;font-size:14px;font-weight:600;color:#fff;background:transparent;border:1.5px solid rgba(255,255,255,.6);border-radius:8px;padding:4px 10px;margin-left:10px;min-height:34px;cursor:pointer}
#lgout:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
header .hr{display:flex;align-items:center}
</style>
<script>
/* लॉगिन स्थिती: "gc2auth" ही key "gc2_" ने सुरू होत नाही, त्यामुळे बॅकअप/"सर्व प्रगती पुसा" यांना ती लागत नाही आणि लॉगआउटने प्रगती पुसली जात नाही. */
const AUTH_HASH="c47d3b0bede0dc16675e06beb790b41e59869da93e0dad92a50540a6c28fdebb";
function authOk(){try{return localStorage.getItem("gc2auth")===AUTH_HASH}catch(e){return false}}
if(!authOk())document.documentElement.classList.add("locked");
</script>
</head>
<body>
<div id="login"><form id="lgf" autocomplete="on">
 <h1>गट-क सराव</h1><p class="small">सुरू करण्यासाठी लॉगिन करा.</p>
 <label for="lgu">वापरकर्ता नाव</label><input id="lgu" name="username" autocomplete="username" inputmode="numeric" required>
 <label for="lgp">पासवर्ड</label><input id="lgp" name="password" type="password" autocomplete="current-password" required>
 <div id="lgm" role="alert"></div>
 <button class="btn pri" type="submit">लॉगिन</button>
</form></div>
<header><b>गट-क सराव</b><span class="hr"><span>परीक्षेला <b id="dl" style="font-size:16px"></b> दिवस</span><button id="lgout" type="button">लॉगआउट</button></span></header>
<main id="main"></main>
<nav>
 <a href="#today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>आज</a>
 <a href="#learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-5a3 3 0 0 0-3 3"/><path d="M20 4v14h-6"/></svg>अभ्यास</a>
 <a href="#practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>सराव</a>
 <a href="#mock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>मॉक</a>
 <a href="#progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>प्रगती</a>
</nav>
<script>
/* लॉगिन / लॉगआउट */
(function(){const f=document.getElementById("lgf"),m=document.getElementById("lgm");
  async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,"0")).join("")}
  f.onsubmit=async e=>{e.preventDefault();m.innerHTML="";
    const u=document.getElementById("lgu").value.trim(),p=document.getElementById("lgp").value;let h="";
    try{h=await sha("gc2-login|"+u+"|"+p)}catch(err){m.innerHTML='<div class="exp r">हा ब्राउझर लॉगिन तपासू शकत नाही. Chrome मध्ये उघडा.</div>';return}
    if(h!==AUTH_HASH){m.innerHTML='<div class="exp r">वापरकर्ता नाव किंवा पासवर्ड चुकीचा आहे.</div>';document.getElementById("lgp").value="";return}
    try{localStorage.setItem("gc2auth",h)}catch(err){}
    document.getElementById("lgp").value="";document.documentElement.classList.remove("locked");window.scrollTo(0,0)};
  document.getElementById("lgout").onclick=()=>{try{localStorage.removeItem("gc2auth")}catch(err){}
    document.documentElement.classList.add("locked");document.getElementById("lgu").focus()};
  if(!authOk())setTimeout(()=>document.getElementById("lgu").focus(),0)})();
</script>

d:`## संविधान सभा कशी बनली?

26 जानेवारी हीच तारीख का निवडली? कारण 26 जानेवारी 1930 रोजी काँग्रेसने 'पूर्ण स्वराज्य दिन' साजरा केला होता. संविधान बनवायला <b>2 वर्षे 11 महिने 18 दिवस</b> लागले. घटनात्मक सल्लागार <b>बी. एन. राव</b> होते.

## मूळ संविधान व अनुसूची

मूळ सातव्या अनुसूचीत केंद्र सूचीत 97, राज्य सूचीत 66 आणि समवर्ती सूचीत 47 विषय होते. संरक्षण, रेल्वे, परराष्ट्र व्यवहार हे केंद्र सूचीत आहेत. पोलीस, सार्वजनिक आरोग्य, शेती हे राज्य सूचीत आहेत. शिक्षण, वने, विवाह हे समवर्ती सूचीत आहेत (शिक्षण आणि वने 42 व्या दुरुस्तीने राज्य सूचीतून समवर्तीत आले).
## संघ व राज्यक्षेत्र (भाग I, कलम 1–4)
- <b>कलम 1</b>: 'इंडिया, म्हणजेच भारत, हा <b>राज्यांचा संघ</b> (Union of States) असेल.'
- कलम 3: नवीन राज्य निर्माण करणे, राज्याचे नाव किंवा सीमा बदलणे हे <b>संसद साध्या कायद्याने</b> करू शकते (राष्ट्रपतींच्या शिफारशीने विधेयक मांडले जाते; संबंधित राज्याचे मत घेतले जाते, पण ते संसदेवर बंधनकारक नाही).
## नागरिकत्व (भाग II, कलम 5–11)
- संविधानात नागरिकत्वाच्या तरतुदी <b>कलम 5 ते 11</b> मध्ये आहेत. कलम 11 नुसार नागरिकत्वाबाबत कायदा करण्याचा अधिकार <b>संसदेला</b> आहे.
- संसदेने <b>नागरिकत्व कायदा 1955</b> केला. त्यानुसार नागरिकत्व मिळण्याचे 5 मार्ग: <b>जन्म, वंश, नोंदणी, देशीयीकरण</b> (naturalisation) आणि <b>प्रदेशाचा समावेश</b>.
- नागरिकत्व जाण्याचे 3 मार्ग: <b>त्याग</b> (स्वतः सोडणे), <b>समाप्ती</b> (दुसऱ्या देशाचे नागरिकत्व स्वेच्छेने घेतल्यास आपोआप), आणि <b>वंचित करणे</b> (सरकारकडून).
- भारतात <b>एकेरी नागरिकत्व</b> आहे (ब्रिटनकडून घेतले). OCI (भारताचे परदेशी नागरिक) कार्ड ही सोय आहे; ते दुहेरी नागरिकत्व नाही.
- कलम 15, 16, 19, 29 व 30 चे हक्क <b>फक्त नागरिकांना</b> आहेत. कलम 14, 20, 21 चे हक्क परकीयांनाही आहेत.
- <b>नागरिकत्व सुधारणा कायदा 2019</b>: अफगाणिस्तान, बांगलादेश व पाकिस्तानमधून 31 डिसेंबर 2014 पूर्वी भारतात आलेल्या हिंदू, शीख, बौद्ध, जैन, पारशी व ख्रिश्चन स्थलांतरितांना नागरिकत्व मिळण्याची सोय.

## केंद्र–राज्य संबंध
- सातव्या अनुसूचीत तीन सूची आहेत (कलम 246). उरलेले विषय म्हणजे <b>शेषाधिकार</b> (कलम 248) संसदेकडे आहेत.

d:`## प्रस्तावना म्हणजे काय?
प्रस्तावना म्हणजे संविधानाचा परिचय, त्याचा 'आत्मा'. संविधान कोणासाठी आहे आणि त्याचे ध्येय काय आहे, हे ती सांगते. ती नेहरूंच्या <b>उद्दिष्टांच्या ठरावावर</b> आधारित आहे. प्रस्तावनेची कल्पना अमेरिकेकडून घेतली आहे.
## प्रस्तावनेतील शब्द, क्रमाने
<b>"आम्ही भारताचे लोक"</b> म्हणजे सत्तेचा स्रोत जनता आहे. भारत हे <b>सार्वभौम, समाजवादी, धर्मनिरपेक्ष, लोकशाही, गणराज्य</b> आहे.
- <b>न्याय:</b> सामाजिक, आर्थिक व राजकीय (ही कल्पना रशियन क्रांतीतून आली)
- <b>स्वातंत्र्य:</b> विचार, अभिव्यक्ती, विश्वास, श्रद्धा व उपासना यांचे
- <b>समता:</b> दर्जाची व संधीची
- <b>बंधुता:</b> व्यक्तीची प्रतिष्ठा आणि राष्ट्राची एकता व एकात्मता
## 42 वी घटनादुरुस्ती (1976)
प्रस्तावनेत आतापर्यंत फक्त <b>एकदाच</b> बदल झाला आहे. 42 व्या दुरुस्तीने तीन शब्द जोडले: <b>समाजवादी, धर्मनिरपेक्ष आणि एकात्मता</b>. ही दुरुस्ती इंदिरा गांधींच्या काळात झाली आणि तिला 'लघु संविधान' म्हणतात.
## प्रस्तावना संविधानाचा भाग आहे का?
1960 च्या बेरुबारी खटल्यात सर्वोच्च न्यायालयाने 'प्रस्तावना संविधानाचा भाग नाही' असे म्हटले. पण 1973 च्या <b>केशवानंद भारती खटल्यात</b> 'प्रस्तावना संविधानाचा भाग आहे' असा निर्णय दिला. याच खटल्यात 'मूलभूत संरचना' हा सिद्धांत मांडला गेला: संसद संविधानात दुरुस्ती करू शकते, पण त्याची मूलभूत रचना बदलू शकत नाही.`,
sn:["सत्तेचा स्रोत: 'आम्ही भारताचे लोक'","क्रम: सार्वभौम → समाजवादी → धर्मनिरपेक्ष → लोकशाही → गणराज्य","न्याय 3 प्रकारचा: सामाजिक, आर्थिक, राजकीय","समता: दर्जा व संधी","42 वी दुरुस्ती (1976): समाजवादी, धर्मनिरपेक्ष, एकात्मता हे शब्द जोडले","प्रस्तावनेत फक्त एकदाच दुरुस्ती झाली आहे","केशवानंद भारती 1973: प्रस्तावना संविधानाचा भाग; मूलभूत संरचना सिद्धांत"],
tr:["'लोकशाही' 42 व्या दुरुस्तीने जोडला असा चुकीचा पर्याय दिला जातो. फक्त समाजवादी, धर्मनिरपेक्ष आणि एकात्मता हे शब्द जोडले गेले.","'बंधुता' आणि 'एकता' मिसळून पर्याय दिले जातात. 'एकता' मूळचा शब्द आहे, 'एकात्मता' नंतर जोडला."],
q:[]},

{id:"pl3",s:"pol",t:"मूलभूत हक्क (कलम 12–35)",imp:3,
pyq:"'कलम X कशाशी संबंधित?' असे थेट प्रश्न येतात, तसेच रिट (आज्ञापत्रे) आणि आणीबाणीत कोणते हक्क स्थगित होत नाहीत, यावरही.",
d:`## ओळख
मूलभूत हक्क <b>भाग III</b> मध्ये, कलम 12 ते 35 मध्ये आहेत. त्यांना भारताचा '<b>मॅग्ना कार्टा</b>' म्हणतात. ही कल्पना अमेरिकेकडून घेतली आहे. हे हक्क न्यायालयात मागता येतात (न्यायप्रविष्ट आहेत). मूळ संविधानात 7 हक्क होते. 1978 च्या 44 व्या दुरुस्तीने <b>मालमत्तेचा हक्क</b> काढला, म्हणून आता <b>6</b> हक्क आहेत. मालमत्तेचा हक्क आता कलम 300A मध्ये एक साधा कायदेशीर हक्क आहे.
## सहा मूलभूत हक्क
|हक्क|कलमे|मुख्य मुद्दा|
|समानतेचा हक्क|14–18|14: कायद्यापुढे समानता · 15: धर्म, वंश, जात, लिंग, जन्मस्थान यावरून भेदभाव नाही · 16: सरकारी नोकरीत संधीची समानता · 17: अस्पृश्यता नष्ट · 18: पदव्या रद्द|
|स्वातंत्र्याचा हक्क|19–22|19: भाषण, सभा, संघटना, संचार, वास्तव्य, व्यवसाय ही 6 स्वातंत्र्ये · 20: गुन्ह्याबद्दल संरक्षण · 21: जीवन व व्यक्तिगत स्वातंत्र्य · 21A: 6–14 वयोगटाला शिक्षण · 22: अटकेपासून संरक्षण|
|शोषणाविरुद्ध हक्क|23–24|23: मानवी व्यापार व वेठबिगारी बंदी · 24: 14 वर्षांखालील मुलांना कारखान्यात कामाला बंदी|
|धार्मिक स्वातंत्र्य|25–28|कोणताही धर्म पाळणे व त्याचा प्रचार करणे|
|सांस्कृतिक व शैक्षणिक हक्क|29–30|अल्पसंख्याकांची भाषा व संस्कृती जपणे, शिक्षणसंस्था चालवणे|
|घटनात्मक उपायांचा हक्क|32|हक्क मोडले तर थेट सर्वोच्च न्यायालयात जाता येते|
## कलम 32 आणि रिट (आज्ञापत्रे)
आंबेडकरांनी कलम 32 ला संविधानाचे '<b>हृदय व आत्मा</b>' म्हटले. सर्वोच्च न्यायालय कलम 32 नुसार, तर उच्च न्यायालय <b>कलम 226</b> नुसार रिट काढते. उच्च न्यायालयाचा अधिकार अधिक व्यापक आहे, कारण ते इतर कायदेशीर हक्कांसाठीही रिट काढू शकते.
|रिट|अर्थ|
|बंदी प्रत्यक्षीकरण (हेबियस कॉर्पस)|'शरीर हजर करा': बेकायदा अटकेतील व्यक्तीला न्यायालयात हजर करा|
|परमादेश (मँडेमस)|'आम्ही आदेश देतो': अधिकाऱ्याने आपले कर्तव्य करावे|
|प्रतिषेध (प्रोहिबिशन)|कनिष्ठ न्यायालयाला अधिकाराबाहेरचे काम करण्यापासून थांबवणे|
|उत्प्रेषण (सर्शिओररी)|कनिष्ठ न्यायालयातील खटला वरच्या न्यायालयात मागवणे|
|अधिकारपृच्छा (को वॉरंटो)|'कोणत्या अधिकाराने?': पदावरील व्यक्तीचा अधिकार तपासणे|
## आणीबाणी आणि हक्क
राष्ट्रीय आणीबाणीतही <b>कलम 20 व 21</b> कधीच स्थगित करता येत नाहीत (44 वी दुरुस्ती). युद्ध किंवा परकीय आक्रमणामुळे आणीबाणी लागली, तर कलम 19 आपोआप स्थगित होते (कलम 358). अटक झालेल्या व्यक्तीला <b>24 तासांत</b> दंडाधिकाऱ्यासमोर हजर करावे लागते (कलम 22).`,
sn:["भाग III, कलम 12–35, स्रोत अमेरिका, 'मॅग्ना कार्टा'","आता 6 हक्क; मालमत्तेचा हक्क 44 व्या दुरुस्तीने काढला (आता कलम 300A)","14 कायद्यापुढे समानता · 17 अस्पृश्यता नष्ट · 18 पदव्या रद्द","19 सहा स्वातंत्र्ये · 21 जीवनाचा हक्क · 21A शिक्षण (86 वी दुरुस्ती 2002)","23 वेठबिगारी बंदी · 24 बालकामगार बंदी (14 वर्षांखालील)","32 घटनात्मक उपाय = हृदय व आत्मा; उच्च न्यायालय रिट: कलम 226","रिट 5: हेबियस कॉर्पस, मँडेमस, प्रोहिबिशन, सर्शिओररी, को वॉरंटो","आणीबाणीत 20 व 21 स्थगित होत नाहीत · अटकेनंतर 24 तासांत दंडाधिकाऱ्यासमोर"],
tr:["कलम 17 (अस्पृश्यता) आणि कलम 15 (भेदभाव) यांची अदलाबदल केली जाते.","'हेबियस कॉर्पस' आणि 'को वॉरंटो' यांच्या अर्थाची अदलाबदल करून विचारले जाते.","शिक्षणाचा हक्क 21A आहे, 21 नाही. तो 86 व्या दुरुस्तीने आला, 42 व्या नाही."],
q:[]},

{id:"pl4",s:"pol",t:"मार्गदर्शक तत्त्वे व मूलभूत कर्तव्ये",imp:2,
pyq:"'खालीलपैकी कोणते मार्गदर्शक तत्त्व नाही?' किंवा 'मूलभूत कर्तव्ये कोणत्या समितीच्या शिफारशीवरून आली?' असे प्रश्न येतात.",
d:`## मार्गदर्शक तत्त्वे (भाग IV, कलम 36–51)
ही तत्त्वे म्हणजे सरकारसाठी 'कल्याणकारी राज्य' बनवण्याच्या सूचना आहेत. स्रोत आयर्लंड. ती <b>न्यायालयात मागता येत नाहीत</b> (कलम 37), पण देशाच्या कारभारात मूलभूत आहेत.
|कलम|तत्त्व|
|39A|मोफत कायदेशीर मदत (42 वी दुरुस्ती)|
|40|ग्रामपंचायतींची स्थापना|
|41|काम, शिक्षण व सार्वजनिक साहाय्याचा हक्क|
|43|निर्वाह वेतन, कुटीर उद्योग|
|44|समान नागरी कायदा|
|45|6 वर्षांखालील मुलांची काळजी व शिक्षण|
|46|अनुसूचित जाती-जमाती व दुर्बल घटकांचे हित|
|47|पोषण, आरोग्य, मद्यबंदी|
|48|शेती व पशुसंवर्धन, गोहत्या बंदी|
|48A|पर्यावरण व वन्यजीव संरक्षण (42 वी दुरुस्ती)|
|49|राष्ट्रीय स्मारकांचे संरक्षण|
|50|न्यायव्यवस्था कार्यकारी मंडळापासून वेगळी|
|51|आंतरराष्ट्रीय शांतता|
<b>गांधीवादी तत्त्वे:</b> कलम 40 (ग्रामपंचायत), 43 (कुटीर उद्योग), 46 (दुर्बल घटक), 47 (मद्यबंदी), 48 (गोहत्या बंदी).
## मूलभूत कर्तव्ये (भाग IVA, कलम 51A)
<b>स्वर्णसिंग समितीच्या</b> शिफारशीवरून 1976 च्या <b>42 व्या दुरुस्तीने</b> ही कर्तव्ये आली. स्रोत रशिया (USSR). मूळात 10 कर्तव्ये होती. 2002 च्या 86 व्या दुरुस्तीने 11 वे कर्तव्य जोडले: पालकांनी 6–14 वयोगटातील मुलांना शिक्षणाची संधी द्यावी.
उदाहरणे: संविधान, राष्ट्रध्वज व राष्ट्रगीताचा आदर करणे · देशाची एकता जपणे · पर्यावरणाचे रक्षण करणे · वैज्ञानिक दृष्टिकोन बाळगणे · सार्वजनिक मालमत्तेचे रक्षण करणे.`,
sn:["मार्गदर्शक तत्त्वे: भाग IV, कलम 36–51, स्रोत आयर्लंड, न्यायालयात मागता येत नाहीत","40 ग्रामपंचायत · 44 समान नागरी कायदा · 45 बालसंगोपन · 47 मद्यबंदी · 48A पर्यावरण · 50 न्यायव्यवस्था वेगळी","कर्तव्ये: भाग IVA, कलम 51A, स्वर्णसिंग समिती, 42 वी दुरुस्ती 1976","आता 11 कर्तव्ये; 11 वे 86 व्या दुरुस्तीने (2002)","कर्तव्यांचा स्रोत रशिया"],
tr:["कलम 21A (शिक्षणाचा मूलभूत हक्क) आणि कलम 45 (6 वर्षांखालील मुलांचे शिक्षण, मार्गदर्शक तत्त्व) गोंधळवले जातात.","मूलभूत कर्तव्ये मूळ संविधानात होती असा चुकीचा पर्याय दिला जातो; ती 1976 मध्ये आली."],
q:[]},

{id:"pl5",s:"pol",t:"राष्ट्रपती, उपराष्ट्रपती, पंतप्रधान",imp:2,
pyq:"निवडणूक कोण करते, किमान वय, राजीनामा कोणाकडे देतात, आणि महाभियोगाचे कलम यावर प्रश्न येतात.",
d:`## राष्ट्रपती
- कलम 52: भारताला एक राष्ट्रपती असेल. कलम 53: केंद्राची कार्यकारी सत्ता राष्ट्रपतींकडे असते.
- <b>निवड (कलम 54):</b> संसदेच्या दोन्ही सभागृहांचे <b>निर्वाचित</b> सदस्य, आणि राज्यांच्या (तसेच दिल्ली व पुद्दुचेरीच्या) विधानसभांचे <b>निर्वाचित</b> सदस्य मिळून निवड करतात. नामनियुक्त सदस्य आणि विधान परिषदेचे सदस्य मतदान करत नाहीत.
- पद्धत: प्रमाणशीर प्रतिनिधित्व, एकल संक्रमणीय मत (कलम 55).
- पात्रता: भारतीय नागरिक, <b>किमान वय 35</b>. कार्यकाळ 5 वर्षे.
- शपथ <b>सरन्यायाधीश</b> देतात. राजीनामा <b>उपराष्ट्रपतींकडे</b> देतात.
- महाभियोग <b>कलम 61</b> नुसार, 'संविधानाचा भंग' या कारणावर. प्रस्ताव कोणत्याही सभागृहात मांडता येतो, आणि तो एकूण सदस्यसंख्येच्या 2/3 बहुमताने मंजूर व्हावा लागतो.
- अधिकार: कलम 72 नुसार क्षमादान · कलम 123 नुसार अध्यादेश (संसदेचे अधिवेशन नसताना) · आणीबाणी घोषित करणे.
- पहिले राष्ट्रपती <b>डॉ. राजेंद्र प्रसाद</b>. दोनदा निवडून आलेले हेच एकमेव राष्ट्रपती आहेत.
## उपराष्ट्रपती
- कलम 63. उपराष्ट्रपती <b>राज्यसभेचे पदसिद्ध सभापती</b> असतात (कलम 64).
- निवड: संसदेच्या दोन्ही सभागृहांचे <b>सर्व</b> सदस्य करतात, नामनियुक्त सदस्यही. यात विधानसभा मतदान करत नाहीत.
- किमान वय 35. राजीनामा राष्ट्रपतींकडे देतात. पहिले उपराष्ट्रपती डॉ. सर्वपल्ली राधाकृष्णन.
## पंतप्रधान व मंत्रिमंडळ
- कलम 74: राष्ट्रपतींना सल्ला देण्यासाठी पंतप्रधानांच्या नेतृत्वाखाली मंत्रिपरिषद असते.
- कलम 75: पंतप्रधानांची नेमणूक राष्ट्रपती करतात. मंत्रिपरिषद <b>लोकसभेला सामूहिकरीत्या जबाबदार</b> असते.
- 91 व्या दुरुस्तीनुसार (2003) मंत्र्यांची एकूण संख्या लोकसभेच्या सदस्यसंख्येच्या 15% पेक्षा जास्त असू शकत नाही.
- महाधिवक्ता नव्हे, तर <b>महान्यायवादी (ॲटर्नी जनरल, कलम 76)</b> हे केंद्र सरकारचे सर्वोच्च कायदा अधिकारी असतात.`,
sn:["राष्ट्रपती कलम 52; निवड संसद + विधानसभांचे निर्वाचित सदस्य (कलम 54)","किमान वय 35, कार्यकाळ 5 वर्षे; शपथ सरन्यायाधीश देतात; राजीनामा उपराष्ट्रपतींकडे","महाभियोग कलम 61 · क्षमादान 72 · अध्यादेश 123","उपराष्ट्रपती कलम 63; राज्यसभेचे सभापती; निवड संसदेचे सर्व सदस्य","मंत्रिपरिषद लोकसभेला जबाबदार (कलम 75); मंत्र्यांची संख्या लोकसभेच्या 15% पर्यंत (91 वी दुरुस्ती)","ॲटर्नी जनरल कलम 76 · पहिले राष्ट्रपती राजेंद्र प्रसाद · पहिले उपराष्ट्रपती राधाकृष्णन"],
tr:["राष्ट्रपतींच्या निवडणुकीत नामनियुक्त सदस्य मतदान करत नाहीत; उपराष्ट्रपतींच्या निवडणुकीत करतात. हा फरक विचारला जातो.","राष्ट्रपतींचा राजीनामा पंतप्रधानांकडे जातो असा चुकीचा पर्याय दिला जातो; तो उपराष्ट्रपतींकडे जातो."],

{id:"pl6",s:"pol",t:"संसद: लोकसभा व राज्यसभा",imp:2,
pyq:"सदस्यसंख्या, किमान वय, धन विधेयक आणि संयुक्त बैठक यावर प्रश्न येतात.",
d:`## संसदेची रचना
कलम 79 नुसार संसद = <b>राष्ट्रपती + राज्यसभा + लोकसभा</b>. राष्ट्रपती संसदेचा भाग असतात, पण सभागृहात बसत नाहीत.
|मुद्दा|लोकसभा|राज्यसभा|
|स्वरूप|कनिष्ठ सभागृह, जनतेने थेट निवडलेले|वरिष्ठ सभागृह, राज्यांचे प्रतिनिधित्व|
|सदस्य|543 निर्वाचित जागा|कमाल 250 (238 निर्वाचित + 12 नामनियुक्त)|
|किमान वय|25|30|
|कार्यकाळ|5 वर्षे (विसर्जित होऊ शकते)|कायम सभागृह; सदस्य 6 वर्षांसाठी, दर 2 वर्षांनी 1/3 निवृत्त|
|प्रमुख|अध्यक्ष (स्पीकर), सदस्यांतून निवड|सभापती = उपराष्ट्रपती|
महाराष्ट्रातून लोकसभेच्या <b>48</b> (उत्तर प्रदेशानंतर दुसऱ्या क्रमांकाच्या) आणि राज्यसभेच्या <b>19</b> जागा आहेत. राज्यसभा सदस्यांची निवड विधानसभेचे निर्वाचित सदस्य करतात. राष्ट्रपती कला, साहित्य, विज्ञान व समाजसेवा या क्षेत्रांतील 12 जणांना राज्यसभेवर नामनियुक्त करतात.
## धन विधेयक (कलम 110)
एखादे विधेयक धन विधेयक आहे की नाही, हे <b>लोकसभा अध्यक्ष</b> ठरवतात. ते फक्त लोकसभेत, राष्ट्रपतींच्या शिफारशीने मांडता येते. राज्यसभा ते जास्तीत जास्त <b>14 दिवस</b> रोखू शकते, फेटाळू शकत नाही. अर्थसंकल्प कलम 112 नुसार मांडला जातो.
## संयुक्त बैठक (कलम 108)
सामान्य विधेयकावर दोन्ही सभागृहांत मतभेद झाल्यास राष्ट्रपती संयुक्त बैठक बोलावतात. तिचे अध्यक्षस्थान <b>लोकसभा अध्यक्ष</b> भूषवतात. धन विधेयक आणि घटनादुरुस्ती विधेयकासाठी संयुक्त बैठक होत नाही.
## इतर संसदीय संकल्पना
- गणपूर्ती: एकूण सदस्यसंख्येच्या 1/10 · दोन अधिवेशनांमध्ये 6 महिन्यांपेक्षा जास्त अंतर नसावे (कलम 85).
- <b>प्रश्नोत्तराचा तास</b>: बैठकीचा पहिला तास · <b>शून्य प्रहर</b>: प्रश्नोत्तरानंतरचा वेळ; ही भारतीय संसदेची देणगी आहे.
- पक्षांतर बंदी: 10 वी अनुसूची (52 वी दुरुस्ती 1985).
- 106 वी घटनादुरुस्ती (2023): लोकसभा व विधानसभांमध्ये महिलांना 1/3 आरक्षण (नारी शक्ती वंदन अधिनियम).
## परिसीमन (मतदारसंघांची फेररचना)
- लोकसभेच्या जागांचे राज्यांना वाटप कलम 82 नुसार, आणि विधानसभा मतदारसंघ कलम 170 नुसार प्रत्येक जनगणनेनंतर ठरवले जातात. हे काम <b>परिसीमन आयोग</b> करतो; त्याच्या आदेशांना न्यायालयात आव्हान देता येत नाही.
- 42 व्या दुरुस्तीने (1976) जागांची संख्या 1971 च्या जनगणनेवर 2000 सालापर्यंत गोठवली. <b>84 व्या दुरुस्तीने (2001)</b> ही गोठवणूक <b>2026 नंतरच्या पहिल्या जनगणनेपर्यंत</b> वाढवली.
- 87 व्या दुरुस्तीने (2003) मतदारसंघांच्या सीमा <b>2001 च्या जनगणनेवर</b> ठरवण्यास परवानगी दिली (जागांची संख्या न बदलता). शेवटचा परिसीमन आयोग 2002 मध्ये, अध्यक्ष न्या. कुलदीप सिंह.`,
sn:["संसद = राष्ट्रपती + राज्यसभा + लोकसभा (कलम 79)","लोकसभा 543 निर्वाचित, वय 25 · राज्यसभा कमाल 250 (12 नामनियुक्त), वय 30, कायम सभागृह","महाराष्ट्र: लोकसभा 48, राज्यसभा 19","धन विधेयक कलम 110: अध्यक्ष ठरवतात, फक्त लोकसभेत, राज्यसभा 14 दिवस रोखू शकते","संयुक्त बैठक कलम 108, अध्यक्षस्थान लोकसभा अध्यक्ष","शून्य प्रहर ही भारतीय संकल्पना · 106 वी दुरुस्ती: महिलांना 1/3 आरक्षण","परिसीमन: कलम 82 (लोकसभा), 170 (विधानसभा) · जागा 1971 वर गोठवल्या, 84 वी दुरुस्ती: 2026 नंतरच्या जनगणनेपर्यंत · सीमा 2001 जनगणनेवर (87 वी)"],
tr:["संयुक्त बैठकीचे अध्यक्षस्थान उपराष्ट्रपती भूषवतात असा चुकीचा पर्याय दिला जातो; प्रत्यक्षात लोकसभा अध्यक्ष भूषवतात.","राज्यसभा धन विधेयक 14 दिवस रोखू शकते; 30 किंवा 6 महिने असे चुकीचे पर्याय दिले जातात."],
q:[]},

## उच्च न्यायालय व दुय्यम न्यायालये
- प्रत्येक राज्याला उच्च न्यायालय असते (कलम 214). संसद दोन किंवा अधिक राज्यांसाठी एकच उच्च न्यायालय स्थापू शकते (कलम 231). न्यायालयांची रचना व अधिकारक्षेत्र याबाबत कायदा करण्याचा अधिकार प्रामुख्याने <b>संसदेचा</b> आहे.
- उच्च न्यायालयाच्या न्यायाधीशांची नेमणूक <b>राष्ट्रपती</b> करतात (कलम 217). शपथ <b>राज्यपाल</b> देतात. निवृत्ती 62 वर्षे.
- <b>कलम 226</b>: उच्च न्यायालयही रिट जारी करते. हा अधिकार कलम 32 पेक्षा व्यापक आहे, कारण तो मूलभूत हक्कांसोबत इतर कायदेशीर हक्कांसाठीही वापरता येतो. कलम 227: उच्च न्यायालयाचे दुय्यम न्यायालयांवर देखरेखीचे अधिकार.
- केंद्रशासित प्रदेशांवरील अधिकारक्षेत्र: लक्षद्वीप → <b>केरळ</b> उच्च न्यायालय · अंदमान-निकोबार → कोलकाता · पुदुच्चेरी → मद्रास · दादरा-नगर हवेली व दमण-दीव → मुंबई.
- मुंबई उच्च न्यायालयाचे अधिकारक्षेत्र: महाराष्ट्र, गोवा, दादरा-नगर हवेली व दमण-दीव. खंडपीठे: नागपूर, छ. संभाजीनगर (औरंगाबाद), पणजी (गोवा).
- <b>जिल्हा न्यायाधीशांची</b> नेमणूक <b>राज्यपाल</b> उच्च न्यायालयाशी सल्लामसलत करून करतात (कलम 233). दुय्यम न्यायालयांवर <b>उच्च न्यायालयाचे नियंत्रण</b> असते (कलम 235).
- एकच न्यायाधीश दिवाणी खटले चालवताना 'जिल्हा न्यायाधीश' आणि फौजदारी खटले चालवताना 'सत्र न्यायाधीश' असतो.
- <b>लोक अदालत</b>: विधी सेवा प्राधिकरण कायदा 1987; तडजोडीने निकाल; लोक अदालतीच्या निवाड्याविरुद्ध अपील करता येत नाही.
## ग्राम न्यायालय
- <b>ग्राम न्यायालय अधिनियम 2008</b>; अंमल <b>2 ऑक्टोबर 2009</b>. उद्देश: गावपातळीवर स्वस्त व जलद न्याय.
- मध्यवर्ती स्तरावरील पंचायतीसाठी (महाराष्ट्रात पंचायत समिती / तालुका) ग्राम न्यायालय स्थापन होते; राज्य सरकार ते उच्च न्यायालयाशी सल्लामसलत करून स्थापन करते.
- पीठासीन अधिकारी '<b>न्यायाधिकारी</b>': प्रथम वर्ग न्यायदंडाधिकाऱ्याच्या दर्जाचा; राज्य सरकार उच्च न्यायालयाशी सल्लामसलत करून नेमते.
- हे <b>फिरते न्यायालय</b> असू शकते. ते <b>दिवाणी व फौजदारी</b> दोन्ही प्रकारचे खटले चालवते.`,
sn:["सर्वोच्च न्यायालय: कलम 124, निवृत्ती 65 · उच्च न्यायालय: कलम 214, निवृत्ती 62","मुंबई उच्च न्यायालय 1862; खंडपीठे नागपूर, छ. संभाजीनगर, पणजी + कोल्हापूर (सर्किट, 18 ऑगस्ट 2025)","निवडणूक आयोग 324 · लोकसेवा आयोग 315 · CAG 148 · वित्त आयोग 280 · ॲटर्नी जनरल 76 · महाधिवक्ता 165","MPSC स्थापना 1 मे 1960","आणीबाणी: 352 राष्ट्रीय · 356 राष्ट्रपती राजवट · 360 आर्थिक (कधीच लागू नाही)","दुरुस्त्या: 61 वी मतदान वय 18 · 101 वी GST · 103 वी EWS 10% · 106 वी महिला आरक्षण","उच्च न्यायालय: न्यायाधीश नेमणूक राष्ट्रपती (217), रिट 226 (32 पेक्षा व्यापक) · जिल्हा न्यायाधीश: राज्यपाल (233), नियंत्रण उच्च न्यायालय (235)","लक्षद्वीप → केरळ HC · अंदमान → कोलकाता · पुदुच्चेरी → मद्रास","ग्राम न्यायालय कायदा 2008, अंमल 2 ऑक्टो 2009; न्यायाधिकारी; फिरते; दिवाणी + फौजदारी"],

{id:"pl8",s:"pol",t:"राज्य शासन व महाराष्ट्र विधिमंडळ",imp:2,
pyq:"राज्यपालांची नेमणूक व अधिकार, विधानसभा व विधान परिषदेची सदस्यसंख्या, आणि द्विगृही राज्ये यावर प्रश्न येतात.",
d:`## राज्यपाल
- कलम 153: प्रत्येक राज्याला राज्यपाल असतो. कलम 155: नेमणूक <b>राष्ट्रपती</b> करतात.
- कार्यकाळ 5 वर्षे, पण ते राष्ट्रपतींच्या मर्जीपर्यंत पदावर राहतात. किमान वय 35.
- कलम 163: मंत्रिपरिषद राज्यपालांना सल्ला देते · कलम 164: राज्यपाल मुख्यमंत्र्यांची नेमणूक करतात · कलम 213: राज्यपाल अध्यादेश काढतात · कलम 200: विधेयकाला संमती देतात किंवा ते राष्ट्रपतींसाठी राखून ठेवतात.
- महाराष्ट्राचे पहिले राज्यपाल श्री प्रकाश होते.
## महाराष्ट्र विधिमंडळ
महाराष्ट्र विधिमंडळ <b>द्विगृही</b> आहे.
|मुद्दा|विधानसभा|विधान परिषद|
|सदस्य|288|78|
|किमान वय|25|30|
|स्वरूप|5 वर्षांसाठी, विसर्जित होऊ शकते|कायम सभागृह, 1/3 सदस्य दर 2 वर्षांनी निवृत्त|
|प्रमुख|अध्यक्ष|सभापती|
भारतात फक्त 6 राज्यांमध्ये विधान परिषद आहे: महाराष्ट्र, कर्नाटक, उत्तर प्रदेश, बिहार, आंध्र प्रदेश, तेलंगणा.
महाराष्ट्राची राजधानी मुंबई आहे. उपराजधानी नागपूर आहे, आणि 1953 च्या <b>नागपूर करारामुळे</b> हिवाळी अधिवेशन नागपूरला होते.
## लोकायुक्त
भ्रष्टाचाराच्या तक्रारींसाठी लोकायुक्त हे पद असते. <b>महाराष्ट्र</b> हे 1971 च्या कायद्याने लोकायुक्त नेमणारे देशातील पहिले राज्य आहे.
## राज्यपाल: कलमे व अधिकार
|कलम|तरतूद|
|154|राज्याची <b>कार्यकारी सत्ता</b> राज्यपालांकडे|
|156|राष्ट्रपतींच्या मर्जीपर्यंत पद; कार्यकाळ 5 वर्षे|
|157|पात्रता: भारताचा नागरिक, वय 35|
|159|शपथ: संबंधित राज्याच्या <b>उच्च न्यायालयाचे मुख्य न्यायाधीश</b> देतात|
|161|क्षमादानाचा अधिकार (राज्याच्या कायद्यांविरुद्धच्या गुन्ह्यांसाठी; मृत्युदंड माफ करता येत नाही)|
|163|मुख्यमंत्री प्रमुख असलेली मंत्रिपरिषद राज्यपालांना सहाय्य व सल्ला देईल|
|164|राज्यपाल मुख्यमंत्री व (मुख्यमंत्र्यांच्या सल्ल्याने) मंत्री नेमतात|
|165|<b>महाधिवक्ता</b> (Advocate General)|
|200|विधेयकाला संमती देणे, रोखणे, परत पाठवणे किंवा <b>राष्ट्रपतींच्या विचारार्थ राखून ठेवणे</b>|
|213|अधिवेशन चालू नसताना <b>अध्यादेश</b>|
- राज्यपाल हे <b>राज्य विधिमंडळाचा अविभाज्य भाग</b> आहेत (कलम 168). विधिविषयक अधिकार: विधिमंडळाला संबोधित करणे, अधिवेशन बोलावणे व स्थगित करणे, विधानसभा विसर्जित करणे, विधान परिषदेवर 1/6 सदस्य नेमणे, अध्यादेश काढणे.
- <b>महाधिवक्ता</b>: राज्यपाल नेमतात; उच्च न्यायालयाचा न्यायाधीश होण्याइतकी पात्रता लागते; राज्यपालांच्या मर्जीपर्यंत पदावर. त्यांना विधिमंडळात बोलण्याचा व कामकाजात भाग घेण्याचा अधिकार आहे, पण <b>मतदानाचा अधिकार नाही</b> (कलम 177).
## राज्य विधिमंडळ: नियम
- विधिमंडळ दोन सभागृहांचे असल्यास वरिष्ठ सभागृह <b>विधान परिषद</b> आणि कनिष्ठ सभागृह <b>विधानसभा</b>.
- विधानसभेची सदस्यसंख्या कमाल 500 व किमान 60 (कलम 170). अपवाद: <b>सिक्कीम (32)</b> सर्वात लहान विधानसभा; गोवा व मिझोराम 40.
- <b>विधान परिषद निर्माण किंवा रद्द करणे</b> (कलम 169): संबंधित विधानसभेने विशेष बहुमताने ठराव करायचा, मग <b>संसद साध्या कायद्याने</b> निर्णय घेते.
- विधान परिषदेची सदस्यसंख्या विधानसभेच्या 1/3 पेक्षा जास्त नाही आणि किमान 40 (कलम 171). रचना: 1/3 स्थानिक संस्थांकडून, 1/12 पदवीधर, 1/12 शिक्षक, 1/3 विधानसभा सदस्यांकडून, आणि 1/6 राज्यपाल नामनियुक्त करतात.
- विधान परिषद साधे विधेयक जास्तीत जास्त <b>4 महिने</b> (पहिल्यांदा 3 महिने, पुन्हा आल्यास 1 महिना) रोखू शकते; धन विधेयक फक्त <b>14 दिवस</b>. शेवटी विधानसभेचेच मत अंतिम ठरते.
- साधे विधेयक मंत्री किंवा खाजगी सदस्य कोणत्याही सभागृहात मांडू शकतात; धन विधेयक फक्त विधानसभेत आणि राज्यपालांच्या पूर्वशिफारशीने.`,
sn:["राज्यपाल: कलम 153; नेमणूक राष्ट्रपती (155); वय 35; अध्यादेश 213","मुख्यमंत्री कलम 164 · महाधिवक्ता कलम 165","विधानसभा 288 (वय 25) · विधान परिषद 78 (वय 30, कायम)","विधान परिषद असलेली राज्ये 6: महाराष्ट्र, कर्नाटक, उत्तर प्रदेश, बिहार, आंध्र प्रदेश, तेलंगणा","नागपूर करार 1953 → हिवाळी अधिवेशन नागपूरला","लोकायुक्त नेमणारे पहिले राज्य: महाराष्ट्र (1971)","कलम 154 कार्यकारी सत्ता राज्यपाल · 159 शपथ: उच्च न्यायालयाचे मुख्य न्यायाधीश · 163 मंत्रिपरिषद सल्ला · 165 महाधिवक्ता","विधान परिषद: कलम 169 (संसद साध्या कायद्याने), 171 (≤1/3, किमान 40); साधे विधेयक कमाल 4 महिने, धन विधेयक 14 दिवस","सर्वात लहान विधानसभा सिक्कीम (32)"],
tr:["राज्यपालांची नेमणूक मुख्यमंत्री किंवा विधानसभा करते असे चुकीचे पर्याय दिले जातात; नेमणूक राष्ट्रपती करतात.","विधान परिषदेचे सदस्य 78 आहेत; 288 हा आकडा विधानसभेचा आहे.","कलम 163 मुख्यमंत्र्यांच्या शपथविधीशी संबंधित असे चुकीचे विधान येते; कलम 163 मंत्रिपरिषदेच्या सल्ल्याबाबत आहे.","विधान परिषद साधे विधेयक 6 महिने रोखू शकते असा चुकीचा पर्याय येतो; कमाल 4 महिने."],
q:[]},

d:`## पंचायत राजचा प्रवास (कालक्रम)

## 73 व्या घटनादुरुस्तीची वैशिष्ट्ये
- संविधानात <b>भाग IX</b>, कलम 243 ते 243-O, आणि <b>11 वी अनुसूची (29 विषय)</b> जोडली.
- <b>ग्रामसभा</b> (कलम 243A) हा पंचायत राजचा पाया आहे. त्यात गावातील मतदार यादीतील सर्व प्रौढ व्यक्ती असतात.
- 20 लाखांपेक्षा जास्त लोकसंख्येच्या राज्यांत त्रिस्तरीय रचना: ग्राम → तालुका (मध्यवर्ती) → जिल्हा.
- सर्व स्तरांवर सदस्यांची थेट निवडणूक होते.
- अनुसूचित जाती-जमातींना लोकसंख्येच्या प्रमाणात आरक्षण. महिलांना किमान 1/3 आरक्षण (महाराष्ट्रात <b>50%</b>).
- कार्यकाळ <b>5 वर्षे</b>. पंचायत विसर्जित झाल्यास <b>6 महिन्यांत</b> निवडणूक घ्यावी लागते.
- निवडणुकीसाठी <b>राज्य निवडणूक आयोग</b> (243K) आहे. महाराष्ट्र राज्य निवडणूक आयोग 1994 मध्ये स्थापन झाला.
- निधीवाटपासाठी दर 5 वर्षांनी <b>राज्य वित्त आयोग</b> (243-I) नेमला जातो.
- निवडणूक लढवण्यासाठी किमान वय 21.
- नागालँड, मेघालय, मिझोराम आणि काही अनुसूचित क्षेत्रांना ही दुरुस्ती लागू नाही. अनुसूचित क्षेत्रांसाठी 1996 चा <b>पेसा कायदा</b> आहे.

|1961|महाराष्ट्र जिल्हा परिषद व पंचायत समिती अधिनियम|
|1 मे 1962|महाराष्ट्रात जिल्हा परिषदा कार्यरत झाल्या|

{id:"pl10",s:"pol",t:"ग्रामपंचायत, ग्रामसभा व पंचायत समिती",imp:3,
pyq:"सचिव कोण, प्रमुख कोण, आणि सदस्यसंख्या कशावर ठरते यावर प्रश्न येतात. तलाठी व ग्रामसेवक यांच्या कामांचा फरकही विचारला जातो.",
d:`## ग्रामपंचायत (पाया)
- महाराष्ट्रात ग्रामपंचायती <b>मुंबई ग्रामपंचायत अधिनियम 1958</b> नुसार चालतात.
- सदस्यसंख्या गावाच्या लोकसंख्येनुसार <b>7 ते 17</b> असते.
- प्रमुख <b>सरपंच</b>. महाराष्ट्रात सरपंचाची निवड थेट जनतेतून होते. उपसरपंचाची निवड सदस्य करतात.
- सचिव <b>ग्रामसेवक</b> असतो. त्याची नेमणूक जिल्हा परिषद करते. तो पंचायतीचे दप्तर, जन्म-मृत्यू नोंदी आणि ठराव सांभाळतो.
- उत्पन्नाचे स्रोत: घरपट्टी, पाणीपट्टी, बाजार कर, आणि वित्त आयोगाचे अनुदान.
- कार्यकाळ 5 वर्षे.
## ग्रामसभा
ग्रामसभा म्हणजे गावाच्या मतदार यादीतील <b>सर्व प्रौढ व्यक्ती</b>. ग्रामपंचायत ही ग्रामसभेला जबाबदार असते. विकासकामे, लाभार्थ्यांची निवड आणि हिशेब तपासणी ग्रामसभेत होते. ग्रामसभेला '<b>गावाची संसद</b>' म्हणतात.
## पंचायत समिती (तालुका / गट स्तर)
- पंचायत राजचा मधला स्तर. विकास गटाच्या (तालुक्याच्या) पातळीवर असते.
- सदस्य थेट निवडले जातात. प्रमुख <b>सभापती</b>, सोबत उपसभापती.
- सचिव व प्रशासकीय प्रमुख <b>गटविकास अधिकारी (BDO)</b>.
- काम: प्राथमिक शिक्षण, शेती विस्तार, पशुवैद्यकीय सेवा, ग्रामपंचायतींवर देखरेख.
## गावातील महत्त्वाचे कर्मचारी
|पद|कोणत्या खात्याचे|काम|
|ग्रामसेवक / ग्रामविकास अधिकारी|जिल्हा परिषद|ग्रामपंचायतीचा सचिव|
|तलाठी (ग्राम महसूल अधिकारी)|महसूल विभाग|7/12 उतारा, जमीन नोंदी, शेतसारा|
|पोलीस पाटील|गृह / महसूल|गावातील कायदा-सुव्यवस्थेची माहिती पोलिसांना देणे|
|कोतवाल|महसूल|तलाठ्याचा सहाय्यक|`,
sn:["ग्रामपंचायत: मुंबई ग्रामपंचायत अधिनियम 1958; सदस्य 7–17","सरपंच थेट जनतेतून निवडला जातो (महाराष्ट्र) · उपसरपंच सदस्यांतून","सचिव ग्रामसेवक (नेमणूक जिल्हा परिषद)","ग्रामसभा = सर्व प्रौढ मतदार = गावाची संसद","पंचायत समिती: सभापती; सचिव गटविकास अधिकारी (BDO)","तलाठी: महसूल, 7/12 उतारा · पोलीस पाटील: कायदा-सुव्यवस्था"],
tr:["ग्रामपंचायतीचा सचिव तलाठी असतो असा चुकीचा पर्याय दिला जातो; सचिव ग्रामसेवक असतो.","पंचायत समितीचा सचिव तहसीलदार असतो असा चुकीचा पर्याय दिला जातो; सचिव BDO असतो. तहसीलदार महसूल विभागाचा असतो."],
q:[]},

d:`## जिल्हा परिषद (सर्वात वरचा स्तर)

- सचिव व प्रशासकीय प्रमुख <b>मुख्य कार्यकारी अधिकारी (CEO)</b>, जो <b>IAS</b> अधिकारी असतो.
- काम: जिल्ह्यातील प्राथमिक शिक्षण, आरोग्य केंद्रे, ग्रामीण रस्ते, पाणीपुरवठा, कृषी विकास.

## नागरी स्थानिक संस्था (74 वी दुरुस्ती)

- <b>निरुद्योगीकरण</b>: इंग्लंडच्या यंत्रावर बनलेल्या स्वस्त मालामुळे भारतातील हस्तोद्योग (विशेषतः हातमाग कापड) कोसळले. कारागीर बेकार होऊन शेतीकडे वळले आणि शेतीवरचा भार वाढला.

- कारणे: अमेरिकन यादवी युद्धानंतर (1861–65) कापसाचे भाव कोसळले, जमीन महसूल वाढला, आणि सावकारी कर्जाचा बोजा.
- मुंबई सरकारने चौकशीसाठी '<b>दख्खन दंगल आयोग</b>' नेमला. त्यानंतर <b>दख्खन कृषक सहाय्य कायदा 1879</b> झाला.
- दुष्काळ आयोग: 1880 (रिचर्ड स्ट्रॅची), 1898 (लायल), 1901 (मॅकडोनेल).`,

## 1857 चा उठाव
- 29 मार्च 1857: <b>मंगल पांडे</b> यांनी बराकपूर (बंगाल) येथे इंग्रज अधिकाऱ्यावर गोळी झाडली.
- 10 मे 1857: <b>मीरत</b> येथील सैनिकांनी उठाव केला आणि दिल्लीकडे कूच केले. त्यांनी बहादूरशहा जफरला सम्राट घोषित केले.
- तात्कालिक कारण: एन्फिल्ड रायफलची डुकराची व गायीची चरबी लावलेली काडतुसे.
- खोलवरची कारणे: खालसा धोरण, शेतकऱ्यांवरील कर, सैनिकांशी भेदभाव.
|ठिकाण|नेता|
|दिल्ली|बहादूरशहा जफर (बख्त खान सेनापती)|
|कानपूर|नानासाहेब पेशवे, तात्या टोपे|
|झाशी|राणी लक्ष्मीबाई|
|लखनौ (अवध)|बेगम हजरत महल|
|बिहार (जगदीशपूर)|कुंवरसिंह|
|सातारा|रंगो बापूजी|
- तात्या टोपे मूळचे <b>येवला (नाशिक)</b> येथील होते.
- सावरकरांनी या उठावाला '<b>भारतीय स्वातंत्र्याचे पहिले युद्ध</b>' म्हटले.
- परिणाम: 1858 च्या कायद्याने कंपनी राजवट संपली आणि राणी व्हिक्टोरियाचा जाहीरनामा आला. लष्करात भारतीयांचे प्रमाण कमी केले गेले.
## 1857 नंतरचे बदल
- <b>भारत सरकार कायदा 1858</b>: कंपनीची राजवट संपली; कारभार थेट ब्रिटिश राजसत्तेकडे.
- इंग्लंडमध्ये '<b>भारतमंत्री</b>' (Secretary of State for India) हे नवे पद, त्याच्या मदतीला 15 सदस्यांचे इंडिया कौन्सिल.
- गव्हर्नर जनरलला '<b>व्हाईसरॉय</b>' ही पदवी; पहिले व्हाईसरॉय लॉर्ड कॅनिंग.
- राणी व्हिक्टोरियाचा जाहीरनामा (1 नोव्हेंबर 1858, अलाहाबाद दरबार): संस्थाने खालसा करण्याचे धोरण सोडले, धार्मिक बाबतीत हस्तक्षेप न करण्याचे आश्वासन.
- 1857 च्या उठावाची <b>राजकीय कारणे</b>: डलहौसीचे खालसा धोरण (दत्तक वारस नामंजूर), वेलस्लीची तैनाती फौज, संस्थाने विलीन करणे.`,

d:`## जीवन
जन्म 14 एप्रिल 1891, महू (मध्य प्रदेश). कोलंबिया विद्यापीठ आणि लंडन स्कूल ऑफ इकॉनॉमिक्समधून उच्च शिक्षण घेतले. ते संविधानाच्या मसुदा समितीचे अध्यक्ष आणि स्वतंत्र भारताचे पहिले कायदामंत्री होते. हिंदू कोड बिलाच्या मुद्द्यावर 1951 मध्ये राजीनामा दिला. 6 डिसेंबर 1956 रोजी दिल्लीत महापरिनिर्वाण झाले (मुंबईतील <b>चैत्यभूमी</b>). 1990 मध्ये मरणोत्तर <b>भारतरत्न</b> मिळाले.

- 1930: <b>काळाराम मंदिर सत्याग्रह</b>, नाशिक: मंदिरप्रवेशाचा हक्क.
- 1930–32: तीनही गोलमेज परिषदांना उपस्थित.
- 1932: ब्रिटिशांनी जातीय निवाडा जाहीर करून अस्पृश्यांना स्वतंत्र मतदारसंघ दिले. गांधीजींनी याविरुद्ध येरवडा तुरुंगात उपोषण केले. 24 सप्टेंबर 1932 ला <b>पुणे करार</b> झाला: स्वतंत्र मतदारसंघाऐवजी राखीव जागा.
- 14 ऑक्टोबर 1956: नागपूर (<b>दीक्षाभूमी</b>) येथे लाखो अनुयायांसह बौद्ध धम्माची दीक्षा.

d:`## राजर्षी शाहू महाराज (1874–1922)
- 1894 पासून कोल्हापूर संस्थानाचे राजे. जन्मदिवस 26 जून हा महाराष्ट्रात <b>सामाजिक न्याय दिन</b> म्हणून पाळला जातो.
- 26 जुलै 1902: मागासवर्गीयांना सरकारी नोकऱ्यांत <b>50% आरक्षण</b>.
- वेदोक्त प्रकरणानंतर त्यांनी ब्राह्मणेतर चळवळीला पाठिंबा दिला; सत्यशोधक विचारांचे पुरस्कर्ते होते.
- 1917: प्राथमिक शिक्षण <b>मोफत व सक्तीचे</b> केले.
- विविध जातींसाठी वसतिगृहे सुरू केली; आंबेडकरांच्या 'मूकनायक'ला मदत केली.
- 1919 मध्ये कानपूरच्या कुर्मी क्षत्रिय सभेने त्यांना '<b>राजर्षी</b>' ही पदवी दिली.

## काँग्रेसची स्थापना
28 डिसेंबर 1885 रोजी <b>मुंबई</b>त, गोकुळदास तेजपाल संस्कृत महाविद्यालयात काँग्रेसची स्थापना झाली. संस्थापक <b>ए. ओ. ह्यूम</b> (निवृत्त इंग्रज अधिकारी). पहिले अध्यक्ष <b>व्योमेशचंद्र बॅनर्जी</b>. 72 प्रतिनिधी उपस्थित होते. मूळ अधिवेशन पुण्यात ठरले होते, पण तिथे कॉलराची साथ आल्याने ते मुंबईला हलवले.
## मवाळ कालखंड (1885–1905)
नेते: दादाभाई नौरोजी, गोखले, फिरोजशहा मेहता, न्या. रानडे, सुरेंद्रनाथ बॅनर्जी. मार्ग: अर्ज, विनंती, ठराव.
<b>दादाभाई नौरोजी</b>: 'ग्रँड ओल्ड मॅन ऑफ इंडिया'; '<b>संपत्तीचे निःसारण</b>' (ड्रेन थिअरी) मांडली; ग्रंथ 'पॉव्हर्टी अँड अन-ब्रिटिश रूल इन इंडिया'; ब्रिटिश संसदेत निवडून गेलेले पहिले भारतीय.
## जहाल कालखंड (1905–1918)
नेते: <b>लाल-बाल-पाल</b> (लाला लजपतराय, बाळ गंगाधर टिळक, बिपिनचंद्र पाल), अरविंद घोष. मार्ग: स्वदेशी, बहिष्कार, राष्ट्रीय शिक्षण.

- चंद्रशेखर आझाद: हिंदुस्थान सोशलिस्ट रिपब्लिकन असोसिएशन (HSRA).
## सुभाषचंद्र बोस
1939 मध्ये फॉरवर्ड ब्लॉक स्थापन केला. 1943 मध्ये सिंगापूरमध्ये <b>आझाद हिंद सेने</b>चे नेतृत्व घेतले. घोषणा: 'दिल्ली चलो', 'तुम मुझे खून दो, मैं तुम्हे आझादी दूँगा'. आझाद हिंद सेनेची मूळ स्थापना रासबिहारी बोस आणि मोहनसिंग यांनी केली होती.
## जॅक्सन वध व गदर
- नाशिकचे कलेक्टर <b>जॅक्सन</b> यांचा वध <b>अनंत लक्ष्मण कान्हेरे</b> यांनी 21 डिसेंबर 1909 रोजी केला. या खटल्यात कान्हेरे, <b>कृष्णाजी गोपाळ कर्वे</b> व <b>विनायक नारायण देशपांडे</b> यांना 1910 मध्ये फाशी झाली.
- <b>विष्णू गणेश पिंगळे</b> (तळेगाव ढमढेरे, पुणे): गदर पक्षाचे कार्यकर्ते; पुणे भागात सशस्त्र क्रांतीचा प्रचार केला; लाहोर कट खटल्यात 1915 मध्ये फाशी.`,
sn:["चापेकर बंधू: रँड वध, 22 जून 1897, पुणे","सावरकर: मित्रमेळा 1899 → अभिनव भारत 1904, नाशिक","अनंत कान्हेरे: जॅक्सन वध 1909, नाशिक","राजगुरू (खेड, पुणे) + भगतसिंग + सुखदेव: फाशी 23 मार्च 1931 (शहीद दिन)","गदर पक्ष 1913: लाला हरदयाळ · काकोरी 1925","सुभाषचंद्र बोस: फॉरवर्ड ब्लॉक 1939, आझाद हिंद सेना 1943","जॅक्सन वध 1909: अनंत कान्हेरे; फाशी कान्हेरे, कृ. गो. कर्वे, वि. ना. देशपांडे · गदर: विष्णू गणेश पिंगळे"],
tr:["रँडचा वध चापेकरांनी आणि जॅक्सनचा वध कान्हेऱ्यांनी केला. या दोन जोड्यांची अदलाबदल केली जाते."],
q:[]},

{id:"hi11",s:"his",t:"1942 चे लढे, हैदराबाद मुक्ती, संयुक्त महाराष्ट्र",imp:3,
pyq:"महाराष्ट्राच्या निर्मितीचा प्रवास, हुतात्मा चौक, समितीचे नेते आणि मराठवाडा मुक्ती यावर दरवर्षी प्रश्न असतो.",
d:`## 1942 चे लढे (महाराष्ट्र)
- <b>सातारा प्रतिसरकार</b>: क्रांतिसिंह <b>नाना पाटील</b> यांनी ब्रिटिश राजवटीला समांतर सरकार चालवले (सोबत नागनाथ नायकवडी, जी. डी. लाड).
- <b>चिमूर</b> (चंद्रपूर) आणि <b>आष्टी</b> (वर्धा): 16 ऑगस्ट 1942 रोजी उठाव. चिमूर उठावाला तुकडोजी महाराजांच्या आवाहनाने प्रेरणा मिळाली.
- <b>नंदुरबार</b>: 9 सप्टेंबर 1942 रोजी तिरंगा हातात घेऊन मिरवणुकीचे नेतृत्व करणारा 15 वर्षांचा <b>शिरीषकुमार</b> पोलीस गोळीबारात शहीद झाला.
- यावली, महाड, गारगोटी येथेही लढे झाले.
## हैदराबाद मुक्ती संग्राम
मराठवाडा हा निजामाच्या हैदराबाद संस्थानाचा भाग होता. निजामाने भारतात सामील होण्यास नकार दिला. स्वामी <b>रामानंद तीर्थ</b> यांच्या नेतृत्वाखाली लढा झाला; गोविंदभाई श्रॉफ हेही नेते होते. 13 ते 17 सप्टेंबर 1948 या काळात <b>ऑपरेशन पोलो</b> ही पोलीस कारवाई झाली. <b>17 सप्टेंबर 1948</b> रोजी मराठवाडा मुक्त झाला; हा दिवस <b>मराठवाडा मुक्ती संग्राम दिन</b> आहे.
## संयुक्त महाराष्ट्र चळवळ
|वर्ष|घटना|
|1953|<b>नागपूर करार</b>: विदर्भ महाराष्ट्रात सामील होण्याच्या अटी (हिवाळी अधिवेशन नागपूरला)|
|1953–55|<b>राज्य पुनर्रचना आयोग</b> (अध्यक्ष फजल अली; सदस्य के. एम. पणिक्कर, एच. एन. कुंझरू)|
|<b>21 नोव्हेंबर 1955</b>|फ्लोरा फाउंटन येथे पोलीस गोळीबारात 15 जण हुतात्मा; ही जागा आता <b>हुतात्मा चौक</b>. तेव्हा मुंबई राज्याचे मुख्यमंत्री मोरारजी देसाई होते|
|जानेवारी 1956|पुन्हा मोठा गोळीबार|
|1956|<b>संयुक्त महाराष्ट्र समिती</b>ची स्थापना · द्विभाषिक मुंबई राज्य (मुख्यमंत्री यशवंतराव चव्हाण)|
|1 मे 1960|मुंबई पुनर्रचना कायदा 1960 → <b>महाराष्ट्र व गुजरात</b> ही दोन राज्ये|
संपूर्ण चळवळीत एकूण <b>106 हुतात्मे</b> झाले.
समितीचे नेते: एस. एम. जोशी, श्रीपाद अमृत डांगे, आचार्य अत्रे ('मराठा' वृत्तपत्रातून प्रचार), प्रबोधनकार ठाकरे, सेनापती बापट, नाना पाटील, उद्धवराव पाटील. लोकशाहीर <b>अण्णाभाऊ साठे</b>, शाहीर <b>अमर शेख</b> आणि शाहीर द. ना. गव्हाणकर यांनी पोवाड्यांतून चळवळ गावोगावी पोहोचवली.
महाराष्ट्राचे पहिले मुख्यमंत्री <b>यशवंतराव चव्हाण</b>. बेळगाव-कारवार सीमाप्रश्न अजूनही प्रलंबित आहे (1966 चा महाजन आयोग).`,
sn:["सातारा प्रतिसरकार: नाना पाटील","चिमूर व आष्टी: 16 ऑगस्ट 1942 · नंदुरबार: शिरीषकुमार, 9 सप्टेंबर 1942","हैदराबाद मुक्ती: ऑपरेशन पोलो, 17 सप्टेंबर 1948; नेते स्वामी रामानंद तीर्थ","नागपूर करार 1953 · राज्य पुनर्रचना आयोग: फजल अली","हुतात्मा चौक गोळीबार: 21 नोव्हेंबर 1955 (15 हुतात्मे); एकूण 106 हुतात्मे","1 मे 1960 महाराष्ट्र राज्य; पहिले मुख्यमंत्री यशवंतराव चव्हाण","नेते: एस. एम. जोशी, डांगे, अत्रे, प्रबोधनकार, बापट; शाहीर अण्णाभाऊ साठे, अमर शेख"],
tr:["हुतात्मा चौक गोळीबाराचे वर्ष 1955 आहे; 1956 किंवा 1960 असे चुकीचे पर्याय दिले जातात.","राज्य पुनर्रचना आयोगाचे अध्यक्ष फजल अली होते; पणिक्कर व कुंझरू सदस्य होते. ही अदलाबदल केली जाते."],
q:[]}
);

L.push(
{id:"ge1",s:"geo",t:"पृथ्वी, सूर्यमाला, अक्षांश-रेखांश",imp:2,
pyq:"प्रमाणवेळ, दिवस-रात्र, विषुवदिन व संक्रांती, वातावरणाचे थर आणि खडकांचे प्रकार यावर मूलभूत प्रश्न येतात.",
d:`## सूर्यमाला
सूर्यमालेत 8 ग्रह आहेत: बुध, शुक्र, पृथ्वी, मंगळ, गुरू, शनी, युरेनस, नेपच्यून. सर्वात मोठा ग्रह <b>गुरू</b>, सर्वात लहान <b>बुध</b>. सर्वात उष्ण ग्रह <b>शुक्र</b> (जाड वातावरणामुळे). <b>मंगळ</b>ाला लाल ग्रह म्हणतात, आणि पृथ्वीला 'निळा ग्रह'. शुक्राला पहाटेचा किंवा सायंकाळचा तारा म्हणतात. चंद्र हा पृथ्वीचा नैसर्गिक उपग्रह आहे.
## पृथ्वीच्या गती
- <b>परिवलन</b>: पृथ्वी स्वतःभोवती पश्चिमेकडून पूर्वेकडे सुमारे 24 तासांत फिरते. यामुळे दिवस-रात्र होतात.
- <b>परिभ्रमण</b>: पृथ्वी सूर्याभोवती 365¼ दिवसांत फिरते. यामुळे ऋतू होतात. दर 4 वर्षांनी लीप वर्ष येते.
- 21 मार्च व 23 सप्टेंबर: <b>विषुवदिन</b>; दिवस व रात्र समान.
- 21 जून: उत्तर गोलार्धात सर्वात मोठा दिवस. 22 डिसेंबर: सर्वात लहान दिवस.
## अक्षांश व रेखांश
- <b>विषुववृत्त</b> 0° · कर्कवृत्त 23½° उत्तर · मकरवृत्त 23½° दक्षिण · आर्क्टिक वृत्त 66½° उत्तर.
- मूळ रेखावृत्त 0° इंग्लंडच्या <b>ग्रीनिच</b>मधून जाते. एकूण 360 रेखावृत्ते.
- पृथ्वी 1° फिरायला <b>4 मिनिटे</b> लागतात. 15° म्हणजे 1 तासाचा फरक.
- <b>भारतीय प्रमाणवेळ</b> 82°30′ पूर्व रेखावृत्तावरून ठरते (मिर्झापूर/प्रयागराजजवळून). ती ग्रीनिचपेक्षा <b>5 तास 30 मिनिटे पुढे</b> आहे. (82.5 × 4 = 330 मिनिटे)
- आंतरराष्ट्रीय वाररेषा 180° रेखावृत्तावर आहे.
## वातावरणाचे थर
|थर|वैशिष्ट्य|
|तपांबर (ट्रोपोस्फियर)|सर्वात खालचा थर; ढग, पाऊस, सर्व हवामान येथेच|
|स्थितांबर (स्ट्रॅटोस्फियर)|<b>ओझोनचा थर</b> (अतिनील किरणे रोखतो); विमाने येथे उडतात|
|मध्यांबर|उल्का येथे जळतात|
|आयनांबर (थर्मोस्फियर)|रेडिओ लहरी परावर्तित करतो|
|बाह्यांबर|सर्वात बाहेरचा थर|
## खडकांचे प्रकार
<b>अग्निजन्य</b> (लाव्हारसापासून; उदा. बेसॉल्ट, ग्रॅनाइट). महाराष्ट्रातील दख्खनचे पठार <b>बेसॉल्ट</b>चे आहे. <b>गाळाचे</b> खडक (थरांचे; उदा. वालुकाश्म, चुनखडी). <b>रूपांतरित</b> खडक (उष्णता व दाबाने बदललेले; चुनखडीपासून संगमरवर, शेलपासून स्लेट).
## भूरूपे (कोणत्या कारकामुळे?)
|कारक|झीज (खनन) कार्यामुळे|संचयन (साठवण) कार्यामुळे|
|नदी|V आकाराची दरी, घळई (gorge), धबधबा, रांजणखळगे (उदा. निघोज, कुकडी नदी)|पूरमैदान, नैसर्गिक तटबंध, कुंडलाकार (ऑक्सबो) सरोवर, त्रिभुज प्रदेश|
|हिमनदी|U आकाराची दरी, सर्क, हॉर्न|हिमोढ (मोरेन), <b>ड्रमलिन</b>, एस्कर|
|वारा|भूछत्र खडक (mushroom rock), यारदांग|वाळूच्या टेकड्या (बारखान), लोएस|
|सागरी लाटा|सागरी कडा, गुहा, कमान, स्तंभ (stack)|पुळण (beach), वाळूचा दांडा (spit, bar)|
|भूजल (चुनखडी प्रदेश)|विलयछिद्र (sinkhole), गुहा|स्टॅलॅक्टाइट (छतावरून खाली), स्टॅलॅग्माइट (जमिनीवरून वर)|
## चंद्र व हवेचा दाब
- चंद्राला स्वतःभोवती एक फेरी आणि पृथ्वीभोवती एक फेरी पूर्ण करायला सारखाच वेळ लागतो: सुमारे <b>27 दिवस 7 तास</b>. म्हणून चंद्राची एकच बाजू आपल्याला नेहमी दिसते.
- समुद्रसपाटीवरील सरासरी हवेचा दाब <b>1013.25 मिलिबार</b> (76 सेमी पारा). 1 इंच पाऱ्याचा दाब सुमारे <b>34 मिलिबार</b>.`,
sn:["8 ग्रह; सर्वात मोठा गुरू, सर्वात लहान बुध, सर्वात उष्ण शुक्र, लाल ग्रह मंगळ","परिवलन → दिवस-रात्र · परिभ्रमण → ऋतू","विषुवदिन 21 मार्च, 23 सप्टेंबर · मोठा दिवस 21 जून · लहान दिवस 22 डिसेंबर","1° = 4 मिनिटे · भारतीय प्रमाणवेळ 82°30′ पूर्व = GMT + 5:30","ओझोन थर स्थितांबरात · हवामान तपांबरात · रेडिओ लहरी आयनांबरात","दख्खन पठार: बेसॉल्ट (अग्निजन्य) · संगमरवर: रूपांतरित","हिमनदी संचयन: हिमोढ, ड्रमलिन, एस्कर · वारा: बारखान · चुनखडी: स्टॅलॅक्टाइट (वरून), स्टॅलॅग्माइट (खालून)","चंद्र: परिवलन = परिभ्रमण ≈ 27 दिवस 7 तास · हवेचा दाब 1013.25 mb"],
tr:["दिवस-रात्र परिवलनामुळे आणि ऋतू परिभ्रमणामुळे होतात. ही अदलाबदल केली जाते.","ओझोनचा थर तपांबरात आहे असा चुकीचा पर्याय दिला जातो; तो स्थितांबरात आहे.","स्टॅलॅक्टाइट व स्टॅलॅग्माइट यांची अदलाबदल केली जाते: छतावरून लोंबणारा स्टॅलॅक्टाइट, जमिनीवरून वर वाढणारा स्टॅलॅग्माइट."],
q:[]},

{id:"ge2",s:"geo",t:"भारत: एका दृष्टिक्षेपात",imp:2,
pyq:"कर्कवृत्त कोणत्या राज्यांमधून जाते, शेजारी देश, आणि 'सर्वात मोठे/लांब' अशा प्रश्नांवर भर असतो.",
d:`## स्थान व विस्तार
- भारताचे क्षेत्रफळ <b>32,87,263 चौ.कि.मी.</b> आहे. हे जगाच्या सुमारे 2.4% आहे, आणि भारत जगात <b>7 व्या</b> क्रमांकावर आहे.
- भारत संपूर्णपणे उत्तर व पूर्व गोलार्धात आहे. <b>कर्कवृत्त</b> भारताच्या साधारण मध्यातून 8 राज्यांमधून जाते: गुजरात, राजस्थान, मध्य प्रदेश, छत्तीसगड, झारखंड, पश्चिम बंगाल, त्रिपुरा, मिझोराम. (महाराष्ट्रातून ते जात नाही.)
- दक्षिण टोक: <b>इंदिरा पॉइंट</b> (ग्रेट निकोबार). मुख्य भूमीचे दक्षिण टोक कन्याकुमारी.
- भारतात 28 राज्ये व 8 केंद्रशासित प्रदेश आहेत. क्षेत्रफळाने सर्वात मोठे राज्य राजस्थान, सर्वात लहान गोवा. लोकसंख्येने सर्वात मोठे उत्तर प्रदेश.
## शेजारी देश
पाकिस्तान, अफगाणिस्तान, चीन, नेपाळ, भूतान, बांगलादेश, म्यानमार. समुद्रमार्गे श्रीलंका व मालदीव. <b>बांगलादेश</b>सोबतची सीमा सर्वात लांब आहे. पाल्कची सामुद्रधुनी भारत व श्रीलंकेला वेगळे करते.
## प्राकृतिक विभाग
हिमालय, उत्तरेकडील मैदान (गंगा-सिंधू-ब्रह्मपुत्रा), द्वीपकल्पीय पठार, थरचे वाळवंट, किनारी मैदाने, बेटे (अंदमान-निकोबार, लक्षद्वीप).
## 'सर्वात' (पाठ करा)
|बाब|उत्तर|
|भारतातील सर्वोच्च शिखर (भारताच्या ताब्यात)|कांचनजंगा|
|सर्वात लांब नदी|गंगा|
|सर्वात मोठा गोड्या पाण्याचा तलाव|वुलर (जम्मू-काश्मीर)|
|सर्वात मोठा खाऱ्या पाण्याचा तलाव|सांभर (राजस्थान)|
|सर्वात मोठे खारे सरोवर (लगून)|चिलिका (ओडिशा)|
|सर्वाधिक पाऊस|मौसिनराम (मेघालय)|
|सर्वात मोठा त्रिभुज प्रदेश|सुंदरबन|
## हिमालय व उत्तरेकडील मैदान
- हिमालयाच्या रांगा (उत्तरेकडून दक्षिणेकडे): <b>हिमाद्री</b> (बृहद् हिमालय), <b>हिमाचल</b> (लघु हिमालय), <b>शिवालिक</b> (बाह्य हिमालय). शिवालिक व हिमाचल यांच्या दरम्यानच्या सपाट दऱ्यांना '<b>डून</b>' म्हणतात (उदा. डेहराडून).
|पट्टा|वैशिष्ट्य|
|<b>भाबर</b>|शिवालिकच्या पायथ्याशी 8–16 किमी रुंद पट्टा; नद्यांनी आणलेले <b>गोटे, खडक, वाळू</b>; नद्या जमिनीखाली गुप्त होतात|
|<b>तराई</b>|भाबरच्या दक्षिणेस; नद्या पुन्हा वर येतात; दलदल व दाट जंगल|
|<b>भांगर</b>|जुन्या गाळाचा उंच भाग; पुराचे पाणी पोहोचत नाही; कंकर|
|<b>खादर</b>|नव्या गाळाचे पूरमैदान; दरवर्षी नवा गाळ; अतिशय सुपीक|
## भारतातील नदी प्रणाली
- <b>हिमालयीन नद्या</b> बारमाही (बर्फ वितळून व पावसाचे पाणी). <b>द्वीपकल्पीय नद्या</b> मुख्यतः पावसावर अवलंबून.
- <b>सिंधू</b>: उगम तिबेटमध्ये मानसरोवराजवळ. उपनद्या: झेलम, चिनाब, रावी, बियास, सतलज. <b>सिंधू जल करार 1960</b> (जागतिक बँकेच्या मध्यस्थीने): पूर्वेकडील रावी, बियास, सतलज भारताला; सिंधू, झेलम, चिनाब पाकिस्तानला.
- <b>गंगा</b>: भागीरथी (गंगोत्री हिमनदी, गोमुख) व अलकनंदा यांचा संगम <b>देवप्रयाग</b> येथे. डाव्या तीरावरील उपनद्या: रामगंगा, गोमती, घाघरा, गंडक, <b>कोसी</b> ('बिहारचे दुःखाश्रू'). उजव्या तीरावरील: यमुना, सोन. बांगलादेशात तिला 'पद्मा' म्हणतात.
- <b>यमुना</b>: उगम यमुनोत्री; प्रयागराज येथे गंगेला मिळते. तिच्या दक्षिणेकडून येणाऱ्या उपनद्या <b>पश्चिमेकडून पूर्वेकडे: चंबळ, सिंध, बेतवा, केन</b>.
- <b>ब्रह्मपुत्रा</b>: तिबेटमध्ये 'त्सांगपो', अरुणाचलमध्ये 'दिहांग', बांगलादेशात 'जमुना'. आसाममधील <b>माजुली</b> हे मोठे नदीबेट.
- पूर्ववाहिनी द्वीपकल्पीय नद्या (बंगालच्या उपसागराला, त्रिभुज प्रदेश तयार करतात): महानदी (हिराकुड धरण), <b>गोदावरी</b> (सर्वात लांब द्वीपकल्पीय नदी, 'दक्षिण गंगा'), कृष्णा, कावेरी (शिवसमुद्रम येथे 1902 मध्ये आशियातील पहिले जलविद्युत केंद्र).
- पश्चिमवाहिनी (अरबी समुद्राला): <b>नर्मदा</b> (उगम अमरकंटक) व <b>तापी</b> (उगम मुलताई, मध्य प्रदेश). या खचदरीतून वाहतात आणि त्रिभुज प्रदेशाऐवजी <b>खाडी</b> (estuary) तयार करतात. लुणी नदी कच्छच्या रणात संपते.`,
sn:["क्षेत्रफळ 32.87 लाख चौ.कि.मी. · जगात 7 वा · जगाच्या 2.4%","कर्कवृत्त 8 राज्यांतून; महाराष्ट्रातून नाही","दक्षिण टोक इंदिरा पॉइंट · मुख्य भूमी कन्याकुमारी","सर्वात लांब सीमा बांगलादेशसोबत","सर्वात मोठे राज्य राजस्थान · सर्वात लहान गोवा","वुलर गोड्या पाण्याचा · सांभर खारा · चिलिका लगून · मौसिनराम सर्वाधिक पाऊस","भाबर: गोटे-खडक, नद्या गुप्त · तराई: दलदल · भांगर: जुना गाळ · खादर: नवा गाळ","सिंधू करार 1960: पूर्वेकडील 3 (रावी, बियास, सतलज) भारताला · गंगा: भागीरथी + अलकनंदा, देवप्रयाग","यमुनेच्या उपनद्या पश्चिम → पूर्व: चंबळ, सिंध, बेतवा, केन · नर्मदा-तापी पश्चिमवाहिनी, खाडी"],
tr:["कर्कवृत्त महाराष्ट्रातून जाते असा चुकीचा पर्याय दिला जातो; ते जात नाही.","सर्वात लांब सीमा चीन किंवा पाकिस्तानसोबत आहे असा चुकीचा पर्याय दिला जातो; ती बांगलादेशसोबत आहे.","भाबर व तराई यांची अदलाबदल केली जाते: गोटे-खडक असलेला व नद्या गुप्त होणारा पट्टा भाबर; दलदलीचा पट्टा तराई.","नर्मदा व तापी त्रिभुज प्रदेश तयार करतात असा चुकीचा पर्याय येतो; त्या खाडी तयार करतात."],
q:[]},

{id:"ge3",s:"geo",t:"महाराष्ट्र: स्थान, सीमा, प्रशासकीय विभाग",imp:3,
pyq:"शेजारी राज्ये व त्यांना लागून असलेले जिल्हे, नवीन जिल्हे, आणि जिल्ह्यांची नवी नावे यावर हमखास प्रश्न असतो.",
d:`## स्थान व विस्तार
- महाराष्ट्र अंदाजे <b>15°35′ ते 22°02′ उत्तर अक्षांश</b> आणि <b>72°36′ ते 80°54′ पूर्व रेखांश</b> यांच्या दरम्यान आहे. (वेगवेगळ्या पुस्तकांत अक्षांशाचे मिनिटांचे आकडे थोडे वेगळे दिसतात.)
- पूर्व-पश्चिम विस्तार सुमारे 800 कि.मी., उत्तर-दक्षिण सुमारे 700 कि.मी.
- क्षेत्रफळ <b>3,07,713 चौ.कि.मी.</b> (भारताच्या 9.36%) · क्षेत्रफळात <b>तिसरे</b>, लोकसंख्येत <b>दुसरे</b>.
- पश्चिमेला अरबी समुद्र, आणि सुमारे <b>720 कि.मी.</b> लांबीचा कोकण किनारा.

|कर्नाटक (7)|नांदेड, लातूर, धाराशिव, सोलापूर, सांगली, कोल्हापूर, सिंधुदुर्ग|

## प्रशासकीय रचना
- <b>36 जिल्हे</b>, <b>6 महसूल विभाग</b>. सर्वात नवा (36 वा) जिल्हा <b>पालघर</b>, 1 ऑगस्ट 2014 ला ठाण्यातून वेगळा झाला.
|विभाग|जिल्हे|

|पुणे (5)|पुणे, सातारा, सांगली, कोल्हापूर, सोलापूर|
|नाशिक (5)|नाशिक, धुळे, नंदुरबार, जळगाव, अहिल्यानगर|
|छत्रपती संभाजीनगर (8)|छ. संभाजीनगर, जालना, बीड, परभणी, हिंगोली, नांदेड, लातूर, धाराशिव|
|अमरावती (5)|अमरावती, अकोला, वाशिम, बुलढाणा, यवतमाळ|
|नागपूर (6)|नागपूर, वर्धा, भंडारा, गोंदिया, चंद्रपूर, गडचिरोली|
- नवीन नावे: औरंगाबाद → <b>छत्रपती संभाजीनगर</b>, उस्मानाबाद → <b>धाराशिव</b>, अहमदनगर → <b>अहिल्यानगर</b>.
- क्षेत्रफळाने सर्वात मोठा जिल्हा <b>अहिल्यानगर</b>, सर्वात लहान <b>मुंबई शहर</b>.
- राजधानी मुंबई, उपराजधानी नागपूर.`,
sn:["सुमारे 15°35′–22°02′ उ. · 72°36′–80°54′ पू.","क्षेत्रफळ 3,07,713 चौ.कि.मी., 9.36%, तिसरे · लोकसंख्येत दुसरे · किनारा 720 कि.मी.","6 राज्ये + 1 केंद्रशासित प्रदेश सीमेवर; मध्य प्रदेशला सर्वाधिक 8 जिल्हे लागून","गोव्याला फक्त सिंधुदुर्ग लागून · दादरा-नगर हवेलीला पालघर","36 जिल्हे, 6 विभाग · 36 वा जिल्हा पालघर (1 ऑगस्ट 2014)","सर्वात मोठा जिल्हा अहिल्यानगर · सर्वात लहान मुंबई शहर","छ. संभाजीनगर विभागात 8 जिल्हे (सर्वाधिक)"],
tr:["गुजरातला लागून असलेल्या जिल्ह्यांत जळगावचा समावेश करून फसवले जाते; जळगाव मध्य प्रदेशला लागून आहे.","सर्वात मोठा जिल्हा पुणे असा चुकीचा पर्याय दिला जातो; क्षेत्रफळाने सर्वात मोठा अहिल्यानगर आहे."],
q:[]},

{id:"ge4",s:"geo",t:"प्राकृतिक रचना: सह्याद्री, शिखरे, घाट",imp:3,
pyq:"शिखर–जिल्हा, घाट–मार्ग, डोंगररांग कोणत्या दोन नद्यांच्या दरम्यान आहे, आणि थंड हवेचे ठिकाण–जिल्हा यावर दरवर्षी प्रश्न असतो.",
d:`## तीन प्राकृतिक विभाग
1. <b>कोकण किनारपट्टी</b>: अरबी समुद्र व सह्याद्रीच्या दरम्यानची अरुंद पट्टी (रुंदी सुमारे 30–60 कि.मी.). खाड्या आणि लहान वेगवान नद्या.
2. <b>सह्याद्री (पश्चिम घाट)</b>: उत्तर-दक्षिण पसरलेली रांग. ती पश्चिम बाजूला तीव्र उताराची आणि पूर्व बाजूला मंद उताराची आहे.
3. <b>दख्खनचे पठार (देश)</b>: राज्याचा सर्वात मोठा भाग, बेसॉल्ट खडकाचा, पूर्वेकडे उतरता.
## सह्याद्रीच्या उपरांगा (नद्यांच्या दरम्यान)
|उपरांग|कोणत्या नद्यांच्या दरम्यान|
|सातमाळा–अजिंठा|तापी व गोदावरी|
|हरिश्चंद्रगड–बालाघाट|गोदावरी व भीमा|
|महादेव डोंगर|भीमा व कृष्णा|
उत्तरेला <b>सातपुडा</b> रांग आहे; तिचे महाराष्ट्रातील सर्वोच्च शिखर <b>अस्तंभा</b> (नंदुरबार). अमरावतीमधील गाविलगड टेकड्यांत <b>वैराट</b> हे शिखर आहे.
## प्रमुख शिखरे

|महाबळेश्वर|1438 मी.|सातारा|

{id:"ge5",s:"geo",t:"महाराष्ट्रातील नद्या",imp:3,
pyq:"उगमस्थान, उपनदी–मुख्य नदी, आणि 'कोणते शहर कोणत्या नदीकाठी' यावर हमखास 1–2 प्रश्न असतात.",
d:`## नदी प्रणाली
महाराष्ट्राचा उतार पश्चिमेकडून पूर्वेकडे आहे. त्यामुळे गोदावरी, भीमा, कृष्णा या मोठ्या नद्या पूर्वेकडे वाहून <b>बंगालच्या उपसागराला</b> मिळतात. <b>तापी</b> व नर्मदा पश्चिमेकडे वाहून <b>अरबी समुद्राला</b> मिळतात. कोकणातील नद्या लहान, वेगवान आणि पश्चिमवाहिनी आहेत.

|नदी|उगम|महत्त्वाची माहिती|
|<b>गोदावरी</b>|त्र्यंबकेश्वर (नाशिक)|महाराष्ट्रातील सर्वात लांब नदी; 'दक्षिण गंगा'; काठी नाशिक, पैठण, नांदेड|
|<b>कृष्णा</b>|महाबळेश्वर (सातारा)|काठी वाई, कराड, सांगली; कराडला कृष्णा-कोयना 'प्रीतिसंगम'|
|<b>भीमा</b>|भीमाशंकर (पुणे)|कृष्णेची उपनदी (संगम कर्नाटकात); पंढरपूरला 'चंद्रभागा'|
|<b>तापी</b>|मुलताई (मध्य प्रदेश)|पश्चिमवाहिनी; खंबायतच्या आखाताला मिळते; उपनद्या पूर्णा, गिरणा, पांझरा|

- <b>गोदावरी</b>: प्रवरा, दारणा, सिंदफणा, मांजरा, पूर्णा, प्राणहिता, इंद्रावती.
- <b>भीमा</b>: इंद्रायणी, मुळा-मुठा, घोड, नीरा, सीना.
- <b>कृष्णा</b>: कोयना, वारणा, पंचगंगा, वेण्णा, येरळा.

वैतरणा, उल्हास (बहुतेक पुस्तकांनुसार सर्वात लांब कोकणी नदी; काही पुस्तकांत वैतरणा दिलेली असते, म्हणून पर्यायांत दोन्ही असल्यास काळजीपूर्वक वाचा), पाताळगंगा, कुंडलिका, सावित्री, वाशिष्ठी, शास्त्री, तेरेखोल.

|नागपूर|नाग|
|आळंदी, देहू|इंद्रायणी|`,

tr:["भीमा गोदावरीची उपनदी आहे असा चुकीचा पर्याय दिला जातो; ती कृष्णेची उपनदी आहे.","तापीचा उगम महाराष्ट्रात आहे असा चुकीचा पर्याय दिला जातो; उगम मुलताई, मध्य प्रदेश येथे आहे."],

{id:"ge7",s:"geo",t:"हवामान व मृदा",imp:2,
pyq:"पर्जन्यछायेचा प्रदेश, सर्वाधिक पावसाचे ठिकाण, आणि मृदा–प्रदेश–पीक यावर प्रश्न येतात.",
d:`## हवामान
- महाराष्ट्राचे हवामान <b>मान्सूनचे</b> आहे.
- ऋतू: उन्हाळा (मार्च–मे), पावसाळा (जून–सप्टेंबर, <b>नैऋत्य मान्सून</b>), परतीचा मान्सून (ऑक्टोबर–नोव्हेंबर), हिवाळा (डिसेंबर–फेब्रुवारी).
- नैऋत्य वारे सह्याद्रीला अडतात. त्यामुळे <b>कोकण व घाटमाथ्यावर</b> खूप पाऊस (2000–4000 मि.मी.) पडतो. महाराष्ट्रात सर्वाधिक पाऊस आंबोली (सिंधुदुर्ग) व महाबळेश्वर परिसरात पडतो.
- सह्याद्री ओलांडल्यानंतर वाऱ्यातील बाष्प संपते. त्यामुळे पूर्वेकडील सोलापूर, अहिल्यानगर, बीड, सांगली-साताऱ्याचा पूर्व भाग हा <b>पर्जन्यछायेचा</b> (कमी पावसाचा, दुष्काळी) प्रदेश आहे.
- पूर्व विदर्भात बंगालच्या उपसागराकडील शाखेमुळे पाऊस पुन्हा वाढतो (1000–2000 मि.मी.).
- उन्हाळ्यात सर्वाधिक तापमान विदर्भात (नागपूर, चंद्रपूर, ब्रह्मपुरी परिसर) असते. कोकणात तापमान सौम्य, पण आर्द्रता जास्त असते.
## मृदा (माती)
|मृदा|कुठे|वैशिष्ट्य व पिके|
|<b>काळी (रेगूर)</b>|दख्खन पठार; विदर्भ, मराठवाडा, पश्चिम महाराष्ट्र|बेसॉल्टपासून बनलेली; ओलावा धरून ठेवते; <b>कापूस</b>, ज्वारी, ऊस|
|<b>जांभी (लॅटेराइट)</b>|कोकण (रत्नागिरी, सिंधुदुर्ग), कोल्हापूरचा पश्चिम भाग|जास्त पावसात धुपलेली; आंबा, काजू, भात|
|<b>तांबडी-पिवळी</b>|पूर्व विदर्भ (भंडारा, गोंदिया, गडचिरोली, चंद्रपूर)|भात|
|<b>गाळाची</b>|नद्यांच्या खोऱ्यांत (तापी, गोदावरी, वैनगंगा)|सुपीक|
|<b>खारपड</b>|कोकणातील खाड्यांजवळ|खाऱ्या पाण्याचा प्रभाव|
## भारतातील मृदा
|मृदा|माहिती|
|<b>गाळाची</b>|भारतात <b>सर्वाधिक क्षेत्र</b>; उत्तरेकडील मैदाने व किनारी त्रिभुज प्रदेश; अतिशय सुपीक|
|<b>काळी (रेगूर)</b>|दख्खन पठारावर बेसाल्ट खडकापासून; ओलावा धरून ठेवते; <b>कापूस</b>|
|तांबडी|लोहामुळे लाल रंग; तामिळनाडू, कर्नाटक, छत्तीसगड भाग|
|<b>जांभी</b> (लॅटेराइट)|जास्त पाऊस व तापमानामुळे पोषकद्रव्ये वाहून जातात (निक्षालन); काजू, चहा, कॉफी; कोकण|
|वाळवंटी|राजस्थान; क्षारयुक्त व वालुकामय|
|पर्वतीय|हिमालयीन उतार|
## कोपेनचे हवामान वर्गीकरण (भारत)
|संकेत|हवामान|प्रदेश|
|<b>Amw</b>|लहान कोरड्या ऋतूचे मान्सून हवामान|गोव्याच्या दक्षिणेकडील पश्चिम किनारा|
|As|उन्हाळा कोरडा, हिवाळ्यात पाऊस|तामिळनाडूचा कोरोमंडल किनारा|
|Aw|उष्णकटिबंधीय सव्हाना|कर्कवृत्ताच्या दक्षिणेकडील बहुतांश द्वीपकल्पीय पठार|
|BShw|अर्ध-शुष्क स्टेप|वायव्य गुजरात, पश्चिम राजस्थान व पंजाबचा काही भाग|
|BWhw|उष्ण वाळवंट|राजस्थानचा अतिपश्चिम भाग|
|Cwg|कोरड्या हिवाळ्याचे मान्सून हवामान|गंगेचे मैदान, पूर्व राजस्थान, उत्तर मध्य प्रदेश, ईशान्य भारताचा बहुतांश भाग|
|Dfc|थंड, दमट हिवाळा व लहान उन्हाळा|अरुणाचल प्रदेश|
|E|ध्रुवीय प्रकार|जम्मू-काश्मीर, हिमाचल प्रदेश, उत्तराखंडचे उंच भाग|`,
sn:["मान्सून नैऋत्येकडून, जून–सप्टेंबर","कोकण व घाटमाथा: सर्वाधिक पाऊस (आंबोली, महाबळेश्वर)","पर्जन्यछाया: सोलापूर, अहिल्यानगर, बीड (दुष्काळी)","काळी रेगूर: बेसॉल्टपासून; कापूस; ओलावा धरते","जांभी: कोकण; आंबा, काजू · तांबडी-पिवळी: पूर्व विदर्भ; भात","सर्वाधिक तापमान: विदर्भ","भारतात सर्वाधिक क्षेत्र: गाळाची मृदा · काळी (रेगूर): कापूस · जांभी: निक्षालन, काजू","कोपेन: Amw पश्चिम किनारा (गोव्याच्या दक्षिणेस) · As कोरोमंडल · BWhw पश्चिम राजस्थान · Cwg गंगेचे मैदान"],
tr:["पर्जन्यछायेत रत्नागिरी किंवा सिंधुदुर्ग असा चुकीचा पर्याय दिला जातो; हे जिल्हे सर्वाधिक पावसाचे आहेत.","जांभी माती कापसासाठी उत्तम असा चुकीचा पर्याय दिला जातो; कापसासाठी काळी माती उत्तम.","भारतात सर्वाधिक क्षेत्र काळ्या मृदेचे असा पर्याय येतो; सर्वाधिक क्षेत्र गाळाच्या मृदेचे आहे."],
q:[]},

{id:"ge8",s:"geo",t:"शेती व पिके",imp:3,
pyq:"पीक–प्रमुख जिल्हा जोड्या, खरीप व रब्बी पिके, आणि सहकारी साखर कारखाना यावर दरवर्षी प्रश्न येतात.",
d:`## पीक हंगाम
- <b>खरीप</b> (जून–ऑक्टोबर, पावसाळी): भात, खरीप ज्वारी, बाजरी, कापूस, सोयाबीन, तूर, मूग, भुईमूग.
- <b>रब्बी</b> (ऑक्टोबर–मार्च, हिवाळी): गहू, हरभरा, रब्बी ज्वारी, करडई.
- उन्हाळी पिके: भाजीपाला, कलिंगड.
## पीक व प्रमुख प्रदेश
|पीक|प्रमुख जिल्हे / प्रदेश|
|<b>कापूस</b> ('पांढरे सोने')|विदर्भ (यवतमाळ, अमरावती, अकोला, वर्धा), खानदेश|
|<b>सोयाबीन</b>|लातूर, वाशिम, अमरावती, मराठवाडा|
|<b>ऊस</b>|कोल्हापूर, सांगली, सातारा, पुणे, अहिल्यानगर, सोलापूर|
|<b>भात</b>|कोकण आणि पूर्व विदर्भ (भंडारा, गोंदिया)|
|<b>ज्वारी</b>|सोलापूर (मालदांडी ज्वारी), मराठवाडा|
|<b>हळद</b>|सांगली (मोठी बाजारपेठ), हिंगोली (वसमत)|
|<b>संत्री</b>|नागपूर, अमरावती (वरूड)|
|<b>द्राक्षे</b>|नाशिक ('वाईन कॅपिटल'), सांगली, सोलापूर|
|<b>डाळिंब</b>|सोलापूर, नाशिक|
|<b>केळी</b>|जळगाव|
|<b>हापूस आंबा</b>|रत्नागिरी, देवगड (सिंधुदुर्ग)|
|<b>काजू</b>|सिंधुदुर्ग, रत्नागिरी|
|<b>चिकू</b>|डहाणू, घोलवड (पालघर)|
|<b>स्ट्रॉबेरी</b>|महाबळेश्वर|
|<b>कांदा</b>|नाशिक; <b>लासलगाव</b> ही आशियातील सर्वात मोठी कांदा बाजारपेठ|
## सहकार
- आशियातील पहिला <b>सहकारी साखर कारखाना</b> प्रवरानगर (लोणी, अहिल्यानगर) येथे 1949–50 मध्ये सुरू झाला. संस्थापक पद्मश्री <b>विठ्ठलराव विखे पाटील</b>, आणि मार्गदर्शक अर्थशास्त्रज्ञ धनंजयराव गाडगीळ.
- दुग्ध सहकारात कोल्हापूरचा 'गोकुळ' प्रसिद्ध आहे.
- राज्य कृषी विद्यापीठे चार: राहुरी (महात्मा फुले), अकोला (पंजाबराव देशमुख), परभणी (वसंतराव नाईक मराठवाडा), दापोली (बाळासाहेब सावंत कोकण).`,
sn:["खरीप: भात, ज्वारी, बाजरी, कापूस, सोयाबीन, तूर · रब्बी: गहू, हरभरा, रब्बी ज्वारी","कापूस: विदर्भ · सोयाबीन: लातूर · ऊस: पश्चिम महाराष्ट्र · भात: कोकण, पूर्व विदर्भ","हळद: सांगली · संत्री: नागपूर · द्राक्षे: नाशिक · केळी: जळगाव · हापूस: रत्नागिरी · काजू: सिंधुदुर्ग · चिकू: डहाणू","लासलगाव: आशियातील सर्वात मोठी कांदा बाजारपेठ","पहिला सहकारी साखर कारखाना: प्रवरानगर (विखे पाटील, गाडगीळ)","कृषी विद्यापीठे: राहुरी, अकोला, परभणी, दापोली"],
tr:["हरभरा खरीप पीक आहे असा चुकीचा पर्याय दिला जातो; तो रब्बी पीक आहे.","केळीसाठी जळगाव प्रसिद्ध आहे; नाशिक किंवा सांगली असे चुकीचे पर्याय दिले जातात."],
q:[]},

{id:"ge9",s:"geo",t:"खनिजे, उद्योग व वाहतूक",imp:2,
pyq:"खनिज–जिल्हा, उद्योग–शहर, आणि बंदरे व महामार्ग यावर प्रश्न येतात.",
d:`## खनिजे
|खनिज|प्रमुख जिल्हे|
|<b>कोळसा</b>|चंद्रपूर, नागपूर (कामठी), यवतमाळ (वर्धा खोरे)|
|<b>मँगनीज</b>|नागपूर, भंडारा|
|<b>लोहखनिज</b>|गडचिरोली (सुरजागड), सिंधुदुर्ग (रेडी)|
|<b>बॉक्साइट</b>|कोल्हापूर, रत्नागिरी, रायगड|
|<b>चुनखडी</b>|चंद्रपूर, यवतमाळ (सिमेंट उद्योग)|
|खनिज तेल व नैसर्गिक वायू|मुंबई हाय (समुद्रात)|
विदर्भ हा राज्यातील खनिजांनी सर्वात समृद्ध प्रदेश आहे.
## उद्योग
- <b>MIDC</b> (महाराष्ट्र औद्योगिक विकास महामंडळ) 1962 मध्ये स्थापन झाले.
- वाहन उद्योग: पुणे (पिंपरी-चिंचवड, चाकण), छत्रपती संभाजीनगर.
- माहिती तंत्रज्ञान: पुणे (हिंजवडी), मुंबई, नवी मुंबई.
- वस्त्रोद्योग: मुंबईच्या गिरण्या (ऐतिहासिक), <b>इचलकरंजी</b> ('महाराष्ट्राचे मँचेस्टर'), भिवंडी (यंत्रमाग), सोलापूर (चादरी).
- हस्तकला: <b>पैठणी</b> (येवला, पैठण), <b>हिमरू</b> शाली (छ. संभाजीनगर), कोल्हापुरी चप्पल.
- साखर उद्योग: पश्चिम महाराष्ट्र.
## वाहतूक
- पहिली रेल्वे: मुंबई–ठाणे, 16 एप्रिल 1853.
- बंदरे: मुंबई बंदर, आणि देशातील सर्वात मोठे कंटेनर बंदर <b>जवाहरलाल नेहरू बंदर (JNPT)</b>, न्हावा शेवा (रायगड).
- मुंबई–नागपूर '<b>समृद्धी महामार्ग</b>' (हिंदुहृदयसम्राट बाळासाहेब ठाकरे महाराष्ट्र समृद्धी महामार्ग).
- मुंबई–पुणे द्रुतगती महामार्ग: भारतातील पहिला द्रुतगती महामार्ग.
- कोकण रेल्वे: रोहा (रायगड) ते ठोकूर (कर्नाटक).
## भारतातील उद्योग व वाहतूक
|पोलाद प्रकल्प|राज्य|विशेष|
|TISCO, जमशेदपूर (1907)|झारखंड|खाजगी क्षेत्रातील पहिला मोठा प्रकल्प|
|भिलाई|छत्तीसगड|रशियाच्या सहकार्याने|
|<b>राउरकेला</b>|<b>ओडिशा</b>|जर्मनीच्या सहकार्याने|
|दुर्गापूर|पश्चिम बंगाल|ब्रिटनच्या सहकार्याने|
|बोकारो|झारखंड|रशियाच्या सहकार्याने|
|विशाखापट्टणम|आंध्र प्रदेश|समुद्रकिनाऱ्यावरील प्रकल्प|
- तेलशुद्धीकरण: <b>दिग्बोई</b> (आसाम, 1901; सर्वात जुना) · <b>नूनमती</b> (गुवाहाटी, आसाम; सार्वजनिक क्षेत्रातील पहिला, 1962) · जामनगर (गुजरात; जगातील सर्वात मोठे शुद्धीकरण संकुल).
- कापड: भारतातील पहिली कापड गिरणी <b>मुंबई, 1854</b> (कावसजी नानाभाय दावर). ताग: हुगळी खोरे (पश्चिम बंगाल); पहिली ताग गिरणी रिश्रा (1855). सिमेंट: पहिला कारखाना चेन्नई (1904).
- कोळशाचे प्रकार (कार्बनचे प्रमाण जास्त ते कमी): <b>अँथ्रासाइट > बिट्युमिनस > लिग्नाइट > पीट</b>. लिग्नाइट: नेवेली (तामिळनाडू).
- रेल्वे विभागांची मुख्यालये: मध्य रेल्वे मुंबई (CSMT) · पश्चिम रेल्वे मुंबई (चर्चगेट) · <b>ईशान्य रेल्वे गोरखपूर</b> · ईशान्य सरहद्द रेल्वे मालीगाव (गुवाहाटी) · दक्षिण मध्य रेल्वे सिकंदराबाद · उत्तर रेल्वे नवी दिल्ली.
- महाराष्ट्रातील (व भारतातील) पहिली विजेवर चालणारी रेल्वे <b>3 फेब्रुवारी 1925</b> रोजी <b>मुंबई (VT) ते कुर्ला</b> धावली.`,
sn:["कोळसा: चंद्रपूर, नागपूर, यवतमाळ · मँगनीज: नागपूर, भंडारा","लोह: गडचिरोली (सुरजागड) · बॉक्साइट: कोल्हापूर, रत्नागिरी · चुनखडी: चंद्रपूर","मुंबई हाय: समुद्रातील तेलक्षेत्र","MIDC 1962 · इचलकरंजी: महाराष्ट्राचे मँचेस्टर · पैठणी: येवला, पैठण · हिमरू: छ. संभाजीनगर","JNPT न्हावा शेवा: सर्वात मोठे कंटेनर बंदर","मुंबई–पुणे: पहिला द्रुतगती महामार्ग · समृद्धी: मुंबई–नागपूर · कोकण रेल्वे: रोहा–ठोकूर","राउरकेला ओडिशा (जर्मनी) · भिलाई छत्तीसगड (रशिया) · दुर्गापूर प. बंगाल (ब्रिटन) · TISCO 1907","दिग्बोई 1901 सर्वात जुनी रिफायनरी · नूनमती (आसाम) · पहिली कापड गिरणी मुंबई 1854","कोळसा: अँथ्रासाइट > बिट्युमिनस > लिग्नाइट > पीट · पहिली विद्युत रेल्वे मुंबई–कुर्ला 1925 · ईशान्य रेल्वे गोरखपूर"],
tr:["मँगनीज कोल्हापुरात आढळते असा चुकीचा पर्याय दिला जातो; कोल्हापुरात बॉक्साइट आढळते, मँगनीज नागपूर-भंडाऱ्यात.","'महाराष्ट्राचे मँचेस्टर' भिवंडी असा चुकीचा पर्याय दिला जातो; ते इचलकरंजी आहे.","राउरकेला प्रकल्प रशियाच्या मदतीने असा पर्याय येतो; राउरकेला जर्मनी, भिलाई व बोकारो रशिया, दुर्गापूर ब्रिटन."],
q:[]},

{id:"ge10",s:"geo",t:"वने, वन्यजीव व लोकसंख्या",imp:3,
pyq:"राष्ट्रीय उद्याने व व्याघ्र प्रकल्प–जिल्हा, रामसर स्थळे, आणि 2011 च्या जनगणनेचे आकडे यावर दरवर्षी प्रश्न असतो.",
d:`## वने
महाराष्ट्राच्या एकूण क्षेत्रफळाच्या सुमारे 20% भागावर वने आहेत. <b>गडचिरोली</b> जिल्ह्यात सर्वाधिक वने आहेत. सागवान हे महत्त्वाचे वृक्ष आहे (चंद्रपूर, गडचिरोली).
## राष्ट्रीय उद्याने (6)
|उद्यान|जिल्हा|
|<b>ताडोबा</b> (1955; राज्यातील सर्वात जुने)|चंद्रपूर|
|पेंच (जवाहरलाल नेहरू)|नागपूर|
|नवेगाव|गोंदिया|
|गुगामल (मेळघाट)|अमरावती|
|चांदोली|सांगली (कोल्हापूर, सातारा, रत्नागिरी सीमेवर)|
|संजय गांधी (बोरिवली)|मुंबई उपनगर / ठाणे; शहरातले उद्यान|
## व्याघ्र प्रकल्प (6)
<b>मेळघाट</b> (अमरावती; राज्यातील पहिला, 1973–74), ताडोबा-अंधारी (चंद्रपूर), पेंच (नागपूर), सह्याद्री (कोयना-चांदोली), नवेगाव-नागझिरा (गोंदिया-भंडारा), बोर (वर्धा).
## अभयारण्ये व विशेष स्थळे
- भीमाशंकर (पुणे): <b>शेकरू</b> (राज्य प्राणी) · राधानगरी (कोल्हापूर): <b>गवा</b> · नान्नज (सोलापूर): माळढोक पक्षी · मयुरेश्वर (सुपे, पुणे): मोर · कर्नाळा (रायगड): पक्षी अभयारण्य · मालवण: सागरी अभयारण्य.
- <b>रामसर स्थळे</b> (आंतरराष्ट्रीय महत्त्वाची पाणथळे): <b>नांदूर मधमेश्वर</b> (नाशिक; 'महाराष्ट्राचे भरतपूर'), <b>लोणार सरोवर</b> (बुलढाणा; उल्कापातामुळे बनलेले खाऱ्या पाण्याचे सरोवर), <b>ठाणे खाडी</b> (फ्लेमिंगो).
## लोकसंख्या (जनगणना 2011)
|बाब|आकडा|
|एकूण लोकसंख्या|11,23,74,333 (देशात दुसरी)|
|घनता|365 प्रति चौ.कि.मी.|
|लिंग गुणोत्तर|929 (प्रति 1000 पुरुषांमागे स्त्रिया)|
|साक्षरता|82.34%|

d:`## अर्थव्यवस्थेची क्षेत्रे
- <b>प्राथमिक क्षेत्र</b>: शेती, मासेमारी, वनीकरण, खाणकाम (थेट निसर्गावर आधारित).
- <b>द्वितीयक क्षेत्र</b>: उद्योग, बांधकाम, वीज निर्मिती (कच्च्या मालापासून वस्तू बनवणे).
- <b>तृतीयक क्षेत्र (सेवा)</b>: बँका, वाहतूक, शिक्षण, IT, पर्यटन.
भारताच्या GDP मध्ये सेवा क्षेत्राचा वाटा सर्वात मोठा आहे, पण सर्वाधिक लोकांना रोजगार अजूनही शेती देते. भारताची अर्थव्यवस्था <b>मिश्र अर्थव्यवस्था</b> आहे (सरकारी व खासगी दोन्ही क्षेत्रे).
## राष्ट्रीय उत्पन्नाच्या संकल्पना
|संकल्पना|अर्थ|
|<b>GDP</b> (स्थूल देशांतर्गत उत्पादन)|देशाच्या <b>सीमेच्या आत</b> एका वर्षात तयार झालेल्या सर्व अंतिम वस्तू-सेवांचे बाजारमूल्य|
|<b>GNP</b> (स्थूल राष्ट्रीय उत्पादन)|GDP + परदेशातून मिळालेले निव्वळ उत्पन्न (भारतीयांनी परदेशात कमावलेले − परदेशींनी भारतात कमावलेले)|
|<b>NNP</b> (निव्वळ राष्ट्रीय उत्पादन)|GNP − घसारा (यंत्रांची झीज)|
|<b>राष्ट्रीय उत्पन्न</b>|घटक किमतीला NNP|
|<b>दरडोई उत्पन्न</b>|राष्ट्रीय उत्पन्न ÷ लोकसंख्या|
## कोण मोजते?
भारतात राष्ट्रीय उत्पन्न <b>राष्ट्रीय सांख्यिकी कार्यालय (NSO)</b> मोजते; ते सांख्यिकी मंत्रालयाच्या अंतर्गत आहे (पूर्वी CSO). <b>नवे आधारवर्ष 2022–23</b>: ही नवी GDP मालिका 27 फेब्रुवारी 2026 रोजी प्रसिद्ध झाली. त्याआधी आधारवर्ष 2011–12 होते (जुन्या पुस्तकांत तेच दिसेल).
## इतिहास
- राष्ट्रीय उत्पन्नाचा पहिला अंदाज <b>दादाभाई नौरोजी</b> यांनी 1867–68 साठी काढला.
- पहिला शास्त्रीय अंदाज <b>डॉ. व्ही. के. आर. व्ही. राव</b> (1931).
- स्वातंत्र्यानंतर 1949 मध्ये <b>पी. सी. महालनोबीस</b> यांच्या अध्यक्षतेखाली राष्ट्रीय उत्पन्न समिती नेमली गेली.
## 1991 च्या आर्थिक सुधारणा
1991 मध्ये परकीय चलनाचे संकट आले. तेव्हा पंतप्रधान पी. व्ही. नरसिंह राव आणि अर्थमंत्री <b>डॉ. मनमोहन सिंग</b> यांनी <b>LPG</b> सुधारणा आणल्या: उदारीकरण (Liberalisation), खासगीकरण (Privatisation), जागतिकीकरण (Globalisation). आर्थिक पाहणी अहवाल अर्थसंकल्पाच्या एक दिवस आधी संसदेत मांडला जातो.
## राष्ट्रीय उत्पन्न: सूत्रे
- राष्ट्रीय उत्पन्न मोजण्याच्या 3 पद्धती: <b>उत्पादन (मूल्यवर्धित) पद्धत, उत्पन्न पद्धत, खर्च पद्धत</b>.
- खर्च पद्धतीने <b>GDP = C + I + G + (X − M)</b> (C उपभोग खर्च, I गुंतवणूक, G सरकारी खर्च, X निर्यात, M आयात).
- <b>GNP</b> = GDP + परदेशातून मिळणारे निव्वळ घटक उत्पन्न.
- <b>NNP</b> = GNP − घसारा (स्थिर भांडवलाचा उपभोग). त्याचप्रमाणे NVA = GVA − घसारा.
- <b>राष्ट्रीय उत्पन्न</b> = घटक खर्चावरील NNP (NNP at factor cost) = बाजारभावावरील NNP − अप्रत्यक्ष कर + अनुदाने.
- GDP = मूलभूत किमतीवरील GVA + उत्पादनांवरील कर − उत्पादनांवरील अनुदाने.
## महत्त्वाचे नियम, वक्र व निर्देशांक

## WTO व ब्रेटन वूड्स संस्था
- WTO च्या कृषी अनुदानांचे 'बॉक्स': <b>अंबर बॉक्स</b> (व्यापार बिघडवणारी; मर्यादा), ब्लू बॉक्स (उत्पादन मर्यादित ठेवणारी), <b>ग्रीन बॉक्स</b> (व्यापार न बिघडवणारी; मर्यादा नाही). विकसित देश आपली अनुदाने ग्रीन बॉक्समध्ये दाखवतात.
- WTO चे करार: TRIPS (बौद्धिक संपदा), TRIMS (गुंतवणूक), GATS (सेवा). WTO ने 1995 मध्ये GATT (1947) ची जागा घेतली.

sn:["प्राथमिक: शेती · द्वितीयक: उद्योग · तृतीयक: सेवा (GDP मध्ये सर्वाधिक वाटा)","GDP: देशाच्या सीमेत · GNP = GDP + परदेशातून निव्वळ उत्पन्न · NNP = GNP − घसारा","राष्ट्रीय उत्पन्न NSO मोजते; नवे आधारवर्ष 2022–23 (फेब्रु 2026 पासून; आधी 2011–12)","पहिला अंदाज दादाभाई नौरोजी · शास्त्रीय अंदाज व्ही. के. आर. व्ही. राव · समिती 1949 महालनोबीस","1991 LPG सुधारणा: नरसिंह राव व मनमोहन सिंग","GDP = C + I + G + (X − M) · राष्ट्रीय उत्पन्न = घटक खर्चावरील NNP · NNP = GNP − घसारा","ग्रेशम: वाईट पैसा चांगल्याला हाकलतो · लॅफर: कर दर-महसूल · फिलिप्स: महागाई-बेरोजगारी · गिनी: विषमता","HDI: UNDP, 1990 · लोकसंख्या संक्रमण टप्पा 3: जन्मदर घटतो · रिकार्डो: तुलनात्मक लाभ","औद्योगिक धोरणे 1948 (मिश्र), 1956 (17 राखीव), 1991 (LPG, 8 राखीव) · WTO ग्रीन बॉक्स"],
tr:["GDP मध्ये परदेशात काम करणाऱ्या भारतीयांचे उत्पन्न येते असा चुकीचा पर्याय दिला जातो; ते GNP मध्ये येते.","NNP काढताना कर वजा करतात असा चुकीचा पर्याय दिला जातो; प्रत्यक्षात घसारा वजा करतात.","'निर्यात–आयात पद्धत' ही राष्ट्रीय उत्पन्न मोजण्याची पद्धत म्हणून दिली जाते; अशी पद्धत नाही (उत्पादन, उत्पन्न, खर्च या तीनच).","लॅफर व फिलिप्स वक्रांची अदलाबदल केली जाते: लॅफर = कर, फिलिप्स = महागाई व बेरोजगारी."],
q:[]},

d:`## भारतीय रिझर्व्ह बँक (RBI)

## बँकांचे प्रकार
व्यापारी बँका (सरकारी व खासगी), सहकारी बँका, प्रादेशिक ग्रामीण बँका, लघु वित्त बँका, आणि पेमेंट बँका (या कर्ज देऊ शकत नाहीत).
## शेअर बाजार
मुंबई शेअर बाजार (<b>BSE</b>, 1875) हा आशियातील सर्वात जुना शेअर बाजार आहे; त्याचा निर्देशांक <b>सेन्सेक्स</b> (30 कंपन्या). राष्ट्रीय शेअर बाजार (<b>NSE</b>) चा निर्देशांक <b>निफ्टी</b> (50 कंपन्या).
## RBI व बँकिंग: नावे व वर्षे
- RBI चे पहिले गव्हर्नर सर ऑसबॉर्न स्मिथ; <b>पहिले भारतीय गव्हर्नर सी. डी. देशमुख</b> (1943).
- बँक राष्ट्रीयीकरण: <b>19 जुलै 1969</b>: ₹50 कोटींपेक्षा जास्त ठेवी असलेल्या <b>14</b> बँका · <b>15 एप्रिल 1980</b>: ₹200 कोटींपेक्षा जास्त ठेवी असलेल्या <b>6</b> बँका.
- पत अधिकृतीकरण योजना (Credit Authorisation Scheme): नोव्हेंबर 1965.
- <b>नरसिंहम समिती</b>: पहिली 1991 (वित्तीय क्षेत्र सुधारणा), दुसरी <b>1998</b> (बँकिंग क्षेत्र सुधारणा).
- <b>NPCI</b> (नॅशनल पेमेंट्स कॉर्पोरेशन ऑफ इंडिया, 2008; RBI व भारतीय बँक संघाच्या पुढाकाराने): <b>UPI</b> (2016), RuPay, IMPS, BHIM, FASTag.
- प्रधानमंत्री जनधन योजना 28 ऑगस्ट 2014. ऑगस्ट 2018 पासून विस्तारित योजनेत तीन बदल: ओव्हरड्राफ्ट मर्यादा ₹5,000 वरून ₹10,000, नवीन RuPay कार्डधारकांना अपघात विमा ₹1 लाखावरून ₹2 लाख, आणि ओव्हरड्राफ्टसाठी वयोमर्यादा 60 वरून 65.`,
sn:["RBI: 1 एप्रिल 1935, हिल्टन यंग आयोग; राष्ट्रीयीकरण 1 जानेवारी 1949; मुख्यालय मुंबई","₹1 नोट व नाणी: वित्त मंत्रालय · इतर नोटा: RBI","SBI 1955 · 14 बँका 19 जुलै 1969 · 6 बँका 1980","RRB 1975 · NABARD 1982 · SEBI 1988/1992 · SIDBI 1990","निश्चलनीकरण 8 नोव्हेंबर 2016","BSE 1875 सेन्सेक्स (30) · NSE निफ्टी (50)","पहिले भारतीय RBI गव्हर्नर सी. डी. देशमुख · राष्ट्रीयीकरण 1969 (14 बँका, ₹50 कोटी), 1980 (6 बँका, ₹200 कोटी)","नरसिंहम 1991 व 1998 · UPI: NPCI"],
tr:["₹1 ची नोट RBI छापते असा चुकीचा पर्याय दिला जातो; ती वित्त मंत्रालय काढते.","RBI ची स्थापना 1949 असा चुकीचा पर्याय दिला जातो; 1949 हे राष्ट्रीयीकरणाचे वर्ष आहे, स्थापना 1935 ची."],

{id:"ec3",s:"eco",t:"चलनविषयक धोरण व महागाई",imp:3,
pyq:"रेपो, रिव्हर्स रेपो, CRR, SLR यांचे अर्थ, आणि महागाई वाढल्यावर RBI काय करते, यावर हमखास प्रश्न असतो.",
d:`## चलनविषयक धोरण म्हणजे काय?
अर्थव्यवस्थेतील पैशाचा पुरवठा आणि व्याजदर नियंत्रित करण्याचे धोरण. ते <b>RBI</b> ठरवते. 2016 पासून RBI गव्हर्नरच्या अध्यक्षतेखालील 6 सदस्यांची <b>चलनविषयक धोरण समिती (MPC)</b> व्याजदर ठरवते. महागाईचे लक्ष्य <b>CPI 4% (±2%)</b> आहे.
## साधने (सोप्या भाषेत)
|साधन|अर्थ|
|<b>रेपो दर</b>|RBI बँकांना अल्पकाळासाठी (रोखे तारण ठेवून) ज्या दराने कर्ज देते|
|रिव्हर्स रेपो दर|बँका RBI कडे पैसे ठेवतात तेव्हा मिळणारा दर (एप्रिल 2022 पासून सर्वात खालचा दर म्हणून याऐवजी स्थायी ठेव सुविधा SDF वापरली जाते)|
|बँक दर|RBI दीर्घकाळासाठी बँकांना कर्ज देते तो दर|
|<b>CRR</b> (रोख राखीव प्रमाण)|बँकांनी ठेवींचा काही भाग <b>RBI कडे रोख</b> ठेवायचा; त्यावर व्याज मिळत नाही|
|<b>SLR</b> (वैधानिक तरलता प्रमाण)|बँकांनी ठेवींचा काही भाग <b>स्वतःकडे</b> सोने, रोख किंवा सरकारी रोख्यांत ठेवायचा|
|खुल्या बाजारातील व्यवहार|RBI सरकारी रोखे विकते किंवा विकत घेते|
## महागाई वाढली तर RBI काय करते?
महागाई म्हणजे बाजारात पैसा जास्त आणि वस्तू कमी. म्हणून RBI पैसा कमी करते: <b>रेपो दर, CRR, SLR वाढवते</b>, आणि रोखे विकते. यामुळे कर्ज महाग होते, मागणी कमी होते, आणि किमती खाली येतात. याला '<b>महाग पैशाचे धोरण</b>' म्हणतात. मंदीच्या काळात याच्या उलट 'स्वस्त पैशाचे धोरण' वापरले जाते.
## महागाई (चलनवाढ)
- वस्तूंच्या सर्वसाधारण किमती सतत वाढणे आणि पैशाची खरेदीशक्ती कमी होणे.
- <b>मागणी-प्रेरित</b>: मागणी जास्त, पुरवठा कमी · <b>खर्च-प्रेरित</b>: कच्चा माल, इंधन, मजुरी महाग झाल्याने.
- <b>WPI</b> (घाऊक किंमत निर्देशांक): वाणिज्य मंत्रालयाचे आर्थिक सल्लागार कार्यालय काढते.
- <b>CPI</b> (ग्राहक किंमत निर्देशांक): NSO काढते. RBI हाच निर्देशांक वापरते.
- <b>मंदीसह महागाई</b> (स्टॅगफ्लेशन): उत्पादन घटते आणि किमतीही वाढतात.
- <b>चलनघट</b> (डिफ्लेशन): किमती सतत घटणे.`,
sn:["चलनविषयक धोरण: RBI; MPC (6 सदस्य, 2016)","महागाई लक्ष्य: CPI 4% ± 2%","रेपो: RBI → बँका कर्ज · रिव्हर्स रेपो: बँका → RBI ठेव","CRR: RBI कडे रोख · SLR: बँकेकडेच सोने/रोख/रोखे","महागाईत रेपो, CRR, SLR वाढवतात (महाग पैसा)","WPI: वाणिज्य मंत्रालय · CPI: NSO (RBI हा वापरते)","स्टॅगफ्लेशन: मंदी + महागाई"],
